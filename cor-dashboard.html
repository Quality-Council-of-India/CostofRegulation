Factory Licence processes to enable document reuse and minimise repeated documentation."},{"source":"ed","category":"suggestions","tags":["PORTAL","CLARITY"],"sentiment":"suggestion","text":"The official recommended strengthening the online portal with comprehensive document checklists and pre-submission validation."},{"source":"fgd","category":"pain","tags":["INTERDEP","TIMELINE"],"sentiment":"issue","text":"Factory Licence is the final compliance stage, so delays in land, building plan, fire, electricity or pollution approvals directly delay commencement of operations."},{"source":"fgd","category":"delay","tags":["GRIEVANCE"],"sentiment":"issue","text":"Participants said the online application itself is not difficult, but follow-up and internal departmental processing create the real delays."},{"source":"fgd","category":"pain","tags":["GRIEVANCE","CLARITY"],"sentiment":"issue","text":"Applicants may need multiple follow-ups because they cannot always identify where in the process an application or document is pending."},{"source":"fgd","category":"pain","tags":["CONSULT","INFORMAL"],"sentiment":"issue","text":"Consultant support may become necessary just to track applications and resolve pending issues, increasing the cost burden for applicants."},{"source":"fgd","category":"policy","tags":["INTERDEP","PORTAL"],"sentiment":"issue","text":"The single-window framework does not yet provide a fully integrated end-to-end approval process across departments."},{"source":"fgd","category":"suggestions","tags":["COMPLY","DUPDOC"],"sentiment":"suggestion","text":"Experts suggested reducing requirements that are legally or practically redundant for smaller or low-risk units."},{"source":"fgd","category":"suggestions","tags":["INTERDEP"],"sentiment":"suggestion","text":"A single nodal authority or lead department was suggested to coordinate and track all factory-related approvals."},{"source":"fgd","category":"delay","tags":["TIMELINE"],"sentiment":"issue","text":"A prescribed processing timeline of 30 days was referenced by participants, but internal movement between departments affects actual processing time."},{"source":"fgd","category":"redundant","tags":["PORTAL","DUPDOC"],"sentiment":"issue","text":"Migration to the new portal resulted in previously submitted documents not always being available, requiring applicants to re-upload them."},{"source":"fgd","category":"suggestions","tags":["DUPDOC","PORTAL"],"sentiment":"suggestion","text":"A DigiLocker-type repository was suggested so departments can retrieve documents the applicant has already submitted, rather than requesting them again."},{"source":"fgd","category":"suggestions","tags":["INTERDEP","TIMELINE"],"sentiment":"suggestion","text":"Participants suggested linking land, building plan, fire, electricity, pollution and Factory Licence processes so eligible approvals can run in parallel."},{"source":"secondary","category":"remarks","tags":["PORTAL","POSITIVE"],"sentiment":"positive","text":"Secondary research found Chhattisgarh's Single Window System 2.0 ('OneClick') portal relaunched in July 2024, offering single login, e-challan payment and department queries routed through the portal."},{"source":"secondary","category":"policy","tags":["CLARITY"],"sentiment":"neutral","text":"Secondary research found the Chhattisgarh Ease of Doing Business Bill, 2026, passed by the Assembly on 16 July 2026, is reported to introduce a risk-based, deemed/auto-approval framework (30-60 days by category) with self-certification across an initial 43 services, which would directly contradict the ED's statement that no deemed-approval mechanism exists for Factory Licence — but whether the Bill has commenced and whether Factory Licence is among the covered services could not be confirmed."}],"quotes":[{"speaker":"Participants","quote":"The application process itself is not very difficult, but the follow-up and internal processing create delays.","topic":"Process Efficiency","tags":["TIMELINE","GRIEVANCE"],"sentiment":"issue"},{"speaker":"Participants","quote":"The Factory Licence is the last major compliance before the manufacturing unit can start operations.","topic":"Sequential Compliance","tags":["INTERDEP"],"sentiment":"neutral"},{"speaker":"Participants","quote":"The biggest issue is that the single-window portal exists, but the departments are not fully interconnected.","topic":"Single Window Gap","tags":["PORTAL","INTERDEP"],"sentiment":"issue"},{"speaker":"Participants","quote":"If an application is held up at a particular stage, there is no clear online update showing where exactly it is stuck.","topic":"Application Tracking","tags":["GRIEVANCE","PORTAL"],"sentiment":"issue"},{"speaker":"Participants","quote":"Applicants have to visit the concerned department multiple times just to find out the status of their application.","topic":"Physical Follow-up","tags":["GRIEVANCE"],"sentiment":"issue"},{"speaker":"Participants","quote":"A consultant has to be hired because applicants do not always know where the application is pending or what needs to be done next.","topic":"Intermediary Dependency","tags":["CONSULT"],"sentiment":"issue"}],"gaps":[{"flag":"MISSING","text":"No numerical statutory or average processing timeline for Factory Licence is stated anywhere in the ED. The FGD references a '30-day prescribed timeline' but this was not independently corroborated by the official."},{"flag":"MISSING","text":"The validity period of the Factory Licence and its renewal cycle are not specified in either the ED or FGD."},{"flag":"MISSING","text":"No exact statutory fee amount is given anywhere in the sources — only the fee determinants (installed power, manpower, cost of construction) and the fact that fees rise 30% every three years."},{"flag":"VAGUE","text":"Deemed-approval status is not clearly stated. The ED says only that 'the source report does not specify whether deemed approval is available' and that 'no specific operational mechanism for deemed approval was identified in the discussion' — this is an absence of discussion, not a definitive confirmation that no deemed-approval mechanism exists."},{"flag":"INCONSISTENT","text":"The ED states applications and their status 'can be tracked online,' listed as part of the application process flow. The FGD directly contradicts this in practice: 'If an application is held up at a particular stage, there is no clear online update showing where exactly it is stuck,' and 'the biggest issue is that the single-window portal exists, but the departments are not fully interconnected.'"},{"flag":"INCONSISTENT","text":"The FGD references 'a prescribed processing timeline discussed was 30 days,' but the ED explicitly states 'the source report does not specify a numerical statutory or average processing timeline for Factory Licence.' The two sources do not agree on whether a concrete day-count figure exists."},{"flag":"REFORM","text":"The official himself flagged the 30%-every-three-years fee escalation as 'a potential area for review,' and separately recommended integrating Factory Building Plan Approval with the Factory Licence process to cut repeated documentation — both are concrete, official-sourced reform directions, echoed independently by the FGD's call to link building-plan, fire, electricity and pollution approvals to run in parallel."},{"flag":"SECONDARY_OPEN","text":"Secondary research found the Chhattisgarh Ease of Doing Business Bill, 2026 (Assembly-passed 16 Jul 2026) reportedly introduces deemed/auto-approval and self-certification across an initial 43 services, which would resolve the ED's 'no deemed approval mechanism identified' gap if Factory Licence is covered and the Bill has commenced — but Governor's assent, gazette notification, commencement date and service coverage could not be confirmed, so this gap remains open. A separate low-confidence secondary source suggesting a Rule 5 validity change from 10 to 15 years (notification RULE-5/39/2025-LABOUR, Aug 2025) also could not be confirmed against primary text, so the validity-period gap likewise remains open."}]},{"code":"DNHDD","name":"Dadra & Nagar Haveli and Daman & Diu","fgdPending":false,"issuingAuthority":"Labour/Factory authority, via the EODB Single Window Portal for Industrial Clearances (swp.dddgov.in), under the Factories Act, 1948.","portal":{"name":"EODB Single Window Portal (swp.dddgov.in)","url":"https://swp.dddgov.in"},"timeline":{"minDays":20,"maxDays":25,"basis":"Administrative practice, not a statutory turnaround under the Factories Act","text":"~20-25 working days end-to-end."},"automationLevel":"partial","applicantOfficeVisit":"no","documents":["Structural drawings, site plans, manufacturing process flowcharts (for plan approval)","Ownership/lease deed, list of directors, safety clearances (for licence registration)","A fixed 7-document checklist overall"],"documentsNote":"","deemedApproval":{"status":"no","days":null,"text":"None currently — approval is granted only after actual scrutiny and site inspection by the safety officer. The expert suggested exploring a deemed-approval clause for cases where scrutiny is not completed within a defined period, without diluting site inspection for high-risk units."},"validity":{"text":"A fee ceiling of about ₹1 lakh applies, and applicants can opt for a lower tenure; exact validity slabs and fee schedule were \"not confirmed during this discussion.\""},"fees":{"text":"Processing and licence fee paid online via digital challan; payment ceiling ~₹1 lakh; a lower-tenure registration option reduces the fee. Exact slabs not detailed."},"steps":[{"n":1,"phase":"apply","title":"Register on the EODB Single Window Portal","automated":true,"note":"Fill the Common Application Form, create a Unit."},{"n":2,"phase":"apply","title":"Apply for Plan Approval / Permission to Construct","automated":true,"note":"Upload structural drawings, site plans, manufacturing process flowcharts.","documents":["Structural drawings, site plans, manufacturing process flowcharts (for plan approval)"]},{"n":3,"phase":"scrutiny","title":"Department reviews plan and issues plan clearance","automated":true,"note":""},{"n":4,"phase":"apply","title":"Apply for Registration of Licence","automated":true,"note":"Submit ownership/lease deed, list of directors, safety clearances."},{"n":5,"phase":"apply","title":"Upload balance documents","automated":true,"note":"Against a fixed 7-document checklist.","documents":["Ownership/lease deed, list of directors, safety clearances (for licence registration)","A fixed 7-document checklist overall"]},{"n":6,"phase":"fee","title":"Pay processing and licence fee","automated":true,"note":"Online, via digital challan."},{"n":7,"phase":"scrutiny","title":"Department verifies against checklist","automated":true,"note":"Machinery, safety systems, staircases, ventilation, layout/machinery plan."},{"n":8,"phase":"inspect","title":"Safety officer conducts on-site inspection","automated":false,"note":""},{"n":9,"phase":"approve","title":"Department approves on completion of scrutiny/inspection","automated":true,"note":"No deemed-approval provision — approval is granted only after actual review concludes."},{"n":10,"phase":"approve","title":"Applicant downloads the digitally signed Factory License certificate","automated":true,"note":"From the portal."}],"ed":{"date":"06-08-2026 (recorded as \"Minutes of Meeting\")","location":"Vidhyut Bhavan, Kachigam, Daman","expert":"Shri J.B. Chauhan (Labour Inspector) and Ms. Apexa Bhandari (Office Assistant)","designation":"Labour Department, DNH & DD"},"fgdMeta":"6 participants, Mixed sector, Vidhyut Bhavan, Daman · 5 Aug 2026 · 53 min 47 sec","findings":[{"source":"ed","category":"procedural","tags":["PORTAL"],"sentiment":"neutral","text":"The Factory License process runs as a 10-step, largely digital workflow on the EODB Single Window Portal for Industrial Clearances (swp.dddgov.in): registration and plan-approval application, document upload, departmental scrutiny, license-registration application, fee payment via digital challan, checklist verification, a safety-officer site inspection, and finally download of a digitally signed license certificate."},{"source":"ed","category":"pain","tags":["PORTAL","CLARITY"],"sentiment":"issue","text":"Despite the largely digital process, certain documents still need to be submitted offline in specific cases, introducing a manual step into an otherwise online workflow — the official's principal identified friction point."},{"source":"ed","category":"policy","tags":["DUPDOC"],"sentiment":"positive","text":"The department works off a deliberately concise, fixed checklist of 7 prescribed documents (structural drawings/site plans/process flowcharts for plan approval; ownership or lease deed, list of directors, and safety clearances for license registration), with no duplicate or redundant documentation flagged."},{"source":"ed","category":"delay","tags":["TIMELINE"],"sentiment":"neutral","text":"The end-to-end process takes approximately 20-25 working days, which reflects UT-level administrative practice rather than a statutory turnaround prescribed under the Factories Act, 1948."},{"source":"ed","category":"policy","tags":["FEES","CLARITY"],"sentiment":"neutral","text":"The processing and license fee is paid online via digital challan, subject to a payment ceiling of approximately Rs. 1 lakh; applicants may opt for a lower tenure of registration at a correspondingly lower fee, but exact fee slabs by unit size, employee strength, or tenure were not detailed."},{"source":"ed","category":"policy","tags":["RENEWAL","CLARITY"],"sentiment":"neutral","text":"Exact validity slabs for the Factory License, and whether an extended or lifetime validity comparable to Plan Approval could be introduced, were not confirmed during the discussion and were flagged for follow-up with the department."},{"source":"ed","category":"policy","tags":["GRIEVANCE"],"sentiment":"issue","text":"DNH & DD currently has no deemed-approval provision for the Factory License; applications are approved only after actual departmental scrutiny and an on-site inspection by a safety officer are completed, with no consent clause in force."},{"source":"ed","category":"suggestions","tags":["GRIEVANCE","TIMELINE"],"sentiment":"suggestion","text":"The official suggested exploring a deemed-approval clause for cases where scrutiny is not completed within a defined period, while retaining the mandatory site-inspection requirement for higher-risk units."},{"source":"ed","category":"remarks","tags":["NORMS"],"sentiment":"neutral","text":"No risk-based classification system for Factory License applications was indicated by the official; all applications currently go through the same scrutiny and mandatory site inspection regardless of the unit's scale or risk profile."},{"source":"ed","category":"suggestions","tags":["NORMS"],"sentiment":"suggestion","text":"The official suggested introducing a risk-based classification approach — lighter-touch verification for low-risk units and more intensive scrutiny for units handling hazardous processes or chemicals — as a possible future reform."},{"source":"ed","category":"suggestions","tags":["PORTAL"],"sentiment":"suggestion","text":"Recommended fully digitising the remaining document categories currently submitted offline; since the checklist, submission mode, and processing procedure are UT-level administrative practice rather than part of the Central Factories Act, this gap can be closed without any change to Central legislation."},{"source":"ed","category":"remarks","tags":["OTHER"],"sentiment":"neutral","text":"DNH & DD has one of the highest concentrations of industrial units among Union Territories, with close to 7,000 registered industries; fatalities and major injuries are described as rare, attributed to strict compliance enforcement."},{"source":"fgd","category":"pain","tags":["FEES","TIMELINE"],"sentiment":"issue","text":"Where a unit depends on institutional bank loans or government tender-based supply contracts, delay in obtaining the factory licence and pollution clearance directly delays loan disbursement or billing, adding an interest-cost burden while the applicant waits."},{"source":"fgd","category":"pain","tags":["CONSULT","FEES"],"sentiment":"issue","text":"Smaller enterprises without dedicated technical staff often engage a consultant for factory layout drawings and technical paperwork, at a cost of roughly ₹30,000, specifically to avoid documentation errors and the repeated queries that follow from them."},{"source":"fgd","category":"pain","tags":["COMPLY","FEES"],"sentiment":"issue","text":"Beyond consultant fees, machinery and equipment must meet the specifications required under the factory licence, so units incur a purchase cost to meet the compliance standard, separate from what they would otherwise spend to build production capacity."},{"source":"fgd","category":"pain","tags":["PORTAL"],"sentiment":"issue","text":"Local telecom and internet infrastructure in industrial belts can occasionally stall online submissions, particularly during heavy monsoons."},{"source":"fgd","category":"policy","tags":["COMPLY"],"sentiment":"issue","text":"Statutory obligations such as ambulance or crèche provisions apply only once workforce thresholds are crossed (e.g. above 500 workers); participants felt DNH/Daman does not offer the kind of graduated, tiered compliance timeline that some other states extend to newer or lower-risk units to phase in such obligations."},{"source":"fgd","category":"policy","tags":["CONSULT","CLARITY"],"sentiment":"issue","text":"Consultants engaged for factory licensing are not officially empanelled or registered with the department, unlike architects submitting building-plan approvals via the OBPS portal or auditors conducting water-related compliance audits, both of whom must hold recognised registration or certification — leaving service quality and accountability inconsistent."},{"source":"fgd","category":"procedural","tags":["PORTAL"],"sentiment":"positive","text":"The application process is almost entirely online; participants did not report using an offline route, and once the listed checklist documents are ready, completing and submitting the application form takes about 30-45 minutes."},{"source":"fgd","category":"procedural","tags":["NORMS","INSPECT"],"sentiment":"neutral","text":"Physical inspection is not required for standard, self-declaration-based factory licensing — typically Green-category units, where the applicant self-certifies products manufactured, machinery installed, connected electrical load, workforce, and floor area. Inspection becomes necessary for higher-risk Orange/Red-category units, and the associated site-visit scheduling adds to processing time for those categories specifically."},{"source":"fgd","category":"procedural","tags":["GRIEVANCE","TIMELINE"],"sentiment":"positive","text":"A deemed-approval provision applies to factory licensing: if the department neither raises a query nor takes any action within 25 days of submission, the application is treated as approved by default."},{"source":"fgd","category":"redundant","tags":["DUPDOC"],"sentiment":"positive","text":"No redundant or duplicate documentation was reported; the checklist (building layout drawings, land ownership/title records, rent or purchase agreement, and fire department permission) was described by participants as clear and non-repetitive."},{"source":"fgd","category":"delay","tags":["QUERY","TIMELINE"],"sentiment":"neutral","text":"Delays occur mainly when the department raises a query due to incomplete documentation; the processing clock pauses until the applicant responds, after which approval typically resumes promptly."},{"source":"fgd","category":"suggestions","tags":["COMPLY","TIMELINE"],"sentiment":"suggestion","text":"Participants suggested introducing a transition period along the lines of Gujarat's practice, where green/low-risk category units are permitted to commence operations on self-declaration or intimation, with up to two to three years allowed to complete peripheral compliances after operations have started."},{"source":"fgd","category":"suggestions","tags":["CONSULT","CLARITY"],"sentiment":"suggestion","text":"Participants suggested formal empanelment or registration of consultants engaged for factory licensing, comparable to the registration required of architects or certified water-compliance auditors, to improve consistency and accountability of service."},{"source":"fgd","category":"remarks","tags":["POSITIVE"],"sentiment":"positive","text":"Participants described the department's officers and online portals as responsive and supportive, communicating through SMS, email, and a dedicated departmental WhatsApp group."},{"source":"fgd","category":"remarks","tags":["FEES","POSITIVE"],"sentiment":"positive","text":"Statutory fees are calculated automatically on the portal based on connected electrical load (HP/KW) and number of workers, and also vary by pollution category (Green/Orange/Red); participants cited an example statutory fee of roughly ₹22,000 for a unit based on its connected load, with no hidden charges reported."},{"source":"secondary","category":"policy","tags":["GRIEVANCE","TIMELINE"],"sentiment":"neutral","text":"A draft DNH & DD Ease of Doing Business Regulation, 2026 (gazetted 20 Jul 2026 for consultation) proposes a \"Right to Business\" self-declaration/in-principle-approval framework for eligible MSMEs — conceptually adjacent to, but distinct from, a classic \"25-days-then-deemed-granted\" timer, suggesting on-the-ground practice may be running ahead of, or anticipating, formal rule change."},{"source":"secondary","category":"remarks","tags":["OTHER"],"sentiment":"neutral","text":"Secondary research flags possible legal fragmentation within the merged UT: a 2026 draft OSH rules document references the \"Goa, Daman & Diu Factories Rules, 1985\" as still applicable specifically to Daman, meaning the Daman side may still run under older pre-merger rules distinct from a single unified DNH&DD Factories Rules framework — a plausible explanation for reporting variance between sources."}],"quotes":[{"speaker":"R1","quote":"Delays typically happen only if the department raises a query due to incomplete documentation. If a query is raised, the clock pauses until the applicant responds.","topic":"Query-Driven Delay","tags":["QUERY","TIMELINE"],"sentiment":"neutral"},{"speaker":"R2","quote":"I engaged a consultant to get it expedited for the factory layout designs and technical paperwork, so it could be processed quickly without errors, but the fee is high for the service.","topic":"Consultant Dependency","tags":["CONSULT","FEES"],"sentiment":"issue"},{"speaker":"R1","quote":"In regions like Gujarat, green/low risk category industries are given a transition period of up to two to three years to complete peripheral compliances after starting operations.","topic":"Gujarat Transition-Period Model","tags":["COMPLY"],"sentiment":"suggestion"},{"speaker":"R1","quote":"The online portals and staff in Dadra & Nagar Haveli and Daman are extremely responsive and supportive.","topic":"Portal & Staff Responsiveness","tags":["POSITIVE"],"sentiment":"positive"}],"gaps":[{"flag":"MISSING","text":"Exact fee slabs by unit size, employee strength, or registration tenure for the Factory License are not stated anywhere in the ED. The ED gives only a payment ceiling of 'approximately Rs. 1 lakh'; the FGD supplies a single example fee (~₹22,000 for one unit based on connected load) but not a full schedule."},{"flag":"MISSING","text":"Exact validity period/slabs for the Factory License itself are not stated in the ED, which explicitly notes this was 'not confirmed during this discussion' and should be verified with the department separately."},{"flag":"INCONSISTENT","text":"ED states: 'Dadra and Nagar Haveli and Daman and Diu do not currently provide deemed approval for the Factory License... there is no consent clause in force for this service.' FGD states: 'A deemed approval provision applies to factory licensing: if the department neither raises a query nor takes any action within 25 days of submission, the application is treated as approved by default,' and describes it as functioning well (clock pauses only for genuine queries, resumes promptly). This is a direct, unresolved conflict on a core fact."},{"flag":"INCONSISTENT","text":"ED states: 'No risk based classification system for Factory License applications was indicated during the discussion. All applications currently go through the same scrutiny and mandatory site inspection process, irrespective of the unit's scale or risk profile.' FGD describes an operating Green/Orange/Red classification in practice: 'Physical inspection is not required for standard, self declaration based factory licensing, typically Green category units... Inspection becomes necessary for units in higher risk (Orange/Red) categories.'"},{"flag":"INCONSISTENT","text":"ED identifies continued offline submission of 'certain documents... in specific cases' as the process's principal friction point. FGD participants instead report: 'The application process is almost entirely online; participants did not report using an offline route.'"},{"flag":"REFORM","text":"FGD-sourced concrete simplification: adopt a Gujarat-style transition period allowing green/low-risk units to commence operations on self-declaration/intimation, with up to two to three years to complete peripheral compliances after starting operations — addresses the policy-issue complaint that DNH/Daman lacks tiered compliance timelines for lower-risk or newer units."},{"flag":"GOOD_PRACTICE","text":"Independent of the deemed-approval dispute, both sources corroborate strong service delivery: ED cites monthly departmental review meetings on portal performance, sector-specific awareness seminars, and linkage to the National Single Window Portal; FGD independently describes officers and portals as 'extremely responsive and supportive,' communicating via SMS, email, and a dedicated departmental WhatsApp group, with no hidden fees reported."},{"flag":"SECONDARY_OPEN","text":"Secondary (web) research could not resolve the ED-vs-FGD deemed-approval discrepancy from any official rule text found online. It surfaced a draft DNH & DD Ease of Doing Business Regulation, 2026 proposing a 'Right to Business' self-declaration/in-principle-approval framework for MSMEs (conceptually adjacent to, but not confirmed as, the FGD's 25-day timer) and a possible legal-fragmentation explanation (a 2026 draft OSH rules document still referencing the 'Goa, Daman & Diu Factories Rules, 1985' as applicable to Daman specifically) — neither confirms nor denies whether a formal 25-day deemed-approval rule currently exists."}]},{"code":"HP","name":"Himachal Pradesh","fgdPending":true,"issuingAuthority":"Department of Labour & Employment — Chief Inspector of Factories is the final approving authority; Assistant Director (Factory) performs field verification.","portal":{"name":"Departmental online software portal","url":"https://admis.hp.nic.in/ofris"},"timeline":{"minDays":30,"maxDays":45,"basis":"Building Plan Approval 30 days, then Factory License 45 days — sequential stages under the OSH Code framework, each with its own deemed-approval provision","text":"Building Plan Approval: 30 days (deemed approval). Factory License: 45 days (deemed approval). The two stages run sequentially."},"automationLevel":"partial","applicantOfficeVisit":"unclear","documents":["Building plan drawings","Factory-related statutory documents required under departmental rules for BPA and licensing"],"documentsNote":"Fire NOC and Pollution NOC are NOT sought as part of factory licensing unless specifically required under other laws — documentation described as \"substantially reduced\" under EoDB reforms. The HP Dept. of Labour & Employment's own OFRIS \"Procedure and Checklist\" document (user-supplied) gives exact, separate checklists for Building Plan Approval (19 items) and License registration (11 items) — see those two steps below for the full lists, each more granular than this state's ED/FGD estimate.","deemedApproval":{"status":"yes","days":"30 (BPA) / 45 (Factory License)","text":"Available at both stages — BPA is deemed approved after 30 days, and the Factory License after 45 days, if no decision is communicated."},"validity":{"text":"Applicant's choice of 1, 5, or 10 years; renewal required after expiry. Longer validity is intended for the operational convenience of larger factories."},"fees":{"text":"Not based on the chosen validity period; determined by connected horsepower/power load and number of workers. Range ~₹1,000 (small establishments) to ~₹2 lakh (large factories)."},"steps":[{"n":1,"phase":"pre","title":"Submit Factory Building Plan Approval (BPA) application","automated":true,"note":"Via the departmental online portal."},{"n":2,"phase":"pre","title":"Upload required documents and building drawings","automated":true,"note":"Online.","documents":["Form No-1 (online e-form, web application only)","Form No 1-A (online e-form, web application only)","Questionnaire (online e-form, web application only)","Flow-chart of manufacturing process","Write-up chart of manufacturing process","Resolution of the Board of Directors declaring one Director as occupier (or partners' resolution declaring one partner as occupier, or proprietor's declaration in a proprietorship)","List of Directors/Partners, with parentage and complete residential addresses","List of machinery","Copy of power sanction certificate from the concerned authority (HPSEB)","Site Plan of the factory","Building drawings, including elevations, plans & cross sections","Machine lay-out","Certificate from the Registrar of Companies regarding incorporation (company)","List of partners with parentage & complete residential address (partnership firm)","Proprietor's name, parentage and complete residential address, via self-attested declaration (proprietorship)","All documents signed by the occupier (Director/Partner/Proprietor, as applicable)","All drawings signed by the occupier and by a Chartered Engineer/Chartered Architect","Copy of approval from the Department of Industries (industrial unit) or Director Energy/HIMURJA/other competent authority (hydroelectric power project)","Uploading of all documents is mandatory"]},{"n":3,"phase":"inspect","title":"Assistant Director (Factory) conducts field verification","automated":false,"note":"Forwards to the Chief Inspector of Factories."},{"n":4,"phase":"approve","title":"BPA approved","automated":true,"note":"Eligibility gate for the Factory License application."},{"n":5,"phase":"apply","title":"Factory License application submitted","automated":true,"note":"Through the same online portal.","documents":["Form No.3 (online e-form, web application only)","Certificate of Stability, signed by a Chartered Engineer/Chartered Architect","Board resolution declaring a Director as occupier (or partners' resolution declaring a partner as occupier, or proprietor's declaration)","List of Directors/Partners, with parentage and complete residential addresses","List of partners with parentage & complete residential address","Proprietor's self-attested declaration of name, parentage and complete residential address (proprietorship)","Certificate of incorporation from the Registrar of Companies (company)","Copy of power sanction certificate from the concerned authority (HPSEB)","NOC from the Chief Fire Officer","NOC from the HP Pollution Control Board","All documents signed by the occupier and uploaded"]},{"n":6,"phase":"inspect","title":"Assistant Director undertakes field verification for the licensing application","automated":false,"note":""},{"n":7,"phase":"approve","title":"Verified application forwarded to the competent authority","automated":true,"note":"For approval/issuance of the Factory License."}],"ed":{"date":"10-08-2026","location":"Directorate of Industries, Shimla","expert":"Mr. Puneet Chauhan","designation":"Assistant Director, Department of Labour & Employment"},"fgdMeta":null,"findings":[{"source":"ed","category":"procedural","tags":["PORTAL","TIMELINE"],"sentiment":"neutral","text":"The process runs in two sequential online stages through the same departmental portal: Building Plan Approval (BPA) first, with field verification by the Assistant Director (Factory) and forwarding to the Chief Inspector of Factories, followed by the Factory License application, which also undergoes field verification before being forwarded to the competent authority for approval."},{"source":"ed","category":"pain","tags":["PORTAL","INTERDEP"],"sentiment":"issue","text":"The departmental portal is already integrated with the State Single Window framework, but direct application submission through the Single Window portal has not yet been enabled; applicants cannot yet apply seamlessly through the single window."},{"source":"ed","category":"policy","tags":["COMPLY"],"sentiment":"positive","text":"Fire NOC and Pollution NOC are not sought as part of the present factory licensing process unless specifically required under other applicable laws."},{"source":"ed","category":"remarks","tags":["COMPLY","POSITIVE"],"sentiment":"positive","text":"Officials stated that documentation requirements have been substantially reduced under Ease of Doing Business reforms, and only essential documents are now required for BPA and licensing."},{"source":"ed","category":"policy","tags":["TIMELINE"],"sentiment":"neutral","text":"Statutory timelines are 30 days for Building Plan Approval and 45 days for Factory License approval, each with its own deemed-approval provision, applied under the Occupational Safety, Health and Working Conditions (OSH) Code framework and related state rules."},{"source":"ed","category":"policy","tags":["RENEWAL"],"sentiment":"neutral","text":"Factory Licenses may be issued for 1, 5, or 10 years at the applicant's option, with renewal required after the chosen validity period expires; the longer-validity option is intended to give larger factories operational convenience."},{"source":"ed","category":"policy","tags":["FEES"],"sentiment":"neutral","text":"The statutory fee is not based on the chosen validity period; it is instead determined primarily by the factory's connected horsepower/power load and number of workers, ranging from approximately ₹1,000 for smaller establishments to around ₹2 lakh for large factories."},{"source":"ed","category":"policy","tags":["TIMELINE","POSITIVE"],"sentiment":"positive","text":"Deemed approval is available at both stages of the process: Building Plan Approval is deemed approved after 30 days and the Factory License after 45 days if no decision is communicated."},{"source":"ed","category":"procedural","tags":["INSPECT","COMPLY"],"sentiment":"neutral","text":"Post-approval compliance requires maintenance of statutory registers, periodic inspection of factories, and testing/safety-related compliance as prescribed under factory laws, rules, and the OSH framework, with inspections continuing as part of ongoing regulatory oversight."},{"source":"ed","category":"policy","tags":["INSPECT","NORMS"],"sentiment":"neutral","text":"A formal risk-based inspection and classification system categorizes factories by hazard potential: hazardous factories (e.g., pharmaceutical units, notified dangerous operations) are inspected every 6 months, while other factories are inspected annually or once every two years depending on worker strength and risk category."},{"source":"ed","category":"remarks","tags":["INSPECT","POSITIVE"],"sentiment":"positive","text":"Inspection selection is random and system-driven, which officials described as designed to ensure transparency rather than manual allocation of inspectors."},{"source":"ed","category":"remarks","tags":["COMPLY","POSITIVE"],"sentiment":"positive","text":"Officials stated that unnecessary requirements have already been removed through Ease of Doing Business reforms and that no major redundant requirement was identified during the discussion."},{"source":"ed","category":"remarks","tags":["OTHER"],"sentiment":"neutral","text":"Officials did not identify any major burdensome or time-consuming activity in the current BPA or Factory License process; this is a self-assessment by the department and was not tested against applicant experience, since no FGD was conducted for this state."},{"source":"ed","category":"suggestions","tags":["INTERDEP","PORTAL"],"sentiment":"suggestion","text":"The principal reform suggested was complete integration with the State Single Window System so that applicants can access all industrial approvals through a single interface."},{"source":"ed","category":"remarks","tags":["OTHER"],"sentiment":"neutral","text":"Future implementation of the OSH Code is expected to further streamline registration and licensing processes, per the department."},{"source":"ed","category":"policy","tags":["RENEWAL","POSITIVE"],"sentiment":"positive","text":"An auto-renewal facility is available for license renewals, cited by officials as one of the state's best practices."},{"source":"ed","category":"suggestions","tags":["PORTAL","INTERDEP"],"sentiment":"suggestion","text":"Officials recommended enabling direct submission of BPA and Factory License applications through the Single Window portal without redirection to the departmental portal."},{"source":"ed","category":"suggestions","tags":["GRIEVANCE","CLARITY"],"sentiment":"suggestion","text":"Officials recommended strengthening digital tracking and communication mechanisms for applicants as part of the recommended reforms."},{"source":"ed","category":"suggestions","tags":["PORTAL","OTHER"],"sentiment":"suggestion","text":"Officials recommended implementing OSH Code provisions in a unified digital workflow covering registration, building plan approval, licensing, and renewals."},{"source":"ed","category":"policy","tags":["COMPLY","NORMS"],"sentiment":"positive","text":"The applicability threshold for very small factories has reportedly been revised under the OSH framework, reducing compliance requirements for smaller establishments."},{"source":"secondary","category":"policy","tags":["TIMELINE"],"sentiment":"issue","text":"The official OFRIS portal FAQ gives a different timeline than the ED: \"Approval of Plans — 3 months\" (approx. 90 days) and \"Registration & Renewal of factory licence — 30 days\", versus the ED's reported 30-day BPA / 45-day Factory License pairing; secondary research could not confirm which figure is currently accurate."},{"source":"secondary","category":"remarks","tags":["CLARITY","OTHER"],"sentiment":"issue","text":"The \"OSH Code framework\" the ED cited as governing current timelines is, per secondary research, still a DRAFT (HP Occupational Safety, Health and Working Conditions Rules, ~22 May 2026 version, under a 45-day objection window) and not yet in force; licensing today still operates under the Factories Act 1948 / HP Factories Rules 1950 as amended in 2023-2025."},{"source":"secondary","category":"policy","tags":["FEES","NORMS"],"sentiment":"neutral","text":"Secondary research confirmed the HP Factories (Amendment) Rules 2024 (30 Aug 2024), which replaced the one-year licence fee schedule and added a Chief-Inspector-recognised \"competent person\" provision for tests/inspections."},{"source":"secondary","category":"policy","tags":["NORMS"],"sentiment":"neutral","text":"Secondary research confirmed the HP Factories (Amendment) Rules 2025 (16 Oct 2025), which revised working-hour provisions."},{"source":"secondary","category":"remarks","tags":["FEES","CLARITY"],"sentiment":"neutral","text":"The 2024 amendment's own title (\"fee for grant of licence for one year\") suggests fees may in fact scale with the validity period chosen, which would nuance the ED's claim that the fee is independent of validity period; secondary research could not confirm this either way."},{"source":"secondary","category":"redundant","tags":["CLARITY","COMPLY"],"sentiment":"positive","text":"The HP Dept. of Labour & Employment's own OFRIS \"Procedure and Checklist\" document (user-supplied PDF) gives exact, separate document checklists: 19 items for Building Plan Approval and 11 items for License registration — see the per-step lists above — replacing the ED's vague \"statutory documents required under departmental rules\" with an enumerated, department-published list."},{"source":"secondary","category":"policy","tags":["FEES"],"sentiment":"neutral","text":"The same OFRIS document publishes the full fee schedule as a slab table cross-referencing installed horsepower against number of workers employed — from ₹250 (nil connected HP, up to 9 workers) up to ₹75,000 (above 15,000 HP, above 2,000 workers). This is consistent with, but far more precise than, the ED's \"~₹1,000 to ~₹2 lakh\" range (the table's own extremes run lower and higher than that range at its tails)."},{"source":"secondary","category":"procedural","tags":["PORTAL"],"sentiment":"neutral","text":"The OFRIS document names the real application URL as admis.hp.nic.in/ofris and sets out an 11-step service-delivery process with a named responsibility centre at each step (Applicant → Online Application → Dealing Assistant → Deputy Director (Factories), who may return the application for deficiencies or recommend it to the Chief Inspector of Factories for grant) — more granular than the ED's two-stage account."},{"source":"secondary","category":"policy","tags":["TIMELINE"],"sentiment":"issue","text":"The OFRIS document cites a specific, dated government notification for its own timelines, different again from both the ED and the earlier-found OFRIS FAQ: Building Plan Approval within 30 days (notification Shram (A)6-2/10-Part-File-1-L, dated 27.06.2016) and grant/renewal of Factory License within 20 days (same notification series, dated 27.02.2016), both \"after completion of all codal formalities\" under the Public Service Delivery Guarantee Act."}],"quotes":[],"gaps":[{"flag":"INCONSISTENT","text":"ED (Mr. Puneet Chauhan, Assistant Director): Building Plan Approval takes 30 days and Factory License approval takes 45 days, each with deemed approval. Secondary research (OFRIS portal FAQ, ofris.hp.gov.in): \"Approval of Plans — 3 months\" (~90 days) and \"Registration & Renewal of factory licence — 30 days\". The two sources give materially different day-counts for the same two stages, and it is unclear which is currently accurate."},{"flag":"INCONSISTENT","text":"ED framed current timelines and process as operating \"under the Occupational Safety, Health and Working Conditions (OSH) Code framework\". Secondary research found the HP OSH Rules are still in DRAFT form (~22 May 2026 version, with a 45-day public objection window) and not yet in force — licensing today is actually governed by the Factories Act 1948 / HP Factories Rules 1950 (as amended 2023-2025). The ED's framing may describe an anticipated reform track rather than the rules currently governing licensing."},{"flag":"SECONDARY_OPEN","text":"The ED's claim that deemed approval is available and operative (30 days for BPA, 45 days for Factory License) could not be independently verified through secondary/web research; it remains sourced only to the official's statement."},{"flag":"SECONDARY_OPEN","text":"The ED's claim that Fire NOC and Pollution NOC are not sought as part of factory licensing (unless required under other laws) could not be independently verified through secondary research."},{"flag":"SECONDARY_RESOLVED","text":"Secondary research filled in specifics the ED transcript did not give: the HP Factories (Amendment) Rules 2024 (30 Aug 2024, replaced the one-year licence fee schedule and added a Chief-Inspector-recognised \"competent person\" provision) and the HP Factories (Amendment) Rules 2025 (16 Oct 2025, revised working-hour provisions) — both citable and dated, confirming the regulatory framework is under active, recent amendment."},{"flag":"MISSING","text":"No data exists on actual (lived) time taken by applicants to obtain Building Plan Approval or a Factory License in practice — only the statutory/deemed-approval timeline (30 and 45 days) is stated. Since Himachal Pradesh has no FGD (fgdPending: true), real applicant turnaround time, queries/back-and-forth cycles, or delays beyond the statutory window are not captured anywhere in ED or secondary sources."},{"flag":"MISSING","text":"No information exists on informal or unrecorded costs (e.g., consultant/agent fees, facilitation payments, or other out-of-pocket costs businesses incur beyond the statutory fee). This is lived business experience that only an FGD could surface, and none was conducted for this state."},{"flag":"VAGUE","text":"The statutory fee is stated only as a wide, non-itemized range — \"approximately ₹1,000\" for smaller establishments to \"around ₹2 lakh\" for large factories — without a precise fee schedule tied to specific horsepower/worker-count slabs. Secondary research additionally raises the possibility that fees may scale with the chosen validity period (per the 2024 amendment's title), which is not confirmed either way, adding further imprecision to the ED's fee claim."},{"flag":"SECONDARY_RESOLVED","text":"The department's own OFRIS \"Procedure and Checklist\" document (user-supplied) resolves the document-granularity gap entirely: exact 19-item (Building Plan Approval) and 11-item (License registration) checklists, now attached to the relevant step above, in place of the ED's vague generic description."},{"flag":"SECONDARY_RESOLVED","text":"The same OFRIS document publishes a complete fee schedule (a slab table by horsepower × workforce size), substantially sharpening — though not fully replacing — the ED's wide ₹1,000–₹2 lakh range; see the fee-schedule finding above for the table's shape and extremes."},{"flag":"SECONDARY_RESOLVED","text":"The portal's real URL is now confirmed directly from the department's own document as admis.hp.nic.in/ofris, replacing an earlier unconfirmed guess from web search alone."},{"flag":"INCONSISTENT","text":"A third source on the Factory License timeline, and it still doesn't match the other two: the OFRIS checklist document cites a specific, dated government notification (Shram (A)6-2/10-Part-File-1-L, 27.02.2016) for a 20-day License timeline — different from both the ED's 45 days and the previously-found OFRIS FAQ's 30 days. (Its Building Plan Approval figure of 30 days, notification dated 27.06.2016, does match the ED on that one stage.) This is the most specifically-cited of the three sources, but specificity isn't the same as being confirmed current — the notification is nearly a decade old and could itself have been superseded."}]},{"code":"JH","name":"Jharkhand","fgdPending":true,"issuingAuthority":"Dept. of Labour, Employment, Training & Skill Development — Deputy Chief Inspector is the competent authority; processed via the Jharkhand Single Window / Shramadhan portal.","portal":{"name":"Jharkhand Single Window / Shramadhan portal","url":"https://shramadhan.jharkhand.gov.in"},"timeline":{"minDays":30,"maxDays":30,"basis":"Statutory, for a complete application","text":"30-day total processing timeline for a complete application (correct fee and all documents). Within this, the Inspector must forward a recommendation to the Deputy Chief Inspector within 12 days of submission."},"automationLevel":"partial","applicantOfficeVisit":"unclear","documents":["Form No. 2","Fee payment proof (challan)","Proof of possession (registered sale/lease deed/rent agreement)","Owner consent + address proof (if leased/rented)","Approved site/building plan (where applicable)","Pollution Control Board Consent to Establish/Operate","Occupier ID/address proof","Manager ID/address proof","Project report and manufacturing process description","Machinery/installed power details","Entity-specific documents (Board list/MOA/AOA/Board resolution for companies; partnership deed + partners list for firms)"],"documentsNote":"Plus any other document requested by the Chief Inspector/Deputy Chief Inspector/Inspector.","deemedApproval":{"status":"no","days":null,"text":"None currently — no automatic deemed approval after the 30-day period lapses, even though timelines are specified. Recommended reform: introduce statutory deemed approval for complete, low-risk applications after the SLA lapses, with safety exclusions, post-approval inspection protocols, and authority to cancel for non-compliance."},"validity":{"text":"Jharkhand Factories (Amendment) Rules, 2025 establish a minimum validity of 1 year, with longer-term options also offered; 1-year licences renew annually, fully online via Shramadhan."},"fees":{"text":"Under Schedule-A (2025 fee notification), based on total rated machinery/plant HP capacity and maximum workers on any single day — e.g. Nil HP: ₹530 (up to 20 workers) to ₹2,380 (up to 100 workers); up to 10 HP: ₹1,190 to ₹2,900; higher slabs cost more. Electricity generating/transmitting stations use a separate KW-based schedule. License amendment fee standardised at ₹1,000 (2025). The Shramadhan portal has an automated fee calculator."},"steps":[{"n":1,"phase":"apply","title":"Login and select service","automated":true,"note":"Select \"Factory Act — Registration and Grant of Licence\" on the Shramadhan portal."},{"n":2,"phase":"apply","title":"Complete Form No. 2 and submit","automated":true,"note":"Factory, occupier, manager, worker counts, manufacturing processes, machinery/installed power, land/building details; upload documents; pay licence fee online.","documents":["Form No. 2","Fee payment proof (challan)","Proof of possession (registered sale/lease deed/rent agreement)","Owner consent + address proof (if leased/rented)","Approved site/building plan (where applicable)","Pollution Control Board Consent to Establish/Operate","Occupier ID/address proof","Manager ID/address proof","Project report and manufacturing process description","Machinery/installed power details","Entity-specific documents (Board list/MOA/AOA/Board resolution for companies; partnership deed + partners list for firms)"]},{"n":3,"phase":"scrutiny","title":"Scrutiny and deficiency handling","automated":true,"note":"Receiving office scrutinises; deficiencies communicated electronically; applicant resubmits corrected documents."},{"n":4,"phase":"scrutiny","title":"Forwarding to Inspector of Factories","automated":true,"note":"Complete application forwarded electronically."},{"n":5,"phase":"inspect","title":"Review and site inspection","automated":"partial","note":"Inspector reviews and conducts a site inspection; inspection allocation is managed automatically by the departmental system."},{"n":6,"phase":"scrutiny","title":"Recommendation forwarded to Deputy Chief Inspector","automated":true,"note":"Statutory 12-day timeline for this step."},{"n":7,"phase":"approve","title":"Approval and issuance","automated":true,"note":"Competent authority approves; licence issued electronically; applicant notified via SMS/status update."}],"ed":{"date":"25-08-2026","location":"Dept. of Industry, Nepal House, Single Window Office, Ranchi","expert":"Binit Kumar Singh (Deputy Chief Inspector) and Abhishek Mishra (Software Developer)","designation":"Dept. of Labour, Employment, Training & Skill Development"},"fgdMeta":null,"findings":[{"source":"ed","category":"procedural","tags":["PORTAL"],"sentiment":"neutral","text":"The factory license application flows entirely through the Jharkhand Single Window/Shramadhan portal: login and service selection, Form No. 2 submission with document upload and online fee payment, scrutiny with electronic deficiency communication, electronic forwarding to the Inspector of Factories, site inspection (auto-allocated), the Inspector's recommendation, and final approval/issuance by the Deputy Chief Inspector with SMS notification."},{"source":"ed","category":"policy","tags":["TIMELINE"],"sentiment":"neutral","text":"The official procedure stipulates a 12-day timeline for the Inspector to forward their recommendation to the Deputy Chief Inspector, within an overall 30-day timeline for processing a complete application."},{"source":"ed","category":"procedural","tags":["PORTAL"],"sentiment":"positive","text":"The site inspection conducted by the Inspector of Factories is the only physical, in-person component of an otherwise fully digitized process (application, uploads, fee payment, status tracking, deficiency communication, and license issuance all occur electronically)."},{"source":"ed","category":"policy","tags":["COMPLY"],"sentiment":"neutral","text":"Required documentation spans core application/fee proof, premises and site documents (possession proof, owner consent, approved building/site plan), Pollution Control Board Consent to Establish/Operate, occupier and manager identity/address proof, project and manufacturing-process documentation, machinery/installed-power details, and entity-specific documents (MOA/AOA/Board resolution for companies; partnership deed for firms)."},{"source":"ed","category":"policy","tags":["COMPLY"],"sentiment":"neutral","text":"Beyond the prescribed list, the Chief Inspector, Deputy Chief Inspector, or Inspector may request any other specific document for a particular factory at their discretion."},{"source":"ed","category":"policy","tags":["RENEWAL"],"sentiment":"neutral","text":"The Jharkhand Factories (Amendment) Rules, 2025 set a minimum license validity of one year, with longer-term options also offered under the notified framework; one-year licenses must be renewed annually, fully online via Shramadhan."},{"source":"ed","category":"policy","tags":["FEES"],"sentiment":"neutral","text":"Under the 2025 fee notification (Schedule-A), the statutory fee for factories is based on total rated machinery/plant capacity in HP and the maximum number of workers on any single day (e.g. Nil HP: ₹530 up to 20 workers, ₹2,060 up to 50, ₹2,380 up to 100; up to 10 HP: ₹1,190 up to 20 workers, ₹2,110 up to 50, ₹2,900 up to 100); electricity generating/transforming/transmitting stations use a separate KW-based Schedule-B/C fee."},{"source":"ed","category":"policy","tags":["FEES","PORTAL"],"sentiment":"positive","text":"The Shramadhan portal includes an automated fee calculator that determines the exact amount payable for a given facility, and the 2025 amendment standardized the license amendment fee at a flat ₹1,000."},{"source":"ed","category":"pain","tags":["GRIEVANCE"],"sentiment":"issue","text":"There is currently no provision for automatic deemed approval of a factory license if the 30-day processing period lapses; timelines are specified but not backed by a deemed-issuance mechanism."},{"source":"ed","category":"suggestions","tags":["GRIEVANCE"],"sentiment":"suggestion","text":"The ED recommends introducing statutory deemed approval for complete, low-risk applications once the SLA lapses, combined with safety exclusions, post-approval inspection protocols, and authority to cancel approvals for non-compliance."},{"source":"ed","category":"redundant","tags":["INTERDEP","DUPDOC"],"sentiment":"issue","text":"A significant compliance burden persists from the repeated submission and manual verification of information already held by other government departments, such as land ownership records, project details, and environmental clearances."},{"source":"ed","category":"pain","tags":["INTERDEP"],"sentiment":"issue","text":"While the Single Window system has reduced the need for physical interactions, cross-departmental document verification remains a challenge for applicants."},{"source":"ed","category":"suggestions","tags":["INTERDEP","DUPDOC"],"sentiment":"suggestion","text":"The ED recommends shifting from manual, redundant document uploads to a system-to-system verification model wherever authoritative government databases already exist (land, pollution, building, and other approval statuses), to streamline applicant preparation without bypassing mandatory statutory approvals."},{"source":"ed","category":"suggestions","tags":["DUPDOC"],"sentiment":"suggestion","text":"A proposed 'Master Factory Profile' would let occupiers reuse previously verified data (occupier, manager, address, worker counts, machinery details) to streamline document compilation for new applications and amendments."},{"source":"ed","category":"suggestions","tags":["QUERY","CLARITY"],"sentiment":"suggestion","text":"The ED recommends replacing repeated, iterative deficiency-query cycles with a single, consolidated deficiency memo giving clear, actionable feedback to applicants."},{"source":"ed","category":"suggestions","tags":["INSPECT","PORTAL"],"sentiment":"suggestion","text":"The ED recommends fully digitizing the inspection lifecycle — allocation, scheduling, checklists, and reporting — to increase transparency and efficiency."},{"source":"ed","category":"suggestions","tags":["FEES"],"sentiment":"suggestion","text":"Streamlined, pre-filled licensing amendment applications are proposed, which would automatically calculate incremental fees and compliance requirements based on a factory's existing data."},{"source":"ed","category":"suggestions","tags":["RENEWAL"],"sentiment":"suggestion","text":"The ED recommends an expedited, simplified renewal process for established factories with clean compliance records."},{"source":"ed","category":"policy","tags":["INSPECT","NORMS"],"sentiment":"neutral","text":"Jharkhand applies a risk-based inspection framework: low-risk establishments get a streamlined route with inspection exemptions, medium-risk industries undergo third-party certification and joint verification, and high-risk establishments face mandatory technical and site inspections by the department."},{"source":"ed","category":"procedural","tags":["COMPLY"],"sentiment":"neutral","text":"Post-approval, factories must maintain statutory registers/records/returns, maintain machinery and safety systems, meet worker-welfare standards, display the license and required notices, keep occupier/manager details current, secure license amendments for material changes, and maintain related clearances (pollution, fire safety)."},{"source":"ed","category":"remarks","tags":["POSITIVE","PORTAL"],"sentiment":"positive","text":"The Shramadhan Comprehensive Labour Management System is cited as a best practice: a single unified digital platform covering the full factory-regulation lifecycle — registration, licensing, renewal, amendment, inspection management, fee payment, and status communication."},{"source":"ed","category":"remarks","tags":["POSITIVE","GRIEVANCE"],"sentiment":"positive","text":"Operational best practices highlighted include end-to-end digital processing with electronic deficiency notification, proactive SMS-based status notifications, and consolidated digital maintenance of returns and registers."},{"source":"secondary","category":"policy","tags":["OTHER"],"sentiment":"neutral","text":"Secondary research confirms the issuing-authority hierarchy (Inspector to Deputy Chief Inspector to Chief Inspector) via a sample issued license citing Section 6(1) of the Factories Act, and confirms the 28 March 2025 fee notification exists and fully replaces prior schedules, including the flat ₹1,000 fee for both amendment and transfer."},{"source":"secondary","category":"policy","tags":["RENEWAL"],"sentiment":"neutral","text":"Secondary research pins down license validity more precisely than the ED: under Rule 5(2), validity ranges from a minimum of 1 year up to a maximum of 15 years, rather than the ED's vaguer 'longer-term options.'"},{"source":"secondary","category":"policy","tags":["GRIEVANCE"],"sentiment":"neutral","text":"Secondary research found that the Jharkhand Single Window Clearance Act, 2016 already lists deemed approval, self-certification, third-party inspections, and appeals as general features of the state's single-window regime — a legal hook for deemed approval already exists, even though the ED described deemed approval as not yet implemented for factory licensing specifically."},{"source":"secondary","category":"procedural","tags":["GRIEVANCE"],"sentiment":"neutral","text":"Secondary research surfaced a 2025 appeal mechanism not mentioned in the ED: an occupier may appeal a Chief Inspector order to the Secretary/Principal Secretary within 30 days."}],"quotes":[],"gaps":[{"flag":"SECONDARY_RESOLVED","text":"The ED's vague statement that the state 'also offers longer-term options under the notified framework' for validity (beyond the 1-year minimum) is resolved by secondary research, which cites Rule 5(2) of the Jharkhand Factories (Amendment) Rules, 2025: validity ranges from a minimum of 1 year up to a maximum of 15 years."},{"flag":"SECONDARY_RESOLVED","text":"The ED frames deemed approval purely as a future recommended reform ('currently no provision'). Secondary research found that the Jharkhand Single Window Clearance Act, 2016 already includes deemed approval, self-certification, third-party inspection, and appeals as general statutory features of the single-window regime — meaning a legal hook for deemed approval already exists, strengthening the feasibility of the ED's own recommendation, even though it remains unconfirmed whether Factory License specifically is a scheduled service under that provision."},{"flag":"SECONDARY_OPEN","text":"Whether the Factory License service is specifically notified as a 'scheduled service' under the Jharkhand Single Window Clearance Act, 2016's deemed-approval provision could not be confirmed by secondary research, so the ED's claim that deemed approval is 'not yet implemented' for this service remains plausible but unverified either way."},{"flag":"SECONDARY_OPEN","text":"Secondary research confirms the 28 March 2025 Schedule A/B/C fee notification exists, matching the ED's cited notification, but the exact per-slab rupee figures quoted by the ED could not be independently re-verified against the notification text."},{"flag":"SECONDARY_OPEN","text":"Per the seed secondary research notes, 'third-party estimates' for the 30-day overall / 12-day internal-forwarding SLA 'diverge substantially' from the ED's official figures, but no specific alternative figures were captured — this discrepancy remains unresolved and unquantified."},{"flag":"MISSING","text":"No FGD (business/industry-side) document exists for Jharkhand (fgdPending = true). All findings here are from the government official (ED) side and secondary desk research only; applicant-reported lived experience — actual time taken, informal costs, consultant reliance, satisfaction with the portal — is entirely absent for this state."},{"flag":"VAGUE","text":"The ED describes the compliance burden around cross-departmental verification only qualitatively ('cross-departmental document verification remains a challenge') without quantifying how many departments, how long verification typically adds, or how often it causes delay."},{"flag":"GOOD_PRACTICE","text":"Jharkhand's Shramadhan platform (single portal covering the full factory lifecycle — registration, licensing, renewal, amendment, inspection, fee, and status communication) combined with its risk-based inspection framework (low-risk exemptions, medium-risk third-party certification, high-risk mandatory inspection) is presented as a best practice worth other states replicating."}]},{"code":"JK","name":"Jammu & Kashmir","fgdPending":true,"issuingAuthority":"Labour Department — the Chief Inspector of Factories (charge currently held by the Labour Commissioner) gives final approval; processed via the JK Single Window portal.","portal":{"name":"JK Single Window portal","url":"https://singlewindow.jk.gov.in"},"timeline":{"minDays":30,"maxDays":30,"basis":"Prescribed processing timeline under the Public Services Guarantee Act, 2018 — no deemed-approval/penal provision currently in force","text":"30 days; the clock stops when a query is pending with the applicant and restarts on resubmission. Delays are common where applicants or their service providers are slow to respond — sometimes 2-3 months pending at the applicant's end."},"automationLevel":"partial","applicantOfficeVisit":"unclear","documents":["Pollution (NOC) Certificate","Authorised manager/authority letter","Power sanction load document","Fire NOC","Site/building plan","Lease deed","Constitution documents (MOA/directors list/Board Resolution, or proprietorship/partnership declaration)","Aadhaar and bank details","Form 23 (worker details/power load)"],"documentsNote":"On average 12-13 documents, varying by size/category. No additional documents are required unless the activity is specialised (e.g. fertiliser manufacturing). Secondary research (the official Single Window procedure checklist) found 15 distinct items, more granular than this estimate — see the Application & documentation step for the full list.","deemedApproval":{"status":"no","days":null,"text":"None currently exists. A penal/automatic-approval provision under the Public Services Guarantee Act, 2018 is periodically monitored (reviewed by the Chief Secretary) but not yet in force. The expert suggested that low-risk, document-complete applications could move toward a deemed/same-day approval."},"validity":{"text":"Not separately addressed for the initial licence; discussed mainly for renewal (1-5 years, independent of risk category, at the applicant's choice)."},"fees":{"text":"Not specified — no numerical fee structure given."},"steps":[{"n":1,"phase":"apply","title":"Apply online via the JK Single Window portal","automated":true,"note":"For Factory Registration, plus Building Plan Approval where applicable."},{"n":2,"phase":"apply","title":"Upload prescribed documents","automated":true,"note":"Pollution certificate, authorised manager letter, power sanction load, fire NOC, site plan, lease deed, constitution documents, Aadhaar/bank details, Form 23.","documents":["Application on prescribed Form No. 1","Form 2 & 3 (combined) — 1 copy, submitted every year","Certificate of Consent to Establish/Operate from the J&K State Pollution Control Board (mandatory)","NOC/License from the concerned department/authority — only for sawmills, wood-peeling units, explosives factories, arms & ammunition factories, drug/pharmaceutical factories, brick kilns, or stone crushers","Authorization letter of the Manager, from the Occupier","Copy of Power Sanction Certificate from the Power Development Department","Safety Certificate (in duplicate), indicating safety measures adopted","Passport-size photograph of the Manager or Occupier","ID proof of the applicant (Aadhaar card / Ration card / Driving License)","Land/tenure proof — one of: land records (ownership), Rent Deed (if rented), Allotment Letter (if in an industrial area), or Lease Deed (if leased)","Copy of approval from the Department of Industries (DIC Registration)","List of machinery, with sizes/specifications","Flow chart of the manufacturing process","Project report of the factory","Site plan of the factory, signed by the Occupier, in triplicate"]},{"n":3,"phase":"scrutiny","title":"Dealing Assistant checks completeness","automated":true,"note":"Incomplete applications are reverted with a query."},{"n":4,"phase":"inspect","title":"Factory Inspector reviews documents","automated":"partial","note":"Conducts a physical site inspection for hazardous/high-risk units."},{"n":5,"phase":"approve","title":"Factory Inspector forwards to the Chief Inspector of Factories","automated":true,"note":"For final approval."}],"ed":{"date":"25-08-2026","location":"JLN Udyog Bhawan, Jammu","expert":"Mohammad Youmis","designation":"Junior Assistant, Labour Department"},"fgdMeta":null,"findings":[{"source":"ed","category":"procedural","tags":["PORTAL"],"sentiment":"neutral","text":"The application flows entirely through the JK Single Window portal: applicant applies and uploads documents, a Dealing Assistant checks completeness (returning queries on incomplete applications), a Factory Inspector reviews documents and inspects where required, and the Chief Inspector of Factories (currently the Labour Commissioner) gives final approval."},{"source":"ed","category":"policy","tags":["COMPLY"],"sentiment":"neutral","text":"On average 12-13 documents are required for a new factory licence, with the exact number varying by the size and category of the factory; no additional documents are needed unless the activity is specialised (e.g. fertiliser manufacturing)."},{"source":"ed","category":"delay","tags":["TIMELINE","QUERY"],"sentiment":"neutral","text":"The prescribed processing timeline is 30 days; the clock stops when a query is raised and pending with the applicant, and restarts only once the applicant resubmits."},{"source":"ed","category":"delay","tags":["TIMELINE","CONSULT"],"sentiment":"issue","text":"Delays commonly arise because applicants (or their service providers) do not respond to queries promptly; in some cases applications remain pending at the applicant's end for 2-3 months without action."},{"source":"ed","category":"pain","tags":["QUERY","CLARITY"],"sentiment":"issue","text":"The most common cause of queries is incorrect worker-count or power-load details entered in Form 23."},{"source":"ed","category":"policy","tags":["TIMELINE","GRIEVANCE"],"sentiment":"neutral","text":"Factory licensing falls under the Public Services Guarantee Act, which requires an explanatory note when processing exceeds the prescribed timeline, but no deemed-approval or penal provision currently applies in practice."},{"source":"ed","category":"remarks","tags":["RENEWAL"],"sentiment":"neutral","text":"The validity period for the initial factory licence was not separately addressed; validity was discussed mainly in the context of renewal, where applicants may choose any period from 1 to 5 years regardless of risk category."},{"source":"ed","category":"remarks","tags":["FEES"],"sentiment":"neutral","text":"The expert did not provide a numerical fee structure for factory licence registration."},{"source":"ed","category":"suggestions","tags":["TIMELINE"],"sentiment":"suggestion","text":"The expert suggested that low-risk, document-complete applications could move toward a deemed or same-day (tatkal-style) approval model, similar to systems used for certain other licences."},{"source":"ed","category":"procedural","tags":["NORMS","INSPECT"],"sentiment":"neutral","text":"Factories are categorised Red/Orange/White/Green based on the Pollution Control Board's classification, with Red covering hazardous activities such as pesticide manufacturing; physical inspection is more likely for hazardous/Red-category units."},{"source":"ed","category":"pain","tags":["INSPECT","NORMS"],"sentiment":"issue","text":"Despite the risk-based classification, even White/Green-category units (lowest risk) are physically inspected in around 90% of registration cases, suggesting the colour-coding does not yet meaningfully reduce inspection load for low-risk units."},{"source":"ed","category":"redundant","tags":["DUPDOC","INTERDEP","PORTAL"],"sentiment":"issue","text":"A key inefficiency is the absence of inter-departmental document verification (e.g. auto-fetch of Pollution Board or Fire NOC status): applicants must separately obtain and upload documents that other departments on the same Single Window platform already hold."},{"source":"ed","category":"pain","tags":["CONSULT","GRIEVANCE"],"sentiment":"issue","text":"Intermediaries/service providers often file applications using their own mobile number and email rather than the applicant's; the expert called this system \"hijacked by the service provider,\" reducing applicant accountability and traceability."},{"source":"ed","category":"pain","tags":["CAPACITY"],"sentiment":"issue","text":"Staff shortage relative to application volume contributes to inspection and processing delays."},{"source":"ed","category":"pain","tags":["PORTAL"],"sentiment":"issue","text":"The JK Single Window platform has faced periodic technical issues over the past year."},{"source":"ed","category":"suggestions","tags":["CONSULT","GRIEVANCE"],"sentiment":"suggestion","text":"Recommendation: mandate use of the applicant's own Aadhaar-linked mobile number and email for registration and communication, to reduce dependence on and control by intermediaries."},{"source":"ed","category":"suggestions","tags":["OTHER"],"sentiment":"suggestion","text":"Recommendation: introduce watermarking of issued certificates and QR-code-based verification to prevent unauthorised editing and enable fraud checks, since no such mechanism currently exists."},{"source":"ed","category":"suggestions","tags":["INTERDEP","PORTAL","DUPDOC"],"sentiment":"suggestion","text":"Recommendation: deepen integration across the roughly 24 departments on the JK Single Window so documents/approvals from other departments (pollution, fire) can be auto-verified rather than re-uploaded; the system is not yet integrated with the National Single Window either."},{"source":"ed","category":"pain","tags":["PORTAL","CLARITY"],"sentiment":"issue","text":"A clear amendment provision (e.g. change in occupier or premises) is currently missing from the online system, as it was not carried over from the earlier manual process."},{"source":"ed","category":"policy","tags":["POSITIVE"],"sentiment":"positive","text":"Best practice: the process is fully online through the JK Single Window and passes through a three-tier internal review (Dealing Assistant, then Factory Inspector, then Chief Inspector of Factories)."},{"source":"secondary","category":"policy","tags":["TIMELINE"],"sentiment":"neutral","text":"The 30-day processing timeline is confirmed by two independent legal bases: a June 2018 amendment to the J&K Factories Rules (licence within 30 days of application) and SRO-467 of October 2018, which separately lists 30 days for the Factories Act registration certificate."},{"source":"secondary","category":"policy","tags":["NORMS","POSITIVE"],"sentiment":"positive","text":"Risk-based colour classification has exact, citable thresholds (Red: Pollution Index ≥60; Orange: 41-59; Green: 21-40; White: ≤20), and a 28 Feb 2025 order adopting the CPCB's January 2025 classification exempts the White category entirely from Consent to Establish/Operate -- a recent reform not reflected in the ED discussion."},{"source":"secondary","category":"remarks","tags":["CLARITY"],"sentiment":"neutral","text":"The ED referred to the \"Public Services Guarantee Act, 2018,\" but secondary sources indicate the parent statute is actually the J&K Public Services Guarantee Act, 2011 (Act IX of 2011); 2018 appears to be the year of the SRO/Rules amendment that operationalised it for Factories, not the Act's own year."},{"source":"secondary","category":"remarks","tags":["GRIEVANCE"],"sentiment":"neutral","text":"While the ED described the Public Services Guarantee Act's penal/automatic-approval provision as monitored but not yet in force for factory licensing, secondary research found the Act's officer-penalty mechanism (fines deducted from the responsible officer's honorarium, compensation to the applicant) reportedly actively enforced elsewhere in J&K government, e.g. penalty proceedings against 55 Revenue Department officers."},{"source":"secondary","category":"policy","tags":["DUPDOC","NORMS"],"sentiment":"neutral","text":"The official JK Single Window portal publishes a detailed 15-item document checklist for Factory Registration -- more granular than the ED's '12-13 documents' estimate -- including Form 1, combined Form 2 & 3, Pollution Board Consent to Establish/Operate, a conditionally-required NOC (only for sawmills, wood-peeling, explosives, arms & ammunition, drug/pharma, brick kilns, and stone crushers), manager's authorisation letter, power sanction certificate, safety certificate, manager/occupier photo, applicant ID, one of four alternative tenure-proof documents, DIC registration copy, machinery list, process flow chart, project report, and a triplicate site plan."}],"quotes":[],"gaps":[{"flag":"SECONDARY_OPEN","text":"The statutory fee amount for factory licence registration is not stated in the ED transcript, and secondary (web) research also did not turn up a numerical fee schedule for J&K -- this remains unresolved."},{"flag":"MISSING","text":"The validity period of the initial factory licence (as distinct from renewal) is not stated anywhere in the ED transcript or secondary research; only the renewal validity (1-5 years, applicant's choice, independent of risk category) is documented."},{"flag":"INCONSISTENT","text":"ED (Mohammad Youmis) names the governing law as the \"Public Services Guarantee Act, 2018.\" Secondary research instead finds the parent statute is the J&K Public Services Guarantee Act, 2011 (Act IX of 2011), with 2018 being the year of the SRO/Rules amendment that applied it to Factories -- the ED's year appears to conflate the amendment date with the Act's enactment date."},{"flag":"INCONSISTENT","text":"ED states the PSGA's penal/automatic-approval provision is \"monitored periodically... but not yet in force\" for factory licence delays. Secondary research finds the Act's officer-penalty mechanism (fines deducted from the responsible officer's honorarium, compensation paid to the applicant) reportedly actively enforced elsewhere in J&K government (e.g. penalty proceedings against 55 Revenue Department officers), suggesting the mechanism may be live state-wide even if not yet applied specifically within the Factories Department."},{"flag":"SECONDARY_RESOLVED","text":"ED gave only a vague '12-13 documents, varies by size/category' estimate for documentation. Secondary research (the official JK Single Window SOP) resolves this with a specific, citable 15-item checklist, including which NOC is conditional and which four tenure-proof documents are mutually exclusive alternatives."},{"flag":"SECONDARY_RESOLVED","text":"ED stated the 30-day processing timeline without citing a legal basis. Secondary research confirms it from two independent legal sources: a June 2018 amendment to the J&K Factories Rules and SRO-467 of October 2018."},{"flag":"GOOD_PRACTICE","text":"A 28 Feb 2025 order adopting the CPCB's January 2025 pollution classification exempts the White risk category entirely from Consent to Establish/Operate -- a recent deregulatory reform, found only via secondary research, worth flagging as a model for other states' risk-based regulation."},{"flag":"REFORM","text":"The expert's own suggestion -- that low-risk, document-complete applications should move toward deemed or same-day (tatkal-style) approval -- is a concrete, officer-endorsed simplification that is not yet implemented in J&K."}]},{"code":"MN","name":"Manipur","fgdPending":true,"issuingAuthority":"Not clearly named in the source document; context (Manipur Factories Rules 2021) implies a Labour/Factories department, but this is not stated explicitly. The \"Organization/Department\" field in the source document lists what appear to be private company names rather than a government department — flagged as a likely documentation error, not corrected or guessed.","portal":{"name":"Online application system (unnamed in source)","url":"https://eodbmanipur.mn.gov.in"},"timeline":{"minDays":null,"maxDays":null,"basis":"Unclear/unconfirmed for Factory License specifically","text":"The Expert Discussion's \"Application Timeline\" field states 90 days, but that figure is explicitly for approval of the factory plan / permission to construct (Building Plan Approval) — not confirmed as a separate Factory Licence processing-time figure. Treated as a likely document inconsistency, not merged into the Factory Licence timeline."},"automati
