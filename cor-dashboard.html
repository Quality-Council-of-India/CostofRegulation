but specificity isn't the same as being confirmed current — the notification is nearly a decade old and could itself have been superseded."},{"state":"JK","stateName":"Jammu & Kashmir","flag":"INCONSISTENT","text":"ED (Mohammad Youmis) names the governing law as the \"Public Services Guarantee Act, 2018.\" Secondary research instead finds the parent statute is the J&K Public Services Guarantee Act, 2011 (Act IX of 2011), with 2018 being the year of the SRO/Rules amendment that applied it to Factories -- the ED's year appears to conflate the amendment date with the Act's enactment date."},{"state":"JK","stateName":"Jammu & Kashmir","flag":"INCONSISTENT","text":"ED states the PSGA's penal/automatic-approval provision is \"monitored periodically... but not yet in force\" for factory licence delays. Secondary research finds the Act's officer-penalty mechanism (fines deducted from the responsible officer's honorarium, compensation paid to the applicant) reportedly actively enforced elsewhere in J&K government (e.g. penalty proceedings against 55 Revenue Department officers), suggesting the mechanism may be live state-wide even if not yet applied specifically within the Factories Department."},{"state":"MN","stateName":"Manipur","flag":"INCONSISTENT","text":"ED states: 'The Factory Licence is valid for 10 years, with an auto-renewal provision under the Manipur Factories Rules, 2021.' A weak secondary source instead states licences are valid only to 31 December of the grant year with annual renewal under a cited 'Manipur Factories Rules 2016.' Source quality for the secondary claim is low and the conflict is unresolved."},{"state":"TG","stateName":"Telangana","flag":"INCONSISTENT","text":"Validity period: the ED states applicants can choose any term from 1 to 5 years, with green/some-orange units auto-renewing on fee payment. Secondary research found this contradicted across sources: one source describes only discrete 1/3/5-year options (not any year in between), another describes strictly annual renewal with a prepay option, and a third describes a fixed calendar-year validity cycle — no single secondary source corroborates the ED's exact framing."},{"state":"UP","stateName":"Uttar Pradesh","flag":"INCONSISTENT","text":"The ED report itself states the fee two different ways on the same basis (number of employees): \"INR 150 to 35,000\" in the Application Process Flow (Step 6) versus \"INR 100 to 7,000\" in the Statutory Fee field. Neither ED, FGD, nor secondary research resolves which figure is current."},{"state":"UP","stateName":"Uttar Pradesh","flag":"INCONSISTENT","text":"ED: \"no physical department visit is required at any stage.\" FGD: \"some applicants have been required to physically approach the concerned department or submit documents even after online filing, although this was reported only in limited cases.\" Secondary research separately notes physical inspection \"remains mandatory\" in UP's process, partially supporting the FGD side."},{"state":"UP","stateName":"Uttar Pradesh","flag":"INCONSISTENT","text":"Within the FGD document itself, structural audit cost is given as approximately INR 40,000-50,000 in the Pain Points/Policy Issues narrative sections, but as approximately INR 20,000-25,000 in the same document's Key Statements & Quotes table -- the same cost item, two different ranges."},{"state":"UP","stateName":"Uttar Pradesh","flag":"INCONSISTENT","text":"ED states the Factory License plan-disposal timeline as 15 working days (30 for hazardous processes). Secondary research found the official Nivesh Mitra portal's own published service list states 30 days for Factory License (60 days for renewal) -- a contradiction from the very portal the ED described, not a third-party source."},{"state":"WB","stateName":"West Bengal","flag":"INCONSISTENT","text":"ED frames the process as largely digitised/online, with portal downtime as the main technical complaint ('The Factory Licence process is largely digitised/online... portal downtime has affected application submission and processing'). FGD participants go further and directly contest the 'effectively digital' framing: they state the digital system provides no real-time tracking, no proactive communication, and no automated notifications, forcing applicants to 'visit the department office regularly to track the verification process' and, in one cited case, to simply wait 3-4 months until an officer personally made contact."}],"secondaryResolved":[{"state":"AP","stateName":"Andhra Pradesh","flag":"SECONDARY_RESOLVED","text":"The ED's generic 'statutory timeline' of 7 working days is resolved with a precise legal citation by secondary research: Rule 3 of the AP Factories Rules 1950, as amended by G.O.Ms.No.7/2022 (2 Mar 2022), which cut the window from 30 days to 7 days."},{"state":"AP","stateName":"Andhra Pradesh","flag":"SECONDARY_RESOLVED","text":"The ED's '>20 workers / <10 for specified hazardous categories' risk threshold is independently confirmed by secondary research citing AP's amendment to Sec 2(m)/85(1) of the Factories Act, which also adds the previously-unstated detail that the threshold is 40 workers for factories without power."},{"state":"HP","stateName":"Himachal Pradesh","flag":"SECONDARY_RESOLVED","text":"Secondary research filled in specifics the ED transcript did not give: the HP Factories (Amendment) Rules 2024 (30 Aug 2024, replaced the one-year licence fee schedule and added a Chief-Inspector-recognised \"competent person\" provision) and the HP Factories (Amendment) Rules 2025 (16 Oct 2025, revised working-hour provisions) — both citable and dated, confirming the regulatory framework is under active, recent amendment."},{"state":"HP","stateName":"Himachal Pradesh","flag":"SECONDARY_RESOLVED","text":"The department's own OFRIS \"Procedure and Checklist\" document (user-supplied) resolves the document-granularity gap entirely: exact 19-item (Building Plan Approval) and 11-item (License registration) checklists, now attached to the relevant step above, in place of the ED's vague generic description."},{"state":"HP","stateName":"Himachal Pradesh","flag":"SECONDARY_RESOLVED","text":"The same OFRIS document publishes a complete fee schedule (a slab table by horsepower × workforce size), substantially sharpening — though not fully replacing — the ED's wide ₹1,000–₹2 lakh range; see the fee-schedule finding above for the table's shape and extremes."},{"state":"HP","stateName":"Himachal Pradesh","flag":"SECONDARY_RESOLVED","text":"The portal's real URL is now confirmed directly from the department's own document as admis.hp.nic.in/ofris, replacing an earlier unconfirmed guess from web search alone."},{"state":"JH","stateName":"Jharkhand","flag":"SECONDARY_RESOLVED","text":"The ED's vague statement that the state 'also offers longer-term options under the notified framework' for validity (beyond the 1-year minimum) is resolved by secondary research, which cites Rule 5(2) of the Jharkhand Factories (Amendment) Rules, 2025: validity ranges from a minimum of 1 year up to a maximum of 15 years."},{"state":"JH","stateName":"Jharkhand","flag":"SECONDARY_RESOLVED","text":"The ED frames deemed approval purely as a future recommended reform ('currently no provision'). Secondary research found that the Jharkhand Single Window Clearance Act, 2016 already includes deemed approval, self-certification, third-party inspection, and appeals as general statutory features of the single-window regime — meaning a legal hook for deemed approval already exists, strengthening the feasibility of the ED's own recommendation, even though it remains unconfirmed whether Factory License specifically is a scheduled service under that provision."},{"state":"JK","stateName":"Jammu & Kashmir","flag":"SECONDARY_RESOLVED","text":"ED gave only a vague '12-13 documents, varies by size/category' estimate for documentation. Secondary research (the official JK Single Window SOP) resolves this with a specific, citable 15-item checklist, including which NOC is conditional and which four tenure-proof documents are mutually exclusive alternatives."},{"state":"JK","stateName":"Jammu & Kashmir","flag":"SECONDARY_RESOLVED","text":"ED stated the 30-day processing timeline without citing a legal basis. Secondary research confirms it from two independent legal sources: a June 2018 amendment to the J&K Factories Rules and SRO-467 of October 2018."},{"state":"MN","stateName":"Manipur","flag":"SECONDARY_RESOLVED","text":"The ED document's anomalous 'Organization/Department' field (listing what appear to be private company names) is plausibly resolved by secondary research: the Directorate of Trade, Commerce & Industries, Govt. of Manipur is the likely issuing authority, its Director holding the ex-officio posts of Registrar of Firms and Chief Inspector of Factories & Boilers."},{"state":"MN","stateName":"Manipur","flag":"SECONDARY_RESOLVED","text":"Secondary research (a 26 March 2026 Chief Inspector of Factories & Boilers notice) refines the ED's single-stage application description into a two-step sequence — Factory Permit first, then Factory License — and confirms online-only filing became mandatory from 1 April 2026."},{"state":"NL","stateName":"Nagaland","flag":"SECONDARY_RESOLVED","text":"The ED alone leaves open why Nagaland has no statutory timeline, no deemed approval, and no notified risk categories for Factory License. Secondary research resolves this: Nagaland has never notified its own Factories Rules, and a found source confirms the new online system operates only as an interim facilitation mechanism pending such notification — this explains, rather than contradicts, the ED's account."},{"state":"TG","stateName":"Telangana","flag":"SECONDARY_RESOLVED","text":"The ED's ~10-day timeline (3 days scrutiny + 7 days inspection/issuance) is broadly corroborated by a Telangana Factories Department circular (A1-6798-2015-EODB) citing a 7-day Factory License timeline — confirming the same order of magnitude, even though the exact figure is not a 1:1 match (possibly a different start point or a since-superseded 2015 standard)."},{"state":"UP","stateName":"Uttar Pradesh","flag":"SECONDARY_RESOLVED","text":"The deemed-approval mechanism the ED described is confirmed with a specific statutory citation by secondary research: UP Factories (73rd Amendment) Rules, 2018, Rule 3, which provides that plans/licences not rejected in time are deemed approved and licences for already-approved plans are issued the same day."},{"state":"UP","stateName":"Uttar Pradesh","flag":"SECONDARY_RESOLVED","text":"The ED/FGD both state validity as \"up to 10 years\" without nuance. Secondary research confirms this under Rule 9 (2018 amendment) and adds a detail neither source mentioned: hazardous factories under Sec 2(cb) are capped at 5 years, and those also covered by the MSIHC Rules, 1989 are capped at just 3 years."},{"state":"WB","stateName":"West Bengal","flag":"SECONDARY_RESOLVED","text":"Portal identity: the ED does not name the portal used for Factory Licence. Secondary research identifies it as SilpaSathi (silpasathi.wb.gov.in), made the exclusive mandatory channel from 1 January 2023 per a December 2022 Labour Department notification, replacing an earlier standalone departmental system."},{"state":"WB","stateName":"West Bengal","flag":"SECONDARY_RESOLVED","text":"Timeline: the ED's ~65-day figure was only the official's own self-characterisation ('lengthy'), with no governing Act/Rule cited. Secondary research found SilpaSathi's own official user manual independently states a 65-day WBRTPS timeline for a fresh licence, and also surfaced a separate 90-day timeline (2017 RTPS gazette) specifically for renewal/amendment/transfer -- a distinction neither the ED nor FGD mentioned."},{"state":"WB","stateName":"West Bengal","flag":"SECONDARY_RESOLVED","text":"Deemed approval: the ED explicitly states this was unclear/not identified, and the FGD does not mention deemed approval at all. Secondary research found no deemed-approval-to-applicant clause anywhere in the WB Right to Public Services Act framework -- only a Rs 250-1,000 fine on the delaying officer, with no automatic grant to the applicant. This confirms the FGD's real-world account (an uncushioned 3-4 month wait, no safeguard ever invoked) over any assumption of an unstated mechanism."}],"secondaryOpen":[{"state":"AP","stateName":"Andhra Pradesh","flag":"SECONDARY_OPEN","text":"Secondary research identified two further 2025 Factories Rules amendments (G.O.Ms.No.19 and G.O.Ms.No.22) and a draft Safety Audit Rules 2025, but their actual content could not be confirmed online, so what (if anything) they change for factory licensing remains unknown."},{"state":"CG","stateName":"Chhattisgarh","flag":"SECONDARY_OPEN","text":"Secondary research found the Chhattisgarh Ease of Doing Business Bill, 2026 (Assembly-passed 16 Jul 2026) reportedly introduces deemed/auto-approval and self-certification across an initial 43 services, which would resolve the ED's 'no deemed approval mechanism identified' gap if Factory Licence is covered and the Bill has commenced — but Governor's assent, gazette notification, commencement date and service coverage could not be confirmed, so this gap remains open. A separate low-confidence secondary source suggesting a Rule 5 validity change from 10 to 15 years (notification RULE-5/39/2025-LABOUR, Aug 2025) also could not be confirmed against primary text, so the validity-period gap likewise remains open."},{"state":"DNHDD","stateName":"Dadra & Nagar Haveli and Daman & Diu","flag":"SECONDARY_OPEN","text":"Secondary (web) research could not resolve the ED-vs-FGD deemed-approval discrepancy from any official rule text found online. It surfaced a draft DNH & DD Ease of Doing Business Regulation, 2026 proposing a 'Right to Business' self-declaration/in-principle-approval framework for MSMEs (conceptually adjacent to, but not confirmed as, the FGD's 25-day timer) and a possible legal-fragmentation explanation (a 2026 draft OSH rules document still referencing the 'Goa, Daman & Diu Factories Rules, 1985' as applicable to Daman specifically) — neither confirms nor denies whether a formal 25-day deemed-approval rule currently exists."},{"state":"HP","stateName":"Himachal Pradesh","flag":"SECONDARY_OPEN","text":"The ED's claim that deemed approval is available and operative (30 days for BPA, 45 days for Factory License) could not be independently verified through secondary/web research; it remains sourced only to the official's statement."},{"state":"HP","stateName":"Himachal Pradesh","flag":"SECONDARY_OPEN","text":"The ED's claim that Fire NOC and Pollution NOC are not sought as part of factory licensing (unless required under other laws) could not be independently verified through secondary research."},{"state":"JH","stateName":"Jharkhand","flag":"SECONDARY_OPEN","text":"Whether the Factory License service is specifically notified as a 'scheduled service' under the Jharkhand Single Window Clearance Act, 2016's deemed-approval provision could not be confirmed by secondary research, so the ED's claim that deemed approval is 'not yet implemented' for this service remains plausible but unverified either way."},{"state":"JH","stateName":"Jharkhand","flag":"SECONDARY_OPEN","text":"Secondary research confirms the 28 March 2025 Schedule A/B/C fee notification exists, matching the ED's cited notification, but the exact per-slab rupee figures quoted by the ED could not be independently re-verified against the notification text."},{"state":"JH","stateName":"Jharkhand","flag":"SECONDARY_OPEN","text":"Per the seed secondary research notes, 'third-party estimates' for the 30-day overall / 12-day internal-forwarding SLA 'diverge substantially' from the ED's official figures, but no specific alternative figures were captured — this discrepancy remains unresolved and unquantified."},{"state":"JK","stateName":"Jammu & Kashmir","flag":"SECONDARY_OPEN","text":"The statutory fee amount for factory licence registration is not stated in the ED transcript, and secondary (web) research also did not turn up a numerical fee schedule for J&K -- this remains unresolved."},{"state":"MN","stateName":"Manipur","flag":"SECONDARY_OPEN","text":"A Factory-License-specific processing timeline remains unconfirmed. Secondary research did not find a citable figure to resolve the ED's ambiguous 90-day figure, which the ED itself ties to Building Plan Approval rather than clearly to the Factory Licence."},{"state":"NL","stateName":"Nagaland","flag":"SECONDARY_OPEN","text":"The precise start date/month of the online portal rollout remains unresolved after secondary research: sources conflict on whether the district pilot began in December 2025 or whether the operative notification is dated 8 June 2026 for statewide go-live, so the exact pilot-start month could not be pinned down."},{"state":"NL","stateName":"Nagaland","flag":"SECONDARY_OPEN","text":"Secondary (web) research could not independently verify several ED claims: the PAN/Aadhaar waiver, the employee/horsepower-based fee schedule, and the official step sequence described by the expert. These remain sourced to the ED interview alone."},{"state":"TG","stateName":"Telangana","flag":"SECONDARY_OPEN","text":"Whether the TS-iPASS Act's Section 13 'List of Deemed Approvals' schedule actually names Factory License as a service covered by the statutory deemed-approval mechanism remains unresolved — secondary research could not retrieve the schedule itself to check, despite a government presentation referencing factories/boilers renewals generally as included under TS-iPASS."},{"state":"UP","stateName":"Uttar Pradesh","flag":"SECONDARY_OPEN","text":"The FGD's characterisation of Nivesh Mitra 3.0 as a confusing regression from 2.0 (complex forms, poor guidance, unresponsive support) could not be independently corroborated or refuted by secondary research; only official Invest UP press releases confirming the service consolidation (500+ to ~200-225 services, plus an AI chatbot) were found, with no independent user-complaint coverage."},{"state":"WB","stateName":"West Bengal","flag":"SECONDARY_OPEN","text":"Exact statutory/application fee amount: the ED states no fee figure or variation by establishment size/employees/validity was given, and the FGD gives no INR figures at all. Secondary research found the fee basis (Schedules A, B, C of the WB Factories Rules; calculated by the Inspector of Factories; paid via treasury receipt; due annually before 31 December with a Form 2 renewal return) but could not locate the actual rupee amounts -- this gap remains open even after the web-search pass."}],"missing":[{"state":"AP","stateName":"Andhra Pradesh","flag":"MISSING","text":"Exact INR fee amounts/slab figures for the factory license are not stated anywhere in ED, FGD, or secondary research — only that it is 'slab-based' and linked to horsepower and number of workers. Secondary research notes current fee-schedule figures could not be verified online (only a clearly outdated 1994 reference was found)."},{"state":"AP","stateName":"Andhra Pradesh","flag":"MISSING","text":"Neither ED nor FGD states how many in-person/office visits an applicant typically needs versus fully online steps; this remains unclear even after cross-checking against the secondary-research field."},{"state":"CG","stateName":"Chhattisgarh","flag":"MISSING","text":"No numerical statutory or average processing timeline for Factory Licence is stated anywhere in the ED. The FGD references a '30-day prescribed timeline' but this was not independently corroborated by the official."},{"state":"CG","stateName":"Chhattisgarh","flag":"MISSING","text":"The validity period of the Factory Licence and its renewal cycle are not specified in either the ED or FGD."},{"state":"CG","stateName":"Chhattisgarh","flag":"MISSING","text":"No exact statutory fee amount is given anywhere in the sources — only the fee determinants (installed power, manpower, cost of construction) and the fact that fees rise 30% every three years."},{"state":"DNHDD","stateName":"Dadra & Nagar Haveli and Daman & Diu","flag":"MISSING","text":"Exact fee slabs by unit size, employee strength, or registration tenure for the Factory License are not stated anywhere in the ED. The ED gives only a payment ceiling of 'approximately Rs. 1 lakh'; the FGD supplies a single example fee (~₹22,000 for one unit based on connected load) but not a full schedule."},{"state":"DNHDD","stateName":"Dadra & Nagar Haveli and Daman & Diu","flag":"MISSING","text":"Exact validity period/slabs for the Factory License itself are not stated in the ED, which explicitly notes this was 'not confirmed during this discussion' and should be verified with the department separately."},{"state":"HP","stateName":"Himachal Pradesh","flag":"MISSING","text":"No data exists on actual (lived) time taken by applicants to obtain Building Plan Approval or a Factory License in practice — only the statutory/deemed-approval timeline (30 and 45 days) is stated. Since Himachal Pradesh has no FGD (fgdPending: true), real applicant turnaround time, queries/back-and-forth cycles, or delays beyond the statutory window are not captured anywhere in ED or secondary sources."},{"state":"HP","stateName":"Himachal Pradesh","flag":"MISSING","text":"No information exists on informal or unrecorded costs (e.g., consultant/agent fees, facilitation payments, or other out-of-pocket costs businesses incur beyond the statutory fee). This is lived business experience that only an FGD could surface, and none was conducted for this state."},{"state":"JH","stateName":"Jharkhand","flag":"MISSING","text":"No FGD (business/industry-side) document exists for Jharkhand (fgdPending = true). All findings here are from the government official (ED) side and secondary desk research only; applicant-reported lived experience — actual time taken, informal costs, consultant reliance, satisfaction with the portal — is entirely absent for this state."},{"state":"JK","stateName":"Jammu & Kashmir","flag":"MISSING","text":"The validity period of the initial factory licence (as distinct from renewal) is not stated anywhere in the ED transcript or secondary research; only the renewal validity (1-5 years, applicant's choice, independent of risk category) is documented."},{"state":"MN","stateName":"Manipur","flag":"MISSING","text":"The exact Factory Licence fee schedule/amounts are not stated anywhere; the ED only notes the fee is variable based on number of workers and maximum installed horsepower under the Manipur Factories Rules 2021, without giving figures, and secondary research did not surface the schedule either."},{"state":"MN","stateName":"Manipur","flag":"MISSING","text":"Deemed-approval status for Factory Licence is not established by any official Manipur source; the Manipur Factories Rules 2021 and the Manipur Public Services Delivery Guarantee Act, 2021 are referenced as applicable frameworks only, with no confirming provision cited."},{"state":"MN","stateName":"Manipur","flag":"MISSING","text":"No specific Act or Rule driving each individual documentation/compliance requirement (e.g., Fire NOC, Pollution Control Board consent, stability certificate) was identified during the Expert Discussion, per the 'Compliance Burden / Redundant Requirements' section."},{"state":"NL","stateName":"Nagaland","flag":"MISSING","text":"Exact Factory License fee amounts are not stated anywhere. The ED confirms fees vary by number of employees and horsepower utilized and that a fee chart exists on the portal, but the expert did not provide the actual figures, and secondary research could not independently verify a fee schedule either."},{"state":"NL","stateName":"Nagaland","flag":"MISSING","text":"The validity period and renewal interval of the Factory License are not specified in the ED transcript. The expert did not address this, and no unsupported figure has been added."},{"state":"TG","stateName":"Telangana","flag":"MISSING","text":"How renewal actually works for licence categories outside green and some-orange units (i.e., whether it requires fresh submission, inspection, or fee recalculation for the remaining categories) is not stated — the ED transcript explicitly notes 'the discussion didn't go into how renewal differs from the initial process' for these categories."},{"state":"TG","stateName":"Telangana","flag":"MISSING","text":"Deemed-approval status specifically for the Factory License (as opposed to the related Consent to Establish service) is not confirmed in the ED — neither the triggering timeline nor whether TS-iPASS Act 2014 Section 13's 'List of Deemed Approvals' schedule actually names Factory License as a scheduled service (secondary research could not retrieve that schedule to check)."},{"state":"UP","stateName":"Uttar Pradesh","flag":"MISSING","text":"No source -- ED, FGD, or secondary -- reconciles the fee question into a single verified figure or schedule: the ED gives two internally conflicting ranges (INR 150-35,000 and INR 100-7,000) and secondary research surfaced only a third, low-authority range, none of which is confirmed as the operative fee schedule."},{"state":"WB","stateName":"West Bengal","flag":"MISSING","text":"Validity period for the initial (first-grant) licence is not stated in the ED at all. Only the FGD gives a figure -- 'validity of the license is only 1 year' -- which is not itself traced to a specific statute or rule in either transcript, though it is structurally consistent with secondary research's finding of an annual (before 31 December) renewal cycle."}],"vague":[{"state":"AP","stateName":"Andhra Pradesh","flag":"VAGUE","text":"The ED transcript states the deadline for submitting a revised plan after a minor deviation is found as 'a stipulated period (e.g., 15 days/1 week)' — two different units given without a single precise figure."},{"state":"CG","stateName":"Chhattisgarh","flag":"VAGUE","text":"Deemed-approval status is not clearly stated. The ED says only that 'the source report does not specify whether deemed approval is available' and that 'no specific operational mechanism for deemed approval was identified in the discussion' — this is an absence of discussion, not a definitive confirmation that no deemed-approval mechanism exists."},{"state":"HP","stateName":"Himachal Pradesh","flag":"VAGUE","text":"The statutory fee is stated only as a wide, non-itemized range — \"approximately ₹1,000\" for smaller establishments to \"around ₹2 lakh\" for large factories — without a precise fee schedule tied to specific horsepower/worker-count slabs. Secondary research additionally raises the possibility that fees may scale with the chosen validity period (per the 2024 amendment's title), which is not confirmed either way, adding further imprecision to the ED's fee claim."},{"state":"JH","stateName":"Jharkhand","flag":"VAGUE","text":"The ED describes the compliance burden around cross-departmental verification only qualitatively ('cross-departmental document verification remains a challenge') without quantifying how many departments, how long verification typically adds, or how often it causes delay."},{"state":"MN","stateName":"Manipur","flag":"VAGUE","text":"The ED's cited processing timeline of '90 days for approval of the factory plan and permission to construct/extend/take into use a building as a factory' is ambiguous — it is not clearly established as the Factory Licence's own processing timeline rather than a Building Plan Approval timeline."},{"state":"NL","stateName":"Nagaland","flag":"VAGUE","text":"The ED states processing takes \"hardly one to two days\" where papers are correct — but this is not a notified statutory or public-service-guarantee timeline (none has been notified) and there is no time-tracking mechanism, so the figure reflects a newly online, low-volume system rather than a measurable commitment."},{"state":"NL","stateName":"Nagaland","flag":"VAGUE","text":"The expert stated the payment gateway \"may charge around 5%\" but expressed uncertainty himself; this is recorded only as an approximate, unconfirmed statement, not a verified departmental or gateway fee."},{"state":"TG","stateName":"Telangana","flag":"VAGUE","text":"The 'per-day monetary penalty on officers who delay applications,' cited by the official as a Telangana best practice, is never quantified anywhere in the ED transcript — no rupee amount or calculation basis is given."}],"reforms":[{"state":"CG","stateName":"Chhattisgarh","flag":"REFORM","text":"The official himself flagged the 30%-every-three-years fee escalation as 'a potential area for review,' and separately recommended integrating Factory Building Plan Approval with the Factory Licence process to cut repeated documentation — both are concrete, official-sourced reform directions, echoed independently by the FGD's call to link building-plan, fire, electricity and pollution approvals to run in parallel."},{"state":"DNHDD","stateName":"Dadra & Nagar Haveli and Daman & Diu","flag":"REFORM","text":"FGD-sourced concrete simplification: adopt a Gujarat-style transition period allowing green/low-risk units to commence operations on self-declaration/intimation, with up to two to three years to complete peripheral compliances after starting operations — addresses the policy-issue complaint that DNH/Daman lacks tiered compliance timelines for lower-risk or newer units."},{"state":"JK","stateName":"Jammu & Kashmir","flag":"REFORM","text":"The expert's own suggestion -- that low-risk, document-complete applications should move toward deemed or same-day (tatkal-style) approval -- is a concrete, officer-endorsed simplification that is not yet implemented in J&K."},{"state":"WB","stateName":"West Bengal","flag":"REFORM","text":"Both ED and FGD independently converge on the same concrete fix: stop requiring resubmission of the factory building/layout plan (or other supporting documents) at every renewal when nothing has changed, and require revised plans/documents only when actual alterations have been made. The ED frames this as its main identified redundant requirement; the FGD's 'redundant/duplicate documents' theme describes the same pattern (resubmission triggered by any deficiency found at scrutiny)."}]}};

  flask:'<path d="M9 2v6.5L4 18a2 2 0 0 0 1.8 3h12.4a2 2 0 0 0 1.8-3L15 8.5V2"/><path d="M8.5 2h7"/><path d="M7 15h10"/>',
  download:'<path d="M12 3v12"/><path d="M6.5 10 12 15.5 17.5 10"/><path d="M4 19.5h16"/>',
  check:'<circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.3l3 3 6-6.6"/>',
  pin:'<path d="M12 21.5s7.2-7.6 7.2-12.3A7.2 7.2 0 0 0 4.8 9.2c0 4.7 7.2 12.3 7.2 12.3z"/><circle cx="12" cy="9" r="2.6"/>',
  alert:'<path d="M12 3 2.2 20h19.6z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.3" r=".6" fill="currentColor"/>',
  dash:'<circle cx="12" cy="12" r="9.5" stroke-dasharray="2.5 3"/>',
  arrow:'<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>',
  link:'<path d="M9 15 15 9"/><path d="M10 6.5 11.5 5a4 4 0 0 1 5.7 5.7L15.5 12.2"/><path d="M14 17.5 12.5 19a4 4 0 0 1-5.7-5.7L8.5 11.8"/>',
  quote:'<path d="M7 7h4v6c0 3-2 5-5 5"/><path d="M15 7h4v6c0 3-2 5-5 5"/>',
  unlock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.3-2.3"/>'
};
function icon(name, cls){ return `<svg class="ic${cls?' '+cls:''}" viewBox="0 0 24 24">${ICONS[name]||''}</svg>`; }
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const STATES = DATA.states.slice().sort((a,b)=>a.name.localeCompare(b.name));
const ST_BY_CODE = {}; STATES.forEach(s=>ST_BY_CODE[s.code]=s);
const PHASES = DATA.phases;
const PHASE_BY_CODE = {}; PHASES.forEach(p=>PHASE_BY_CODE[p.code]=p);
const AGG = DATA.aggregates;

STATES.forEach(s=>{
  s._stepCount = s.steps.length;
  const nonInspect = s.steps.filter(x=>x.phase!=='inspect');
  const onlineCount = nonInspect.filter(x=>x.automated===true).length;
  s._autoShare = nonInspect.length ? onlineCount/nonInspect.length : null;
  s._hasInspection = s.steps.some(x=>x.phase==='inspect');
  s._timeMid = (s.timeline.minDays!=null && s.timeline.maxDays!=null) ? (s.timeline.minDays+s.timeline.maxDays)/2 : null;
});

const DEEMED_LABEL = {yes:'Yes', no:'No', unclear:'Not confirmed'};
const STAGE_MAP = Object.fromEntries(PHASES.map(p=>[p.code,{k:p.code,n:p.label}]));
const STAGES = Object.values(STAGE_MAP);

const CATEGORY_LABEL = {pain:'Pain point', policy:'Policy', procedural:'Procedure', redundant:'Redundancy', delay:'Delay', suggestions:'Suggestion', remarks:'Remark'};
const SENT_CLASS = {issue:'sent-issue', neutral:'sent-neutral', positive:'sent-positive', suggestion:'sent-suggestion'};
const SRC_LABEL = {ed:'ED', fgd:'FGD', secondary:'Secondary'};
const GAP_META = {
  MISSING:   {label:'Missing', icon:'dash'},
  VAGUE:     {label:'Vague', icon:'alert'},
  INCONSISTENT: {label:'Inconsistent', icon:'scale'},
  SECONDARY_RESOLVED: {label:'Resolved by secondary research', icon:'check'},
  SECONDARY_OPEN: {label:'Still open', icon:'flask'},
  GOOD_PRACTICE: {label:'Good practice', icon:'award'},
  REFORM: {label:'Reform idea', icon:'arrow'}
};

const F = { view:'overview', state:null, phase:'apply', cmp:[], search:'', sort:{col:null,dir:1}, findSrc:'all' };

/* ---------- formatting helpers ---------- */
const fmtDays = t => { if(t.minDays==null) return 'Not specified'; if(t.minDays===t.maxDays) return t.minDays+' days'; return t.minDays+'–'+t.maxDays+' days'; };
function stepBadgeClass(step){
  if(step.automated===true) return 'online';
  if(step.automated==='partial') return 'mixed';
  if(step.automated===false) return step.phase==='inspect' ? 'site' : 'mixed';
  return 'unclear';
}
function stepBadgeLabel(step){
  if(step.automated===true) return 'Online';
  if(step.automated==='partial') return 'Partly online';
  if(step.automated===false) return step.phase==='inspect' ? 'On-site visit' : 'Manual';
  return 'Conditional';
}
function stepDot(step){ return `<div class="dot ${stepBadgeClass(step)}">${step.automated===true?icon('check'):(step.phase==='inspect'&&step.automated!==true)?icon('pin'):step.n}</div>`; }
function stepBadge(step){ const c=stepBadgeClass(step); return `<span class="badge b-${c==='online'?'online':c==='site'?'site':c==='mixed'?'mixed':'mute'}"><span class="dot"></span>${esc(stepBadgeLabel(step))}</span>`; }
function deemedBadge(d){
  if(d.status==='yes') return `<span class="badge b-online">${icon('check')}Deemed approval: Yes${d.days?(' · '+d.days+' days'):''}</span>`;
  if(d.status==='no') return `<span class="badge b-bad">${icon('alert')}Deemed approval: No</span>`;
  return `<span class="badge b-mute">${icon('dash')}Not confirmed</span>`;
}
function autoLevelTag(s){
  if(s._autoShare==null) return '<span class="tag t-mute">Not scoreable</span>';
  const pct = Math.round(s._autoShare*100);
  if(pct>=85) return `<span class="tag t-ok">${pct}% digitised</span>`;
  if(pct>=55) return `<span class="tag t-warn">${pct}% digitised</span>`;
  return `<span class="tag t-bad">${pct}% digitised</span>`;
}
function kpiIcon(cls,ic,l,v,s){ return `<div class="kpi ${cls}"><div class="k-top"><div class="k-l">${esc(l)}</div><div class="k-icon">${icon(ic)}</div></div><div class="k-v">${esc(v)}</div><div class="k-s">${esc(s)}</div></div>`; }
function hbars(items){
  const max = Math.max(1, ...items.map(i=>i.max||i.v||1));
  return '<div class="hbars">'+items.map((i)=>{
    const pct = i.v==null?0:Math.max(2, (i.v/max)*100);
    return `<div class="hbar"><div class="hb-n" ${i.code?`onclick="goState('${i.code}')"`:''}>${esc(i.n)}</div>`+
      `<div class="hb-track"><div class="hb-fill" data-w="${pct}" style="background:${i.col||'var(--primary)'}"></div></div>`+
      `<div class="hb-v">${esc(i.label)}</div></div>`;
  }).join('')+'</div>';
}
function animateBars(){
  document.querySelectorAll('.hb-fill[data-w]').forEach(el=>{ el.style.width = '0%'; });
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      document.querySelectorAll('.hb-fill[data-w]').forEach(el=>{ el.style.width = el.dataset.w + '%'; });
    });
  });
}
function portalLink(s){
  if(!s.portal.url) return `<span class="chip-sm" title="Portal name known from the Expert Discussion; URL not independently confirmed">${icon('pin')} ${esc(s.portal.name)}</span>`;
  return `<a class="chip-sm link" href="${esc(s.portal.url)}" target="_blank" rel="noopener">${icon('link')} ${esc(s.portal.name)}</a>`;
}

/* ---------- findings / quotes / gaps (new) ---------- */
function findingItem(f){
  return `<div class="finding ${SENT_CLASS[f.sentiment]||''}">
    <div class="fmeta"><span class="ftag src-${f.source}">${SRC_LABEL[f.source]||f.source}</span><span class="fcat">${esc(CATEGORY_LABEL[f.category]||f.category)}</span>${(f.tags||[]).map(t=>`<span class="ftag">${esc(t)}</span>`).join('')}</div>
    <div class="ftext">${esc(f.text)}</div>
  </div>`;
}
function quoteCard(q){
  return `<div class="quote-card"><div class="qmark">"</div><div class="qtext">${esc(q.quote)}</div>
    <div class="qmeta"><span class="qtopic">${esc(q.topic||'')}</span><span>${esc(q.speaker||'')}</span></div></div>`;
}
function gapBadge(flag){ const m = GAP_META[flag]||{label:flag,icon:'dash'}; return `<span class="gapbadge gf-${flag}">${icon(m.icon)}${esc(m.label)}</span>`; }
function gapItem(g, showState){
  return `<div class="gap-item"><div class="gi-head">${gapBadge(g.flag)}${showState?`<span class="gi-state" onclick="goState('${g.state}')">${esc(g.stateName||g.state)}</span>`:''}</div>
    <div class="gi-text">${esc(g.text)}</div></div>`;
}

/* ---------- nav ---------- */
const NAV = [
  {k:'overview', icon:'grid', t:'National overview', d:'Factory License across all 11 States/UTs'},
  {k:'state', icon:'user', t:'State profile', d:'Tagged ED / FGD / secondary findings per step'},
  {k:'compare', icon:'columns', t:'Compare States', d:'Line up 2–4 States side by side'},
  {k:'phase', icon:'layers', t:'Stage comparison', d:'One process stage, across every State'},
  {k:'best', icon:'award', t:'Best practices', d:'Good practice, as flagged in the real record'},
  {k:'reconcile', icon:'scale', t:'Official vs. lived experience', d:'Every logged inconsistency, both sides quoted'},
  {k:'gaps', icon:'flask', t:'Closing the gap', d:'What secondary research resolved — and what it could not'},
  {k:'method', icon:'book', t:'Method & data quality', d:'Taxonomy, sources, open gaps'}
];
function buildNav(){
  document.getElementById('railnav').innerHTML = NAV.map(n=>
    `<button class="navbtn" data-view="${n.k}" onclick="goView('${n.k}')">${icon(n.icon)}<span><span class="t">${esc(n.t)}</span><span class="d">${esc(n.d)}</span></span></button>`
  ).join('');
}
function goView(v){ F.view=v; render(); }
function goState(code){ F.state=code; F.view='state'; render(); }

function buildFilters(){
  const bar = document.getElementById('filterbar');
  if(F.view==='state'){
    bar.innerHTML = `<div class="fld"><label>State / UT</label><select id="selState">${STATES.map(s=>`<option value="${s.code}" ${F.state===s.code?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
      <div class="fld"><label>&nbsp;</label><div style="display:flex;gap:6px"><button class="btn sm" id="prevSt">← Prev</button><button class="btn sm" id="nextSt">Next →</button></div></div>`;
    document.getElementById('selState').onchange = e=>{ F.state=e.target.value; render(); };
    document.getElementById('prevSt').onclick = ()=>{ const i=STATES.findIndex(s=>s.code===F.state); F.state=STATES[(i-1+STATES.length)%STATES.length].code; render(); };
    document.getElementById('nextSt').onclick = ()=>{ const i=STATES.findIndex(s=>s.code===F.state); F.state=STATES[(i+1)%STATES.length].code; render(); };
  } else if(F.view==='phase'){
    bar.innerHTML = `<div class="fld"><label>Process stage</label><select id="selPhase">${STAGES.map(p=>`<option value="${p.k}" ${F.phase===p.k?'selected':''}>${esc(p.n)}</option>`).join('')}</select></div>`;
    document.getElementById('selPhase').onchange = e=>{ F.phase=e.target.value; render(); };
  } else {
    bar.innerHTML = `<div class="fld"><label>Pilot service</label><select disabled><option>Factory License</option></select></div>
      <div class="fld"><label>Coverage</label><select disabled><option>11 of 36 States/UTs (ED complete)</option></select></div>`;
  }
}

/* ========================= VIEWS ========================= */

function renderOverview(){
  const withDeemed = STATES.filter(s=>s.deemedApproval.status==='yes').length;
  const withFGD = STATES.filter(s=>!s.fgdPending).length;
  const timed = STATES.filter(s=>s._timeMid!=null);
  const fastest = timed.slice().sort((a,b)=>a._timeMid-b._timeMid)[0];
  const slowest = timed.slice().sort((a,b)=>b._timeMid-a._timeMid)[0];
  const q = F.search.trim().toLowerCase();
  const filtered = q ? STATES.filter(s=>s.name.toLowerCase().includes(q)) : STATES;
  const resolved = AGG.gapFlagCounts.SECONDARY_RESOLVED||0, open = AGG.gapFlagCounts.SECONDARY_OPEN||0;

  let h = `<div class="pagehead"><div><h2>${icon('grid')}Factory License — national overview</h2>
    <div class="lede">${esc(DATA.meta.sourcesNote)}</div></div>
    <span class="stamp live">${AGG.totalFindings} tagged findings · ${AGG.totalGaps} gaps logged</span></div>`;

  h += `<div class="banner info">${icon('alert')}<span><b>Reading this pilot.</b> This is a process-comparison tool (steps, timeline, automation, documents, deemed approval) built strictly from real Expert Discussion, Focused Group Discussion and secondary-research records — not a composite score. Cost figures shown anywhere are informal numbers volunteered in discussions, not full CoR 2.0 survey output.</span></div>`;

  h += `<div class="grid g5" style="margin-bottom:16px">
    ${kpiIcon('acc-primary','grid','States covered','11 / 36','Factory License · ED complete')}
    ${kpiIcon('acc-primary','book','Tagged findings', String(AGG.totalFindings), AGG.totalQuotes+' direct quotes from businesses')}
    ${kpiIcon('acc-danger','alert','Gaps identified', String(AGG.totalGaps), (AGG.gapFlagCounts.MISSING||0)+' missing · '+(AGG.gapFlagCounts.VAGUE||0)+' vague · '+(AGG.gapFlagCounts.INCONSISTENT||0)+' inconsistent')}
    ${kpiIcon('acc-success','flask','Closed by secondary research', resolved+' of '+(resolved+open), Math.round(resolved/(resolved+open)*100)+'% of researchable gaps resolved')}
    ${kpiIcon('acc-violet','award','Good practice logged', String(AGG.gapFlagCounts.GOOD_PRACTICE||0), 'see Best Practices tab')}
  </div>`;

  h += `<div class="grid g23" style="margin-bottom:16px">
    <div class="card hoverable"><div class="card-h"><h3>Overall timeline, by State</h3><span class="note">statutory/prescribed, where stated</span></div><div class="card-b">
    ${hbars(STATES.map(s=>({n:s.name+' ('+s.code+')', code:s.code, v:s._timeMid, max:65, label: s._timeMid!=null?fmtDays(s.timeline):'not specified', col: s._timeMid==null?'#C3CBD4':(s._timeMid<=15?'var(--success)':s._timeMid<=35?'var(--warning)':'var(--danger)')})))}
    <div class="hint">Fastest: <b>${fastest?esc(fastest.name)+' ('+fmtDays(fastest.timeline)+')':'—'}</b>. Slowest: <b>${slowest?esc(slowest.name)+' ('+fmtDays(slowest.timeline)+')':'—'}</b>.</div>
    </div></div>
    <div class="card hoverable"><div class="card-h"><h3>Digitisation of application &amp; scrutiny</h3><span class="note">excludes site inspection, a safety step not a process gap</span></div><div class="card-b">
    ${hbars(STATES.map(s=>({n:s.name+' ('+s.code+')', code:s.code, v:s._autoShare==null?0:Math.round(s._autoShare*100), max:100, label:s._autoShare==null?'n/a':Math.round(s._autoShare*100)+'%', col:'var(--primary)'})))}
    </div></div>
  </div>`;

  const sortCol = F.sort.col, sortDir = F.sort.dir;
  const sorters = {
    name:s=>s.name, steps:s=>s._stepCount, timeline:s=>s._timeMid??9999, auto:s=>s._autoShare??-1, deemed:s=>s.deemedApproval.status, gaps:s=>s.gaps.length
  };
  let rows = filtered.slice();
  if(sortCol) rows.sort((a,b)=> (sorters[sortCol](a) > sorters[sortCol](b) ? 1 : -1) * sortDir);

  const th = (col,label,extra) => `<th onclick="sortBy('${col}')">${esc(label)}${sortCol===col?`<span class="sort-arrow">${sortDir===1?'▲':'▼'}</span>`:''}${extra||''}</th>`;

  h += `<div class="card"><div class="card-h"><h3>State-by-state comparison — Factory License</h3>
    <span class="note">click a column to sort · click a row for the full profile</span></div>
    <div class="card-b tight"><div class="scroll-y"><table class="dt"><thead><tr>
    ${th('name','State / UT')}${th('steps','Steps')}${th('timeline','Timeline')}${th('auto','Digitisation')}${th('deemed','Deemed approval')}${th('gaps','Gaps logged')}
    </tr></thead><tbody>`+
    rows.map(s=>`<tr>
      <td class="state-link" onclick="goState('${s.code}')">${esc(s.name)}${!s.fgdPending?' '+icon('user'):''}
      <small>${esc(s.ed.date)} · ${esc((s.ed.designation||'').split(',')[0])}</small></td>
      <td class="n">${s._stepCount}</td><td>${fmtDays(s.timeline)}</td><td>${autoLevelTag(s)}</td><td>${deemedBadge(s.deemedApproval)}</td>
      <td class="n">${s.gaps.length}</td>
    </tr>`).join('')+
    '</tbody></table></div></div></div>';

  return h;
}
function sortBy(col){
  if(F.sort.col===col) F.sort.dir *= -1; else { F.sort.col = col; F.sort.dir = 1; }
  render();
}

function sourceBanner(s){
  const parts = [];
  parts.push(`<span class="chip-sm">${icon('book')} ED: ${esc(s.ed.date)}</span>`);
  parts.push(s.fgdPending ? `<span class="chip-sm">${icon('user')} FGD: not conducted</span>` : `<span class="chip-sm">${icon('user')} FGD: ${esc((s.fgdMeta||'').split('·')[0]).trim()}</span>`);
  parts.push(`<span class="chip-sm">${icon('flask')} Secondary: ${s.findings.filter(f=>f.source==='secondary').length} findings</span>`);
  return parts.join(' ');
}

function renderState(){
  const s = ST_BY_CODE[F.state];
  if(!s) return '<div class="empty"><b>Pick a State</b></div>';
  let h = `<div class="pagehead"><div><h2>${icon('user')}${esc(s.name)}</h2>
    <div class="lede">${esc(s.issuingAuthority)}</div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${sourceBanner(s)} ${portalLink(s)}</div></div>
    <span class="stamp live">ED: ${esc(s.ed.date)}</span></div>`;

  const bd = {online:s.steps.filter(x=>x.automated===true).length, site:s.steps.filter(x=>x.phase==='inspect').length};
  const nonInspectCount = s.steps.filter(x=>x.phase!=='inspect').length;
  h += `<div class="grid g4" style="margin-bottom:16px">
    ${kpiIcon('acc-primary','layers','Steps recorded', String(s._stepCount), 'exactly as the Expert Discussion describes them')}
    ${kpiIcon(s._timeMid==null?'acc-warn':'acc-success','grid','Timeline', fmtDays(s.timeline), s.timeline.basis||'')}
    ${kpiIcon('acc-primary','check','Digitisation', s._autoShare==null?'n/a':Math.round(s._autoShare*100)+'%', bd.online+' of '+nonInspectCount+' non-inspection steps online'+(s._hasInspection?' · '+bd.site+' on-site visit':''))}
    ${kpiIcon(s.deemedApproval.status==='yes'?'acc-success':'acc-danger','award','Deemed approval', DEEMED_LABEL[s.deemedApproval.status], s.deemedApproval.days?(s.deemedApproval.days+' days'):'')}
  </div>`;

  h += `<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>${icon('layers')}Process — official record</h3>
    <span class="note">${esc(s.ed.expert||'')}, ${esc(s.ed.designation||'')} · ${esc(s.ed.location||'')}</span></div>
    <div class="card-b"><div class="stepper">`+
    s.steps.map(st=>`<div class="step-v"><div class="rail-col">${stepDot(st)}<div class="line"></div></div>
      <div class="body"><div class="sp">${esc(STAGE_MAP[st.phase]?.n||st.phase)}</div>
      <div class="st">${esc(st.title)}${stepBadge(st)}</div>
      ${st.note?`<div class="sd">${esc(st.note)}</div>`:''}
      ${st.documents&&st.documents.length?`<div class="step-docs"><b>Documents required here (${st.documents.length})</b><ul>${st.documents.map(d=>`<li>${esc(d)}</li>`).join('')}</ul><div class="step-portal">${portalLink(s)}</div></div>`:''}
      </div></div>`).join('')+
    '</div></div></div>';

  h += `<div class="grid g3" style="margin-bottom:16px">
    <div class="card"><div class="card-h"><h3>Fees &amp; validity</h3></div><div class="card-b" style="font-size:12.5px;color:var(--muted);line-height:1.6">
      <b style="color:var(--ink)">Fees</b><br>${esc(s.fees.text)}<br><br><b style="color:var(--ink)">Validity</b><br>${esc(s.validity.text)}</div></div>
    <div class="card"><div class="card-h"><h3>Deemed approval</h3></div><div class="card-b" style="font-size:12.5px;color:var(--muted);line-height:1.6">${deemedBadge(s.deemedApproval)}<div style="margin-top:9px">${esc(s.deemedApproval.text)}</div></div></div>
    <div class="card"><div class="card-h"><h3>Documents</h3></div><div class="card-b" style="font-size:12.5px;color:var(--muted);line-height:1.6">${(s.documents||[]).length?'<ul style="margin:0;padding-left:16px">'+s.documents.map(d=>`<li>${esc(d)}</li>`).join('')+'</ul>':'See findings below.'}${s.documentsNote?`<div style="margin-top:8px">${esc(s.documentsNote)}</div>`:''}</div></div>
  </div>`;

  // tagged findings, grouped by source with filter tabs
  const srcCounts = {ed:0, fgd:0, secondary:0};
  s.findings.forEach(f=>srcCounts[f.source]=(srcCounts[f.source]||0)+1);
  const visible = F.findSrc==='all' ? s.findings : s.findings.filter(f=>f.source===F.findSrc);
  h += `<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>${icon('book')}Tagged findings</h3><span class="note">${s.findings.length} total — category, topic tags, sentiment, all traced to source</span></div>
    <div class="card-b">
    <div class="tabset">
      <button class="tabbtn ${F.findSrc==='all'?'on':''}" onclick="setFindSrc('all')">All (${s.findings.length})</button>
      <button class="tabbtn ${F.findSrc==='ed'?'on':''}" onclick="setFindSrc('ed')">ED (${srcCounts.ed||0})</button>
      <button class="tabbtn ${F.findSrc==='fgd'?'on':''}" onclick="setFindSrc('fgd')">FGD (${srcCounts.fgd||0})</button>
      <button class="tabbtn ${F.findSrc==='secondary'?'on':''}" onclick="setFindSrc('secondary')">Secondary (${srcCounts.secondary||0})</button>
    </div>
    <div class="scroll-y" style="max-height:600px">${visible.map(findingItem).join('')||'<div class="hint">No findings in this filter.</div>'}</div>
    </div></div>`;

  if(s.quotes.length){
    h += `<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>${icon('quote')}What businesses actually said</h3><span class="note">verbatim, from the FGD transcript</span></div><div class="card-b"><div class="grid g2">${s.quotes.map(quoteCard).join('')}</div></div></div>`;
  } else {
    h += `<div class="gap-note" style="margin-bottom:16px">${icon('dash')} No Focused Group Discussion has been held in ${esc(s.name)} for Factory License yet — there is no direct business-owner quote to show here. See the findings above for what secondary research could independently verify instead.</div>`;
  }

  h += `<div class="card"><div class="card-h"><h3>${icon('flask')}Gaps &amp; secondary research</h3><span class="note">${s.gaps.length} flags for this State</span></div><div class="card-b">${s.gaps.map(g=>gapItem(g,false)).join('')}</div></div>`;

  return h;
}
function setFindSrc(src){ F.findSrc = src; render(); }

function renderCompare(){
  let h = `<div class="pagehead"><div><h2>${icon('columns')}Compare States</h2><div class="lede">Pick 2 to 4 States/UTs to line up side by side.</div></div></div>`;
  h += `<div class="card" style="margin-bottom:16px"><div class="card-b"><div class="statepick">${STATES.map(s=>`<button class="${F.cmp.includes(s.code)?'on':''}" onclick="toggleCmp('${s.code}')">${esc(s.name)} <span class="n">${s.code}</span></button>`).join('')}</div><div class="hint">Select up to 4. Selecting a 5th replaces the first pick.</div></div></div>`;
  const chosen = F.cmp.map(c=>ST_BY_CODE[c]).filter(Boolean);
  if(chosen.length<2) return h+'<div class="empty"><b>Pick at least two States</b></div>';
  h += `<div class="grid" style="grid-template-columns:repeat(${chosen.length},minmax(0,1fr));margin-bottom:16px">`+
    chosen.map(s=>`<div class="cmp-col"><div class="cc-h"><div class="n">${esc(s.name)}</div><div class="s">${esc(s.ed.date)}</div></div>
      <div class="cmp-row"><div class="l">Steps</div>${s._stepCount}</div>
      <div class="cmp-row"><div class="l">Timeline</div>${fmtDays(s.timeline)}</div>
      <div class="cmp-row"><div class="l">Digitisation</div>${autoLevelTag(s)}</div>
      <div class="cmp-row"><div class="l">Deemed approval</div>${deemedBadge(s.deemedApproval)}</div>
      <div class="cmp-row"><div class="l">Gaps logged</div>${s.gaps.length} (${s.gaps.filter(g=>g.flag==='SECONDARY_RESOLVED').length} resolved)</div>
      <div class="cmp-row" style="border-bottom:0"><div class="l">Sources</div>${sourceBanner(s)}</div>
      </div>`).join('')+'</div>';
  h += `<div class="card"><div class="card-h"><h3>Process, side by side</h3></div><div class="card-b tight">
    <div class="grid" style="grid-template-columns:repeat(${chosen.length},minmax(0,1fr))">`+
    chosen.map(s=>`<div style="padding:11px 13px;border-right:1px solid var(--border-2)"><div style="font-weight:700;font-size:12.5px;margin-bottom:9px;cursor:pointer" onclick="goState('${s.code}')">${esc(s.name)}</div><div class="stepper">`+
      s.steps.map(st=>`<div class="step-v"><div class="rail-col">${stepDot(st)}<div class="line"></div></div><div class="body" style="padding-bottom:16px"><div class="sp">${esc(STAGE_MAP[st.phase]?.n||st.phase)}</div><div class="st" style="font-size:12px">${esc(st.title)}</div></div></div>`).join('')+
      '</div></div>').join('')+'</div></div></div>';
  return h;
}
function toggleCmp(code){ const i=F.cmp.indexOf(code); if(i>=0) F.cmp.splice(i,1); else { if(F.cmp.length>=4) F.cmp.shift(); F.cmp.push(code); } render(); }

/* ---------- stage comparison, driven by the real phase taxonomy already in the data ---------- */
function renderPhase(){
  const stage = STAGE_MAP[F.phase];
  const phaseDef = PHASE_BY_CODE[F.phase];
  let h = `<div class="pagehead"><div><h2>${icon('layers')}Stage comparison — ${esc(stage.n)}</h2>
    <div class="lede">${esc(phaseDef?phaseDef.desc:'')} Each State's actual sub-steps here, plus the tagged findings that relate to this stage.</div></div></div>`;

  const withStep = STATES.map(s=>({s, steps:s.steps.filter(x=>x.phase===F.phase)})).filter(x=>x.steps.length);
  const groups = {online:[], mixed:[], site:[]};
  withStep.forEach(({s,steps})=>{
    steps.forEach(st=>{
      const c = stepBadgeClass(st);
      groups[c==='online'?'online':c==='site'?'site':'mixed'].push({s, st});
    });
  });
  const total = groups.online.length+groups.mixed.length+groups.site.length;
  if(total){
    h += `<div class="card" style="margin-bottom:16px"><div class="card-b"><div class="hbars">
      <div class="hbar" style="grid-template-columns:150px 1fr 50px"><div class="hb-n">Fully online</div><div class="hb-track"><div class="hb-fill" style="width:${groups.online.length/total*100}%;background:var(--success)"></div></div><div class="hb-v">${groups.online.length}</div></div>
      <div class="hbar" style="grid-template-columns:150px 1fr 50px"><div class="hb-n">Partly online</div><div class="hb-track"><div class="hb-fill" style="width:${groups.mixed.length/total*100}%;background:var(--warning)"></div></div><div class="hb-v">${groups.mixed.length}</div></div>
      <div class="hbar" style="grid-template-columns:150px 1fr 50px"><div class="hb-n">On-site visit</div><div class="hb-track"><div class="hb-fill" style="width:${groups.site.length/total*100}%;background:var(--info)"></div></div><div class="hb-v">${groups.site.length}</div></div>
      </div></div></div>`;
  }

  const col = (cls,label,items) => {
    let c = `<div class="stagecol"><div class="stagecol-h ${cls}">${icon(cls==='online'?'check':cls==='site'?'pin':'dash')}${label} (${items.length})</div>`;
    if(!items.length) c += '<div class="hint">No States recorded here.</div>';
    items.forEach(({s,st})=>{
      const pipe = s.steps.map(x=>{
        const xc = stepBadgeClass(x);
        const dotCls = xc==='online'?'on':xc==='site'?'site':xc==='mixed'?'mixed':'';
        return `<span class="md ${dotCls} ${x.n===st.n?'focus':''}" title="${esc(x.title)}"></span>`;
      }).join('');
      c += `<div class="statecard-mini" onclick="goState('${s.code}')">
        <div class="n">${esc(s.name)} <span class="pos">step ${st.n} of ${s._stepCount}</span></div>
        <div class="d"><b>${esc(st.title)}.</b> ${esc(st.note||'')}</div>
        <div class="mini-pipe">${pipe}</div>
        <div class="meta-row">${portalLink(s)}</div>
      </div>`;
    });
    c += '</div>';
    return c;
  };

  h += `<div class="stagegrid">${col('online','Fully online', groups.online)}${col('mixed','Partly online / manual', groups.mixed)}${col('site','On-site visit (by design)', groups.site)}</div>`;

  const missing = STATES.filter(s=>!s.steps.some(x=>x.phase===F.phase));
  if(missing.length) h += `<div class="gap-note" style="margin-top:16px">${icon('dash')} No step was tagged to this stage for: ${missing.map(s=>esc(s.name)).join(', ')}.</div>`;
  h += `<div class="hint" style="margin-top:4px;margin-bottom:16px">Phase tags (pre / apply / fee / scrutiny / inspect / approve / renew) come directly from the structured ED extraction for each State, applied consistently across all 11 — not a new classification invented for this view.</div>`;

  return h;
}

function renderBest(){
  const practices = AGG.goodPractices;
  let h = `<div class="pagehead"><div><h2>${icon('award')}Best practices across States</h2><div class="lede">Every item here is a <code>GOOD_PRACTICE</code> flag raised while tagging the real ED/FGD/secondary record for that State — not a composite score.</div></div></div>`;
  const timed = STATES.filter(s=>s._timeMid!=null).sort((a,b)=>a._timeMid-b._timeMid);
  const autod = STATES.filter(s=>s._autoShare!=null).sort((a,b)=>b._autoShare-a._autoShare);
  const leaderCard = (kpi,s,metric,why) => `<div class="leader-card"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div class="lc-kpi">${esc(kpi)}</div><div class="medal">${icon('award')}</div></div><div class="lc-state" onclick="goState('${s.code}')">${esc(s.name)}</div><div class="lc-metric">${esc(metric)}</div><div class="lc-why">${esc(why)}</div></div>`;
  h += `<div class="grid g3" style="margin-bottom:18px">
    ${timed.length?leaderCard('Fastest timeline', timed[0], fmtDays(timed[0].timeline), 'Shortest statutory/prescribed process timeline on the official record.'):''}
    ${autod.length?leaderCard('Most digitised (excl. inspection)', autod[0], Math.round(autod[0]._autoShare*100)+'% of non-inspection steps online', 'Highest share of the recorded process running through a portal.'):''}
  </div>`;
  h += `<div class="card"><div class="card-h"><h3>Specific practices worth replicating</h3><span class="note">${practices.length} flagged</span></div><div class="card-b"><div class="grid g2">${practices.map(p=>`<div class="practice-card"><div class="pc-icon">${icon('award')}</div><div class="pc-b"><div class="pc-state" onclick="goState('${p.state}')">${esc(p.stateName)}</div><div class="pc-d">${esc(p.text)}</div></div></div>`).join('')}</div></div></div>`;
  return h;
}

function renderReconcile(){
  const items = AGG.inconsistencies;
  let h = `<div class="pagehead"><div><h2>${icon('scale')}Official record vs. lived experience</h2><div class="lede">Every <code>INCONSISTENT</code> flag raised while tagging the record — genuine disagreements between ED, FGD and/or secondary research, both sides stated.</div></div></div>`;
  h += `<div class="grid g4" style="margin-bottom:16px">
    ${kpiIcon('acc-primary','user','States with ED + FGD', STATES.filter(s=>!s.fgdPending).length+' of 11','')}
    ${kpiIcon('acc-danger','alert','Inconsistencies logged', String(items.length), 'across ED, FGD and secondary research')}
    ${kpiIcon('acc-success','check','States with zero logged', String(STATES.filter(s=>!s.gaps.some(g=>g.flag==='INCONSISTENT')).length), '')}
    ${kpiIcon('acc-warn','dash','FGD still pending', STATES.filter(s=>s.fgdPending).length+' of 11', '')}
  </div>`;
  h += `<div class="card"><div class="card-h"><h3>Logged inconsistencies, by State</h3></div><div class="card-b">`+
    (items.length ? items.map(g=>gapItem(g,true)).join('') : '<div class="empty"><b>None logged</b></div>')+
    '</div></div>';
  return h;
}

function renderGaps(){
  const resolved = AGG.secondaryResolved, open = AGG.secondaryOpen, missing = AGG.missing, vague = AGG.vague;
  const resPct = Math.round(resolved.length/(resolved.length+open.length)*100);
  let h = `<div class="pagehead"><div><h2>${icon('flask')}Closing the gap — what secondary research actually did</h2>
    <div class="lede">ED and FGD alone leave real gaps — facts never stated, vague phrasing, numbers that don't add up. This is where an independent, web-sourced verification pass either closed those gaps or honestly couldn't.</div></div></div>`;

  h += `<div class="grid g4" style="margin-bottom:16px">
    ${kpiIcon('acc-success','check','Resolved by secondary research', String(resolved.length), resPct+'% of researchable gaps')}
    ${kpiIcon('acc-warn','flask','Still open after research', String(open.length), 'honestly flagged, not guessed')}
    ${kpiIcon('acc-danger','dash','Missing entirely', String(missing.length), 'no source states this fact')}
    ${kpiIcon('acc-warn','alert','Vague / unmeasurable', String(vague.length), 'stated but not usable as data')}
  </div>`;

  h += `<div class="card" style="margin-bottom:16px"><div class="card-b"><div style="font-size:11.5px;color:var(--muted);margin-bottom:8px;font-weight:700">Resolution rate across all researchable gaps</div>
    <div class="resbar"><div class="seg" style="width:${resPct}%;background:var(--success)"></div><div class="seg" style="width:${100-resPct}%;background:var(--warning-light)"></div></div>
    <div class="hint">${resolved.length} resolved · ${open.length} still open — secondary research is a real verification pass, not a rubber stamp.</div></div></div>`;

  h += `<div class="grid g2" style="margin-bottom:16px;align-items:start">
    <div class="card"><div class="card-h"><h3>${icon('check')}Resolved — secondary research filled or confirmed the gap</h3></div><div class="card-b scroll-y" style="max-height:520px">${resolved.map(g=>gapItem(g,true)).join('')||'<div class="hint">None.</div>'}</div></div>
    <div class="card"><div class="card-h"><h3>${icon('flask')}Still open — web research could not resolve this</h3></div><div class="card-b scroll-y" style="max-height:520px">${open.map(g=>gapItem(g,true)).join('')||'<div class="hint">None.</div>'}</div></div>
  </div>`;

  h += `<div class="grid g2" style="align-items:start">
    <div class="card"><div class="card-h"><h3>${icon('dash')}Missing entirely</h3></div><div class="card-b scroll-y" style="max-height:420px">${missing.map(g=>gapItem(g,true)).join('')||'<div class="hint">None.</div>'}</div></div>
    <div class="card"><div class="card-h"><h3>${icon('alert')}Vague / unmeasurable</h3></div><div class="card-b scroll-y" style="max-height:420px">${vague.map(g=>gapItem(g,true)).join('')||'<div class="hint">None.</div>'}</div></div>
  </div>`;

  return h;
}

function renderMethod(){
  let h = `<div class="pagehead"><div><h2>${icon('book')}Method &amp; data quality</h2><div class="lede">What this dashboard is built from, how findings are tagged, and what is honestly not yet known.</div></div></div>`;

  h += `<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Where this pilot sits in the CoR project</h3></div><div class="card-b" style="font-size:12.5px;color:var(--muted);line-height:1.7">
    <p>The CoR project runs in four stages: <b style="color:var(--ink)">Stage 1</b> — field survey, Expert Discussion (ED, government officials) and Focused Group Discussion (FGD, business owners); <b style="color:var(--ink)">Stage 2</b> — structuring the ED/FGD record; <b style="color:var(--ink)">Stage 3</b> — independent secondary (web) research against each State's own rules, notifications and portals; <b style="color:var(--ink)">Stage 4</b> — presenting the combined findings (this dashboard).</p>
    <p>ED and FGD are treated as the authoritative baseline — secondary research verifies and extends them, and disagreements are always surfaced, never silently resolved by assumption.</p>
  </div></div>`;

  h += `<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Tagging taxonomy</h3></div><div class="card-b" style="font-size:12.5px;color:var(--muted);line-height:1.7">
    <p>Every finding has a <b>category</b> (pain / policy / procedural / redundant / delay / suggestions / remarks), 0 or more <b>topic tags</b> (e.g. PORTAL, CONSULT, FEES, TIMELINE, INTERDEP), and a <b>sentiment</b> (issue / neutral / positive / suggestion) — so findings can be filtered and compared, not just read as prose.</p>
    <p>Every State also carries explicit <b>gap flags</b>: <code>MISSING</code> (a fact no source states), <code>VAGUE</code> (stated but not measurable), <code>INCONSISTENT</code> (sources genuinely disagree, both sides quoted), <code>GOOD_PRACTICE</code> and <code>REFORM</code> (worth replicating or acting on), and — our own addition beyond the internal reference prototype this format is aligned with — <code>SECONDARY_RESOLVED</code> / <code>SECONDARY_OPEN</code>, tracking specifically whether independent web research closed a gap ED and FGD alone left open.</p>
  </div></div>`;

  h += `<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Format — why a single file</h3></div><div class="card-b" style="font-size:12.5px;color:var(--muted);line-height:1.7">
    <p>This is one self-contained HTML file — all ${AGG.totalFindings} findings, ${AGG.totalQuotes} quotes and ${AGG.totalGaps} gap flags are embedded directly in it. No server, no database, no login: open it in a browser, email it, or host it anywhere as a static file. A separate Node/Express + Postgres web app (with an admin-triggered live secondary-research pipeline and a persistent research log) also exists in this same repository for later, if an always-on, continuously-refreshed version is ever wanted — but it is not the primary deliverable right now.</p>
  </div></div>`;

  h += `<div class="card"><div class="card-h"><h3>Source documents &amp; coverage</h3></div><div class="card-b tight"><table class="dt"><thead><tr><th>State / UT</th><th>Expert Discussion</th><th>FGD</th><th>Findings tagged</th><th>Gaps logged</th></tr></thead><tbody>`+
    STATES.map(s=>`<tr><td class="state-link" onclick="goState('${s.code}')">${esc(s.name)}</td><td>${esc(s.ed.date||'')} · ${esc(s.ed.location||'')}</td><td>${s.fgdPending?'<span class="tag t-mute">Not yet conducted</span>':'<span class="tag t-ok">'+s.quotes.length+' quotes</span>'}</td><td class="n">${s.findings.length}</td><td class="n">${s.gaps.length}</td></tr>`).join('')+
    '</tbody></table></div></div>';

  h += `<div class="hint" style="margin-top:14px">Generated ${esc(DATA.meta.generated)}. Pilot: ${esc(DATA.meta.license)}. ${esc(DATA.meta.scope)}.</div>`;
  return h;
}

/* ========================= ROUTER / INIT ========================= */

function render(){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('on', b.dataset.view===F.view));
  buildFilters();
  const c = document.getElementById('canvas');
  if(F.view==='overview') c.innerHTML = renderOverview();
  else if(F.view==='state') c.innerHTML = renderState();
  else if(F.view==='compare') c.innerHTML = renderCompare();
  else if(F.view==='phase') c.innerHTML = renderPhase();
  else if(F.view==='best') c.innerHTML = renderBest();
  else if(F.view==='reconcile') c.innerHTML = renderReconcile();
  else if(F.view==='gaps') c.innerHTML = renderGaps();
  else if(F.view==='method') c.innerHTML = renderMethod();
  window.scrollTo(0,0);
  animateBars();
}

function init(){
  buildNav();
  F.state = STATES[0]?.code;
  F.cmp = [STATES[0]?.code, STATES[1]?.code].filter(Boolean);
  document.getElementById('downloadBtn').onclick = ()=>window.print();
  document.getElementById('globalSearch').addEventListener('input', e=>{
    F.search = e.target.value.trim().toLowerCase();
    if(F.view==='overview') render();
  });
  document.getElementById('globalSearch').addEventListener('keydown', e=>{
    if(e.key==='Enter'){
      const match = STATES.find(s=>s.name.toLowerCase().includes(e.target.value.trim().toLowerCase()));
      if(match) goState(match.code);
    }
  });
  render();
}
window.goView = goView; window.goState = goState; window.toggleCmp = toggleCmp; window.sortBy = sortBy; window.setFindSrc = setFindSrc;
init();
</script>
</body>
</html>
