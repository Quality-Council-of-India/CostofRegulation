<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cost of Regulation | QCI · DPIIT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@500;600;700&display=swap');

:root{
  --primary:#4F46E5; --primary-dark:#4338CA; --primary-light:#EEF2FF;
  --accent:#F59E0B; --accent-light:#FEF3C7;
  --ink:#0F172A; --body:#334155; --muted:#64748B; --faint:#94A3B8;
  --bg:#F3F4F8; --card:#FFFFFF; --border:#E2E8F0; --border-2:#EDF0F5;
  --success:#059669; --success-light:#D1FAE5;
  --warning:#D97706; --warning-light:#FEF3C7;
  --danger:#DC2626; --danger-light:#FEE2E2;
  --info:#2563EB; --info-light:#DBEAFE;
  --violet:#7C3AED; --violet-light:#EDE9FE;
  --r:14px; --r-sm:9px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow:0 2px 8px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 12px 32px rgba(15,23,42,.12), 0 2px 6px rgba(15,23,42,.06);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --display:'Lexend','Inter',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--body);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,select,input{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
svg.ic{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
::selection{background:var(--primary-light);color:var(--primary-dark)}

.shell{display:flex;min-height:100vh;align-items:stretch}
.rail{width:256px;flex:0 0 256px;background:linear-gradient(180deg,#131B3D,#0B1230);color:#CBD3F0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.rail-brand{padding:22px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.rail-brand .eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8C96C9;font-weight:700}
.rail-brand h1{font-family:var(--display);font-size:19px;line-height:1.2;margin:8px 0 4px;color:#fff;font-weight:700;letter-spacing:-.01em}
.rail-brand .sub{font-size:11.5px;color:#99A2CE}
.svcpick{margin-top:13px;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:8px 10px}
.svcpick label{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#8C96C9;font-weight:700;display:block;margin-bottom:3px}
.svcpick select{background:transparent;border:0;color:#fff;font-weight:600;font-size:12px;width:100%;outline:none}
.svcpick select option{color:#0F172A}
.rail-nav{padding:14px 10px;display:flex;flex-direction:column;gap:3px}
.navbtn{display:flex;gap:11px;align-items:flex-start;text-align:left;background:transparent;border:0;color:#B6BFE8;padding:10px 11px;border-radius:10px;cursor:pointer;width:100%;transition:background .15s, transform .15s}
.navbtn:hover{background:rgba(255,255,255,.07);transform:translateX(2px)}
.navbtn.on{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.45)}
.navbtn svg.ic{margin-top:1px;color:#808BC4;flex:0 0 auto}
.navbtn.on svg.ic{color:#fff}
.navbtn .t{font-weight:700;font-size:13px;display:block}
.navbtn .d{font-size:10.5px;opacity:.78;font-weight:400;display:block;margin-top:2px;line-height:1.35}
.rail-foot{margin-top:auto;padding:14px 18px 20px;font-size:10.5px;color:#8C96C9;line-height:1.6}
.rail-foot b{color:#C3CAEE;font-weight:700}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:12px 26px;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar-filters{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;flex:1}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fld select,.fld input{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 11px;min-width:190px;max-width:300px;height:36px;outline:none;font-size:13px;transition:border-color .15s, box-shadow .15s}
.fld select:focus,.fld input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.topbar-actions{display:flex;gap:10px;align-items:center}
.search{border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 14px;height:36px;width:200px;outline:none;font-size:12.5px;transition:all .15s}
.search:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);width:260px}
.btn{border:1px solid var(--border);background:#fff;border-radius:9px;height:36px;padding:0 14px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.btn:hover{background:var(--bg);border-color:var(--faint);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(79,70,229,.3)}
.btn.sm{height:30px;padding:0 11px;font-size:11.5px}

.canvas{padding:26px 30px 80px;flex:1;max-width:1440px;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.pagehead h2{font-family:var(--display);font-weight:700;font-size:26px;margin:0;line-height:1.2;display:flex;align-items:center;gap:11px;color:var(--ink);letter-spacing:-.01em}
.pagehead h2 svg.ic{width:24px;height:24px;color:var(--primary)}
.pagehead .lede{color:var(--muted);font-size:13px;margin-top:6px;max-width:820px;line-height:1.6}
.stamp{font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;border:1px solid var(--border);border-radius:999px;padding:6px 12px;color:var(--muted);background:#fff;white-space:nowrap}
.stamp.live{border-color:var(--success);color:var(--success);background:var(--success-light)}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .2s}
.card.hoverable:hover{box-shadow:var(--shadow-lg)}
.card-h{padding:14px 18px 12px;border-bottom:1px solid var(--border-2);display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:13.5px;font-weight:700;letter-spacing:-.005em;display:flex;align-items:center;gap:8px;color:var(--ink)}
.card-h .note{font-size:11px;color:var(--faint)}
.card-b{padding:17px 18px}
.card-b.tight{padding:10px 12px 12px}

.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px;transition:transform .18s, box-shadow .18s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between}
.kpi .k-l{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .k-v{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.05;color:var(--ink)}
.kpi .k-s{font-size:11.5px;color:var(--muted);line-height:1.4}
.kpi.acc-success .k-v{color:var(--success)} .kpi.acc-warn .k-v{color:var(--warning)}
.kpi.acc-danger .k-v{color:var(--danger)} .kpi.acc-primary .k-v{color:var(--primary)} .kpi.acc-violet .k-v{color:var(--violet)}
.kpi .k-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.kpi.acc-success .k-icon{background:var(--success-light);color:var(--success)}
.kpi.acc-warn .k-icon{background:var(--warning-light);color:var(--warning)}
.kpi.acc-danger .k-icon{background:var(--danger-light);color:var(--danger)}
.kpi.acc-primary .k-icon{background:var(--primary-light);color:var(--primary)}
.kpi.acc-violet .k-icon{background:var(--violet-light);color:var(--violet)}

table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
table.dt th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--card);cursor:pointer;user-select:none}
table.dt th:hover{color:var(--primary)}
table.dt th .sort-arrow{opacity:.4;margin-left:3px}
table.dt td{padding:11px 12px;border-bottom:1px solid var(--border-2);vertical-align:top}
table.dt tbody tr{transition:background .12s}
table.dt tbody tr:hover{background:var(--primary-light)}
table.dt td.n,table.dt th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll-y{max-height:560px;overflow:auto}
.state-link{font-weight:700;cursor:pointer;color:var(--ink)}
.state-link:hover{color:var(--primary)}
.state-link small{display:block;font-weight:400;color:var(--faint);font-size:10.5px;margin-top:1px}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.badge.b-online{background:var(--success-light);color:#065F46;border-color:#A7E8CB}
.badge.b-site{background:var(--info-light);color:#1E40AF;border-color:#BFD4F7}
.badge.b-mixed{background:var(--warning-light);color:#92400E;border-color:#F6D68B}
.badge.b-bad{background:var(--danger-light);color:#991B1B;border-color:#F3C2BE}
.badge.b-mute{background:var(--bg);color:var(--muted);border-color:var(--border)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}

.tag{display:inline-block;padding:4px 9px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.t-ok{background:var(--success-light);color:#065F46}
.t-warn{background:var(--warning-light);color:#92400E}
.t-bad{background:var(--danger-light);color:#991B1B}
.t-mute{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.t-info{background:var(--info-light);color:#1E40AF}

.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:168px 1fr 70px;gap:11px;align-items:center;font-size:12px}
.hbar .hb-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;cursor:pointer}
.hbar .hb-n:hover{color:var(--primary)}
.hbar .hb-track{height:10px;background:var(--border-2);border-radius:6px;overflow:hidden}
.hbar .hb-fill{height:100%;border-radius:6px;width:0;transition:width 1s cubic-bezier(.22,1,.36,1)}
.hbar .hb-v{font-family:var(--mono);text-align:right;font-weight:700;font-size:11.5px}

.stepper{display:flex;flex-direction:column}
.step-v{display:grid;grid-template-columns:40px 1fr;column-gap:15px}
.step-v .rail-col{display:flex;flex-direction:column;align-items:center}
.step-v .dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto;border:2px solid transparent;transition:transform .15s}
.step-v .dot.online{background:linear-gradient(135deg,var(--success),#047857);color:#fff}
.step-v .dot.site{background:var(--info-light);color:var(--info);border-color:#BFD4F7}
.step-v .dot.mixed{background:var(--warning-light);color:var(--warning);border-color:#F6D68B}
.step-v .dot.unclear{background:var(--bg);color:var(--muted);border-color:var(--border)}
.step-v .line{width:2px;flex:1;background:var(--border);min-height:20px}
.step-v:last-child .line{display:none}
.step-v .body{padding:3px 0 24px}
.step-v:hover .dot{transform:scale(1.08)}
.step-v .sp{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:3px}
.step-v .st{font-weight:700;font-size:13.5px;line-height:1.4;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink)}
.step-v .sd{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.step-docs{margin-top:8px;padding:10px 12px;background:var(--bg);border-radius:8px;font-size:11.5px}
.step-docs b{color:var(--ink);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.step-docs ul{margin:5px 0 0;padding-left:16px;color:var(--body)}
.step-docs .step-portal{margin-top:8px}

.gap-note{border:1px dashed var(--faint);background:#fff;border-radius:10px;padding:11px 13px;font-size:11.5px;color:var(--muted);line-height:1.55}
.banner{border:1px solid var(--warning);background:var(--warning-light);color:#78350F;border-radius:10px;padding:12px 15px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
.banner.info{border-color:#93C5FD;background:var(--info-light);color:#1E3A8A}
.banner.good{border-color:#A7E8CB;background:var(--success-light);color:#065F46}
.banner svg.ic{margin-top:2px;flex:0 0 auto}

.empty{padding:34px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;font-size:15px;color:var(--ink);margin-bottom:5px;font-family:var(--display);font-weight:700}
.hint{font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.5}

.statepick{display:flex;flex-wrap:wrap;gap:8px}
.statepick button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;color:var(--body);display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.statepick button:hover{border-color:var(--primary);color:var(--primary)}
.statepick button.on{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-color:transparent}
.statepick button .n{opacity:.6;font-weight:400;font-size:10.5px}

.leader-card{border:1px solid var(--border);border-radius:var(--r);padding:18px;background:linear-gradient(160deg,#fff,#FAFBFF);display:flex;flex-direction:column;gap:9px;transition:transform .18s, box-shadow .18s}
.leader-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.leader-card .lc-kpi{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.leader-card .lc-state{font-family:var(--display);font-size:19px;font-weight:700;color:var(--ink);cursor:pointer}
.leader-card .lc-state:hover{color:var(--primary)}
.leader-card .lc-metric{font-size:13px;font-weight:700;color:var(--success)}
.leader-card .lc-why{font-size:12px;color:var(--muted);line-height:1.5}
.medal{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#FFD873,#E8A93A);display:flex;align-items:center;justify-content:center;color:#5A3C00;flex:0 0 auto;box-shadow:0 2px 8px rgba(232,169,58,.4)}

.stagegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:1000px){.stagegrid{grid-template-columns:1fr}}
.stagecol{display:flex;flex-direction:column;gap:11px}
.stagecol-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:10px;font-weight:700;font-size:12.5px}
.stagecol-h.online{background:var(--success-light);color:#065F46}
.stagecol-h.mixed{background:var(--warning-light);color:#92400E}
.stagecol-h.site{background:var(--info-light);color:#1E40AF}
.statecard-mini{border:1px solid var(--border);border-radius:12px;padding:13px 14px;background:#fff;cursor:pointer;transition:all .18s}
.statecard-mini:hover{border-color:var(--primary);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.statecard-mini .n{font-weight:700;font-size:13px;color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.statecard-mini .n .pos{font-size:10px;font-family:var(--mono);color:var(--faint);font-weight:400}
.statecard-mini .d{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.mini-pipe{display:flex;gap:3px;margin-top:9px;align-items:center}
.mini-pipe .md{width:7px;height:7px;border-radius:50%;background:var(--border)}
.mini-pipe .md.on{background:var(--success)}
.mini-pipe .md.site{background:var(--info)}
.mini-pipe .md.mixed{background:var(--warning)}
.mini-pipe .md.focus{width:11px;height:11px;outline:2px solid var(--ink);outline-offset:1px}
.statecard-mini .meta-row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.chip-sm{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.chip-sm.link{color:var(--primary);cursor:pointer}
.chip-sm.link:hover{text-decoration:underline}

.cmp-col{border:1px solid var(--border);border-radius:var(--r);background:#fff;overflow:hidden;box-shadow:var(--shadow)}
.cmp-col .cc-h{background:linear-gradient(135deg,#1E293B,#0F172A);color:#fff;padding:14px 16px}
.cmp-col .cc-h .n{font-family:var(--display);font-size:17px;font-weight:700}
.cmp-col .cc-h .s{font-size:10.5px;color:#93A7BF;margin-top:2px}
.cmp-row{padding:11px 16px;border-bottom:1px solid var(--border-2);font-size:12.5px}
.cmp-row .l{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}

.finding{border-left:3px solid var(--faint);padding:9px 13px;margin-bottom:8px;background:#fff;border:1px solid var(--border-2);border-left-width:3px;border-radius:0 10px 10px 0;font-size:12.5px;line-height:1.5}
.finding:last-child{margin-bottom:0}
.finding.sent-issue{border-left-color:var(--danger)}
.finding.sent-positive{border-left-color:var(--success)}
.finding.sent-suggestion{border-left-color:var(--info)}
.finding.sent-neutral{border-left-color:var(--faint)}
.finding .fmeta{display:flex;gap:6px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.fcat{font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--muted)}
.ftag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.ftag.src-ed{background:#1E293B;color:#fff;border-color:transparent}
.ftag.src-fgd{background:var(--violet-light);color:#5B21B6;border-color:transparent}
.finding .ftext{color:var(--body)}

.quote-card{background:linear-gradient(160deg,#fff,#FAFBFF);border:1px solid var(--border);border-radius:14px;padding:16px 18px;position:relative;height:100%}
.quote-card .qmark{font-family:var(--display,inherit);font-size:38px;color:var(--border-2);position:absolute;top:2px;left:12px;line-height:1}
.quote-card .qtext{font-style:italic;font-size:13.5px;color:var(--ink);padding-left:16px;line-height:1.5;position:relative}
.quote-card .qmeta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--border-2);font-size:10.5px;color:var(--faint)}
.quote-card .qtopic{font-weight:700;color:var(--muted)}
.quotegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}

.gapbadge{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;padding:4px 10px;border-radius:999px;border:1px solid;letter-spacing:.02em;white-space:nowrap}
.gapbadge.gf-MISSING{background:var(--bg);color:var(--muted);border-color:var(--border)}
.gapbadge.gf-VAGUE{background:var(--warning-light);color:#92400E;border-color:#F6D68B}
.gapbadge.gf-INCONSISTENT{background:var(--danger-light);color:#991B1B;border-color:#F3C2BE}
.gapbadge.gf-GOOD_PRACTICE{background:var(--violet-light);color:#5B21B6;border-color:#D8CCFA}
.gapbadge.gf-REFORM{background:var(--info-light);color:#1E40AF;border-color:#BFD4F7}

.gap-item{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:9px;background:#fff}
.gap-item:last-child{margin-bottom:0}
.gap-item .gi-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gap-item .gi-state{font-weight:700;font-size:12px;color:var(--ink);cursor:pointer}

.tabset{display:flex;gap:6px;margin-bottom:13px;flex-wrap:wrap}
.tabbtn{border:1px solid var(--border);background:#fff;border-radius:999px;padding:7px 14px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--muted);transition:all .15s}

.startgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:18px}

/* ---------- source lane badges + verification markers ---------- */
.ftag.src-secondary{background:var(--success-light);color:#065F46;border-color:transparent}
.vmark{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.vmark.v-confirmed{background:var(--success-light);color:#065F46;border-color:#A7E8CB}

.vdet{border:1px solid var(--border);border-radius:10px;background:#fff;margin-bottom:8px;overflow:hidden}

.vdet summary::-webkit-details-marker{display:none}

.vdet .vk{font-size:12.5px;font-weight:800;color:var(--ink);min-width:132px}
.vdet .vg{font-size:12px;color:var(--muted);flex:1;min-width:190px}
.vdet .vmore{font-size:10px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.06em}

/* ---------- step-equivalence visuals ---------- */
.eqbars{display:flex;flex-direction:column;gap:9px}
.eqrow{display:grid;grid-template-columns:168px 1fr 118px;gap:12px;align-items:center}
.eqrow .nm{font-size:12.5px;font-weight:700;color:var(--ink);text-align:right;cursor:pointer}
.eqrow .nm:hover{color:var(--primary)}
.eqtrack{display:flex;flex-direction:column;gap:3px}
.eqbar{height:17px;border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:10px;font-weight:800;color:#fff;white-space:nowrap;min-width:62px}
.eqbar.raw{background:#94A3B8}
.eqbar.cmp{background:var(--primary)}
.eqrow .vs{font-size:11.5px;color:var(--muted);font-weight:600}
.eqrow .vs b{color:var(--ink)}
.eqgrid{border-collapse:collapse;width:100%;font-size:11px}
.eqgrid th,.eqgrid td{border:1px solid var(--border-2);padding:0}
.eqgrid thead th{background:var(--bg);padding:7px 5px;font-size:9.5px;font-weight:800;color:var(--muted);text-align:center;writing-mode:vertical-rl;transform:rotate(180deg);height:118px;white-space:nowrap}
.eqgrid thead th.corner{writing-mode:horizontal-tb;transform:none;text-align:left;padding:7px 11px;width:300px;min-width:300px;height:auto;vertical-align:bottom}
.eqgrid td.sub{text-align:left;padding:8px 11px;font-weight:700;color:var(--ink);font-size:11px;line-height:1.45;background:#fff;width:300px;min-width:300px;white-space:normal}

.eqgrid td.c.n0{background:#fff;color:var(--border-2)}
.eqgrid td.c.n1{background:var(--primary-light);color:var(--primary-dark)}
.eqgrid td.c.n2{background:#A5B4FC;color:#1E1B4B}
.eqgrid td.c.n3{background:var(--primary);color:#fff}
.eqlegend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:11px;color:var(--muted)}
.eqlegend .sw{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--border-2)}

/* ---------- aligned stage comparison table ---------- */
.aligncmp{border-collapse:collapse;width:100%;table-layout:fixed}
.aligncmp th,.aligncmp td{border:1px solid var(--border-2);vertical-align:top;padding:0}
.aligncmp thead th{position:sticky;top:0;background:#fff;z-index:2;padding:10px 12px;text-align:left;font-size:11.5px;font-weight:800;color:var(--ink)}
.aligncmp thead th.stagecol-h{background:var(--bg);width:150px}
.aligncmp tbody th{background:var(--bg);text-align:left;padding:10px 12px;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;width:150px;vertical-align:middle}
.aligncmp td.alcell{padding:9px 11px}
.alcell .alstep{display:flex;align-items:flex-start;gap:6px;margin-bottom:6px;font-size:12px;color:var(--body);line-height:1.35}
.alcell .alstep:last-child{margin-bottom:0}
.alcell .alstep .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;margin-top:4px}
.alcell .alstep .d.online{background:var(--success)}
.alcell .alstep .d.mixed{background:var(--warning)}
.alcell .alstep .d.site{background:var(--info)}
.alcell .alstep .d.unclear{background:var(--border-2)}
.alcell .alstep.low{opacity:.6}
.alcell .alnone{color:var(--faint);font-size:11.5px;font-style:italic}
.aligncmp tbody tr:nth-child(odd) td.alcell{background:#FBFBFD}

/* ---------- coverage matrix ---------- */
.covwrap{overflow:auto;border:1px solid var(--border);border-radius:var(--r);background:#fff}
table.covgrid{border-collapse:collapse;font-size:10.5px;white-space:nowrap}
table.covgrid th,table.covgrid td{border:1px solid var(--border-2);padding:0;text-align:center}
table.covgrid th.corner{position:sticky;left:0;top:0;z-index:3;background:#fff}
table.covgrid th.svccol{position:sticky;top:0;z-index:2;background:#fff;padding:6px 4px;font-weight:700;color:var(--muted);min-width:34px;max-width:34px;font-size:9.5px}
table.covgrid td.statecol{position:sticky;left:0;z-index:1;background:#fff;text-align:left;padding:5px 10px;font-weight:700;color:var(--ink);cursor:default;font-size:11px;min-width:190px}
table.covgrid td.cell{width:34px;height:26px;cursor:pointer;transition:transform .1s}
table.covgrid td.cell.has{background:var(--primary-light);color:var(--primary-dark);font-weight:800}
table.covgrid td.cell.has:hover{background:var(--primary);color:#fff;transform:scale(1.15)}
table.covgrid td.cell.empty{background:var(--bg);color:transparent}
.covlegend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.covlegend .sw{width:14px;height:14px;border-radius:4px;display:inline-block;vertical-align:middle;margin-right:5px}

@media (max-width:1180px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g5{grid-template-columns:repeat(2,minmax(0,1fr))} .g23,.g3{grid-template-columns:minmax(0,1fr)} .stagegrid{grid-template-columns:1fr} }
@media (max-width:860px){
  .shell{flex-direction:column} .rail{width:100%;flex:none;height:auto;position:static;flex-direction:column}
  .rail-nav{flex-direction:row;flex-wrap:wrap} .navbtn{width:auto;flex:1 1 44%} .rail-foot{display:none}
  .g2{grid-template-columns:minmax(0,1fr)} .canvas{padding:16px 14px 50px} .topbar{padding:10px 14px}
  .search{width:140px}
  .fld select,.fld input{min-width:140px;max-width:100%}
}
@media print{
  .rail,.topbar,.btn,.statepick{display:none !important}
  body{background:#fff} .canvas{padding:0;max-width:none}
  .card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}
  .scroll-y{max-height:none !important;overflow:visible !important}
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

      </div>

      <div class="loading">Loading…</div>

</div>

<script>
const DATA = /*__DATA__*/;
</script>
<script>
/* ==========================================================================
   COST OF REGULATION — ALL LICENSES, ALL STATES (ED-ONLY PASS)
   Single-file edition. All data is embedded above (DATA). No network calls.
   ========================================================================== */

const ICONS = {
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>',
  columns:'<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="9.5" y="4" width="5" height="16" rx="1"/><rect x="16" y="4" width="5" height="16" rx="1"/>',
  layers:'<path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>',
  award:'<circle cx="12" cy="8" r="5.2"/><path d="M8.3 12.8 6.5 21l5.5-3 5.5 3-1.8-8.2"/>',
  scale:'<path d="M12 3v17"/><path d="M6 7h6M12 7h6"/><path d="M3 7l2.6 6.2a2.6 2.6 0 0 0 5.2 0L8 7"/><path d="M16 7l2.6 6.2a2.6 2.6 0 0 0 5.2 0L21 7"/><path d="M7 20h10"/>',
  book:'<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H11v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M20 4.5A2.5 2.5 0 0 0 17.5 2H13v17h4.5A2.5 2.5 0 0 1 20 21.5z"/>',
  flask:'<path d="M9 2v6.5L4 18a2 2 0 0 0 1.8 3h12.4a2 2 0 0 0 1.8-3L15 8.5V2"/><path d="M8.5 2h7"/><path d="M7 15h10"/>',
  check:'<circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.3l3 3 6-6.6"/>',
  pin:'<path d="M12 21.5s7.2-7.6 7.2-12.3A7.2 7.2 0 0 0 4.8 9.2c0 4.7 7.2 12.3 7.2 12.3z"/><circle cx="12" cy="9" r="2.6"/>',
  alert:'<path d="M12 3 2.2 20h19.6z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.3" r=".6" fill="currentColor"/>',
  dash:'<circle cx="12" cy="12" r="9.5" stroke-dasharray="2.5 3"/>',
  arrow:'<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>',
  link:'<path d="M9 15 15 9"/><path d="M10 6.5 11.5 5a4 4 0 0 1 5.7 5.7L15.5 12.2"/><path d="M14 17.5 12.5 19a4 4 0 0 1-5.7-5.7L8.5 11.8"/>',
  quote:'<path d="M7 7h4v6c0 3-2 5-5 5"/><path d="M15 7h4v6c0 3-2 5-5 5"/>'
};
function icon(name, cls){ return `<svg class="ic${cls?' '+cls:''}" viewBox="0 0 24 24">${ICONS[name]||''}</svg>`; }
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const SERVICES = DATA.services;
const SVC_BY_CODE = {}; SERVICES.forEach(sv=>SVC_BY_CODE[sv.code]=sv);
const STATE_UNIVERSE = DATA.stateUniverse;
const STATES = DATA.states.slice().sort((a,b)=>a.name.localeCompare(b.name));
const ST_BY_CODE = {}; STATES.forEach(s=>ST_BY_CODE[s.code]=s);
const PHASES = DATA.phases;
const STAGE_MAP = Object.fromEntries(PHASES.map(p=>[p.code,{k:p.code,n:p.label}]));
const STAGES = Object.values(STAGE_MAP);
const AGG = DATA.aggregates;
const STEP_EQUIV = DATA.stepEquivalence || {};
function subStageLabel(licenseCode, code){
  const d = STEP_EQUIV[licenseCode];
  const s = d && d.canonicalSubStages.find(x=>x.code===code);
  return s ? s.label : code;
}
const COVERAGE = DATA.coverage;

function licOf(stateCode, svcCode){
  const s = ST_BY_CODE[stateCode]; if(!s) return null;
  return s.licenses.find(l=>l.serviceCode===svcCode) || null;
}
function statesWithService(svcCode){
  return STATES.filter(s=>licOf(s.code, svcCode));
}

const CATEGORY_LABEL = {pain:'Pain point', policy:'Policy', procedural:'Procedure', redundant:'Redundancy', delay:'Delay', suggestions:'Suggestion', remarks:'Remark'};
const SENT_CLASS = {issue:'sent-issue', neutral:'sent-neutral', positive:'sent-positive', suggestion:'sent-suggestion'};
const SRC_LABEL = {ed:'ED', fgd:'FGD'};
const GAP_META = {
  MISSING:{label:'Missing', icon:'dash'}, VAGUE:{label:'Vague', icon:'alert'},
  INCONSISTENT:{label:'Inconsistent', icon:'scale'}, GOOD_PRACTICE:{label:'Good practice', icon:'award'},
  REFORM:{label:'Reform idea', icon:'arrow'}
};

const DEFAULT_SERVICE = SERVICES.find(s=>s.code==='FAL') ? 'FAL' : (SERVICES[0]?SERVICES[0].code:null);
const F = { view:'start', state:null, license:null, service:DEFAULT_SERVICE, cmp:[], search:'', sort:{col:null,dir:1}, bestSvc:'all', bestState:'all', gapsSvc:'all', painSvc:'all', painState:'all' };

/* ---------- formatting helpers ---------- */
const fmtDays = t => { if(!t || t.minDays==null) return 'Not specified'; if(t.minDays===t.maxDays) return t.minDays+' days'; return t.minDays+'–'+t.maxDays+' days'; };
function stepBadgeClass(step){
  if(step.automated===true) return 'online';
  if(step.automated==='partial') return 'mixed';
  if(step.automated===false) return step.phase==='inspect' ? 'site' : 'mixed';
  return 'unclear';
}
function stepBadgeLabel(step){
  if(step.automated===true) return 'Online';
  if(step.automated==='partial') return 'Partly online';
  if(step.automated===false) return step.phase==='inspect' ? 'On-site visit' : 'Manual';
  return 'Conditional';
}
function stepDot(step){ return `<div class="dot ${stepBadgeClass(step)}">${step.automated===true?icon('check'):(step.phase==='inspect'&&step.automated!==true)?icon('pin'):step.n}</div>`; }
function stepBadge(step){ const c=stepBadgeClass(step); return `<span class="badge b-${c==='online'?'online':c==='site'?'site':c==='mixed'?'mixed':'mute'}"><span class="dot"></span>${esc(stepBadgeLabel(step))}</span>`; }
function deemedBadge(d){
  if(!d) return `<span class="badge b-mute">${icon('dash')}Not confirmed</span>`;
  if(d.status==='yes') return `<span class="badge b-online">${icon('check')}Deemed approval: Yes${d.days?(' · '+d.days+' days'):''}</span>`;
  if(d.status==='no') return `<span class="badge b-bad">${icon('alert')}Deemed approval: No</span>`;
  return `<span class="badge b-mute">${icon('dash')}Not confirmed</span>`;
}
function autoLevelTag(lic){
  if(!lic || lic._autoShare==null) return '<span class="tag t-mute">Not scoreable</span>';
  const pct = Math.round(lic._autoShare*100);
  if(pct>=85) return `<span class="tag t-ok">${pct}% digitised</span>`;
  if(pct>=55) return `<span class="tag t-warn">${pct}% digitised</span>`;
  return `<span class="tag t-bad">${pct}% digitised</span>`;
}
function kpiIcon(cls,ic,l,v,s){ return `<div class="kpi ${cls}"><div class="k-top"><div class="k-l">${esc(l)}</div><div class="k-icon">${icon(ic)}</div></div><div class="k-v">${esc(v)}</div><div class="k-s">${esc(s)}</div></div>`; }
function hbars(items){
  const max = Math.max(1, ...items.map(i=>i.max||i.v||1));
  return '<div class="hbars">'+items.map((i)=>{
    const pct = i.v==null?0:Math.max(2, (i.v/max)*100);
    return `<div class="hbar"><div class="hb-n" ${i.code?`onclick="goState('${i.code}')"`:''}>${esc(i.n)}</div>`+
      `<div class="hb-track"><div class="hb-fill" data-w="${pct}" style="background:${i.col||'var(--primary)'}"></div></div>`+
      `<div class="hb-v">${esc(i.label)}</div></div>`;
  }).join('')+'</div>';
}
function animateBars(){
  document.querySelectorAll('.hb-fill[data-w]').forEach(el=>{ el.style.width = '0%'; });
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      document.querySelectorAll('.hb-fill[data-w]').forEach(el=>{ el.style.width = el.dataset.w + '%'; });
    });
  });
}
function portalLink(lic){
  if(!lic || !lic.portal) return '';
  if(!lic.portal.url) return `<span class="chip-sm" title="Portal name known from the Expert Discussion; URL not independently confirmed">${icon('pin')} ${esc(lic.portal.name||'Portal')}</span>`;
  return `<a class="chip-sm link" href="${esc(lic.portal.url)}" target="_blank" rel="noopener">${icon('link')} ${esc(lic.portal.name||'Portal')}</a>`;
}
function findingItem(f){
  return `<div class="finding ${SENT_CLASS[f.sentiment]||''}">
    <div class="fmeta">${f.source?`<span class="ftag src-${f.source}">${SRC_LABEL[f.source]||f.source}</span>`:''}<span class="fcat">${esc(CATEGORY_LABEL[f.category]||f.category)}</span>${(f.tags||[]).map(t=>`<span class="ftag">${esc(t)}</span>`).join('')}</div>
    <div class="ftext">${esc(f.text)}</div>
  </div>`;
}
function quoteCard(q){
  return `<div class="quote-card"><div class="qmark">&ldquo;</div><div class="qtext">${esc(q.quote)}</div>

/* ---- Third source lane: checking the field record against the published rules ---- */
const VERDICT_META = {
  confirmed:    {label:'Rules agree',        icon:'check', blurb:'the published rule says the same thing'},
  contradicted: {label:'Rules disagree',     icon:'alert', blurb:'the published rule says something different'},
  fills_gap:    {label:'Rules fill the gap', icon:'book',  blurb:'the field record never stated this; the rule does'},
  not_found:    {label:'Could not check',    icon:'dash',  blurb:'no official source addressing this point was reachable'}
};
const CHECK_LABEL = {timeline:'Timeline', fees:'Fees', deemedApproval:'Deemed approval', documents:'Documents required', steps:'Process & steps', validity:'License validity'};

function renderVerification(lic){
  if(!lic.secondary){
    return `<div class="howto" style="margin-bottom:16px"><b>Not yet checked against published rules.</b> This record rests on the field interviews alone — we have not verified it against an official published source. That is a gap, not a verdict: see Method &amp; sources for which States have been checked.</div>`;
  }
  const s = lic.secondary;
  const counts = {};
  s.checks.forEach(c=>{ counts[c.verdict]=(counts[c.verdict]||0)+1; });
  const order = ['contradicted','fills_gap','confirmed','not_found'];
  const SUMMARY_LABEL = {
    contradicted: n=>`${n} disagree${n===1?'s':''} with the rules`,
    fills_gap:    n=>`${n} gap${n===1?'':'s'} filled by the rules`,
    confirmed:    n=>`${n} confirmed by the rules`,
    not_found:    n=>`${n} could not be checked`
  };
  const summary = order.filter(v=>counts[v]).map(v=>`<span class="vmark v-${v}">${icon(VERDICT_META[v].icon)}${esc(SUMMARY_LABEL[v](counts[v]))}</span>`).join(' ');

  let h = `<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>${icon('scale')}Checked against the published rules</h3><span class="note">${s.checks.length} fact${s.checks.length===1?'':'s'} checked · ${(s.sourcesRead||[]).length} official source${(s.sourcesRead||[]).length===1?'':'s'} read</span></div><div class="card-b">
    <div class="howto"><b>How to read:</b> the field interviews are what officials and businesses told us. This card is a separate, independent check of those claims against the State's own published rules and notifications. Where they disagree, both versions are shown — we do not pick a winner.</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px">${summary}</div>`;

  s.checks.forEach(c=>{
    const m = VERDICT_META[c.verdict] || VERDICT_META.not_found;
    const gist = c.verdict==='not_found'
      ? 'No official source addressing this was reachable.'
      : (c.verdict==='fills_gap' ? 'The field record did not state this. The published rule does.' : m.blurb.charAt(0).toUpperCase()+m.blurb.slice(1)+'.');
    h += `<details class="vdet"><summary>
        <span class="vmark v-${c.verdict}">${icon(m.icon)}${esc(m.label)}</span>
        <span class="vk">${esc(CHECK_LABEL[c.key]||c.key)}</span>
        <span class="vg">${esc(gist)}</span>
        <span class="vmore">detail</span>
      </summary>
      <div class="vbody">
        <div class="gi-text"><b style="color:var(--ink)">What the field record says:</b> ${esc(c.primaryClaim||'—')}</div>
        ${c.sourceSays?`<div class="gi-text" style="margin-top:7px"><b style="color:var(--ink)">What the published rule says:</b> ${esc(c.sourceSays)}</div>`:''}
        ${c.citation?`<div style="margin-top:9px"><a class="chip-sm link" href="${esc(c.citation.url)}" target="_blank" rel="noopener">${icon('link')} ${esc((c.citation.title||c.citation.url).slice(0,95))}</a>${c.citation.transport==='http'?`<span class="ftag" style="margin-left:6px" title="Fetched over plain http — content is from the official host but the connection was not transport-authenticated">http only</span>`:''}</div>`:''}
      </div></details>`;
  });

  if(s.remarks && s.remarks.length){
    h += `<details class="vdet" style="margin-top:10px"><summary><span class="vmark v-not_found">${icon('alert')}Caveats</span><span class="vg">${s.remarks.length} note${s.remarks.length===1?'':'s'} a reviewer should read</span><span class="vmore">detail</span></summary>
      <div class="vbody"><ul style="margin:0;padding-left:17px">${s.remarks.map(r=>`<li style="font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:6px">${esc(r)}</li>`).join('')}</ul></div></details>`;
  }
  h += `</div></div>`;
  return h;
}

/* ---- Step equivalence: the "is a step the same everywhere?" page ---- */
function renderEquiv(){
  const svc = STEP_EQUIV[F.service] ? F.service : (STEP_EQUIV.FAL ? 'FAL' : null);
  let h = `<div class="crumb">Compare States · step equivalence</div>`;
  if(!svc){
    return h + `<div class="pagelede">Step equivalence has not been mapped for this license yet</div>
      <div class="pagesub">This analysis currently exists for Factory License only. Pick that license in the sidebar to see it.</div>`;
  }
  const d = STEP_EQUIV[svc];
  const codes = Object.keys(d.stateMappings);
  const rows = codes.map(c=>{
    const m = d.stateMappings[c];
    return {code:c, name:(ST_BY_CODE[c]?ST_BY_CODE[c].name:c), raw:m.rawStepCount, cmp:m.canonicalSubStageCount, hasED:m.hasED, diff:m.canonicalSubStageCount-m.rawStepCount};
  });
  const bundlers = rows.filter(r=>r.diff>0).sort((a,b)=>b.diff-a.diff);
  const splitters = rows.filter(r=>r.diff<0).sort((a,b)=>a.diff-b.diff);
  const maxv = Math.max(...rows.map(r=>Math.max(r.raw,r.cmp)));

  h += `<div class="pagelede">A "step" does not mean the same thing in every State — ${bundlers.length} of ${rows.length} States bundle several things into one step</div>
    <div class="pagesub">Counting steps is the most natural way to compare how heavy a process is. It is also misleading: one State may write "upload documents and pay the fee" as a single step where another writes three. This page recounts every State's process against one shared checklist of ${d.canonicalSubStages.length} things that actually have to happen, so the comparison is fair.</div>`;

  const topB = bundlers[0], topS = splitters[0];
  h += `<div class="takeaway"><div class="tk-h">What this shows</div><div class="tk-b"><ol>
    <li><b>${bundlers.length}</b> of ${rows.length} States describe fewer steps than they actually perform — their process looks leaner on paper than it is.</li>
    ${topB?`<li>The widest gap is <b>${esc(topB.name)}</b>: <b>${topB.raw}</b> steps on paper, but <b>${topB.cmp}</b> distinct things actually happen.</li>`:''}
    ${topS?`<li><b>${esc(topS.name)}</b> goes the other way — <b>${topS.raw}</b> listed steps covering only <b>${topS.cmp}</b> distinct stages, i.e. the same stage split across several steps.</li>`:''}
  </ol></div></div>`;

  h += `<div class="card" style="margin-bottom:18px"><div class="card-h"><h3>Steps on paper vs. things that actually happen</h3><span class="note">${esc(SVC_BY_CODE[svc]?SVC_BY_CODE[svc].name:svc)} · ${rows.length} States</span></div><div class="card-b">
    <div class="howto"><b>How to read:</b> the grey bar is how many steps the State's own record lists. The blue bar is how many distinct stages of the shared checklist it actually covers. Where blue is longer, the State is packing more than one thing into a step.</div>
    <div class="eqbars">`+
    rows.slice().sort((a,b)=>b.diff-a.diff || b.cmp-a.cmp).map(r=>`<div class="eqrow">
      <div class="nm" onclick="goStateService('${r.code}','${svc}')">${esc(r.name)}</div>
      <div class="eqtrack">
        <div class="eqbar raw" style="width:${Math.max(r.raw/maxv*100,7)}%">${r.raw} listed</div>
        <div class="eqbar cmp" style="width:${Math.max(r.cmp/maxv*100,7)}%">${r.cmp} actual</div>
      </div>
      <div class="vs">${r.cmp>r.raw?'<b>+'+(r.cmp-r.raw)+'</b> hidden':r.cmp<r.raw?'<b>'+(r.raw-r.cmp)+'</b> overlapping':'matches'}</div>
    </div>`).join('')+
    `</div></div></div>`;

  h += `<div class="card"><div class="card-h"><h3>Which States bundle, and which split</h3><span class="note">${d.canonicalSubStages.length} shared stages</span></div><div class="card-b" style="overflow-x:auto">
    <div class="howto"><b>How to read:</b> each row is one thing that has to happen to get the license. Each column is a State. The number is how many separate steps that State uses for it — <b>0</b> means that State never records it at all, <b>2</b> or <b>3</b> means it is split across multiple steps.</div>
    <table class="eqgrid"><thead><tr><th class="corner">What has to happen</th>`+
    codes.map(c=>`<th>${esc((ST_BY_CODE[c]?ST_BY_CODE[c].name:c).slice(0,22))}</th>`).join('')+
    `</tr></thead><tbody>`+
    d.canonicalSubStages.map(ss=>{
      return `<tr><td class="sub">${esc(ss.label)}</td>`+
        codes.map(c=>{
          const m = d.stateMappings[c];
          const n = m.mappings.filter(x=>x.subStages.includes(ss.code)).length;
          return `<td class="c n${Math.min(n,3)}" title="${esc(ST_BY_CODE[c]?ST_BY_CODE[c].name:c)} — ${n} step${n===1?'':'s'}">${n||'·'}</td>`;
        }).join('')+'</tr>';
    }).join('')+
    `</tbody></table>
    <div class="eqlegend"><span><span class="sw" style="background:#fff"></span>Never recorded</span><span><span class="sw" style="background:var(--primary-light)"></span>One step</span><span><span class="sw" style="background:#A5B4FC"></span>Two steps</span><span><span class="sw" style="background:var(--primary)"></span>Three or more</span></div>
    </div></div>`;
  return h;
}

      <div><div style="font-weight:700;font-size:12px;margin-bottom:9px">Timeline, by State</div>
      ${hbars(svcStates.map(({s,lic})=>({n:s.name+' ('+s.code+')', code:s.code, v:lic._timeMid, max:65, label: lic._timeMid!=null?fmtDays(lic.timeline):'not specified', col: lic._timeMid==null?'#C3CBD4':(lic._timeMid<=15?'var(--success)':lic._timeMid<=35?'var(--warning)':'var(--danger)')})))}
      </div>
      <div><div style="font-weight:700;font-size:12px;margin-bottom:9px">Digitisation (excl. inspection)</div>
      ${hbars(svcStates.map(({s,lic})=>({n:s.name+' ('+s.code+')', code:s.code, v:lic._autoShare==null?0:Math.round(lic._autoShare*100), max:100, label:lic._autoShare==null?'n/a':Math.round(lic._autoShare*100)+'%', col:'var(--primary)'})))}
      </div>
    </div>`;
  }
  h += '</div></div>';

  const filtered = q ? STATE_UNIVERSE.filter(s=>s.name.toLowerCase().includes(q)) : STATE_UNIVERSE;
  h += `<div class="card"><div class="card-h"><h3>Every State / UT</h3><span class="note">click a row for its full multi-license profile</span></div><div class="card-b tight"><div class="scroll-y"><table class="dt"><thead><tr><th>State / UT</th><th class="n">Licenses on file</th><th class="n">Findings</th><th class="n">Gaps</th></tr></thead><tbody>`+
    filtered.map(su=>{
      const s = ST_BY_CODE[su.code];
      const lics = s ? s.licenses.length : 0;
      const findings = s ? s.licenses.reduce((a,l)=>a+l.findings.length,0) : 0;
      const gaps = s ? s.licenses.reduce((a,l)=>a+l.gaps.length,0) : 0;
      return `<tr><td ${s?`class="state-link" onclick="goState('${su.code}')"`:''}>${esc(su.name)}${!s?' <span class=\"tag t-mute\">no ED or FGD yet</span>':''}</td><td class="n">${lics}</td><td class="n">${findings}</td><td class="n">${gaps}</td></tr>`;
    }).join('')+
    '</tbody></table></div></div></div>';

  return h;
}

function renderState(){
  const s = ST_BY_CODE[F.state];
  if(!s) return '<div class="empty"><b>Pick a State</b></div>';
  if(!F.license || !licOf(s.code, F.license)) F.license = s.licenses[0] ? s.licenses[0].serviceCode : null;
  const lic = licOf(s.code, F.license);

  let h = `<div class="pagehead"><div><h2>${icon('user')}${esc(s.name)}</h2>
    <div class="lede">${s.licenses.length} license${s.licenses.length===1?'':'s'} on file from a completed Expert Discussion and/or Focused Group Discussion.</div></div>
    <span class="stamp live">${AGG.totalStates} States in dataset</span></div>`;

  h += `<div class="tabset">`+
    s.licenses.map(l=>`<button class="tabbtn ${F.license===l.serviceCode?'on':''}" onclick="setLicense('${l.serviceCode}')">${esc(l.serviceName)}<span class="n">${l.findings.length}</span></button>`).join('')+
    '</div>';

  if(!lic) return h + '<div class="empty"><b>No license selected</b></div>';

  h += `<div class="lede" style="margin:-6px 0 10px">${esc(lic.issuingAuthority||'')}${lic.ed&&lic.ed.expert?' · '+esc(lic.ed.expert)+(lic.ed.designation?', '+esc(lic.ed.designation):''):''} ${portalLink(lic)}</div>`;
  h += `<div style="margin:0 0 16px;display:flex;gap:6px;flex-wrap:wrap">
    <span class="ftag src-ed" style="${lic.hasED===false?'opacity:.35':''}">${lic.hasED===false?'No ED on file':'Expert Discussion'}</span>
    <span class="ftag src-fgd" style="${!lic.hasFGD?'opacity:.35':''}">${lic.hasFGD?('FGD — '+(lic.fgdSessionCount||1)+' session'+((lic.fgdSessionCount||1)===1?'':'s')):'No FGD on file'}</span>
    ${lic.hasED===false?'<span class="ftag" title="This record was built entirely from business-side FGD testimony, not an official interview">FGD-only record — not verified against an official source</span>':''}
  </div>`;

  const bd = {online:lic.steps.filter(x=>x.automated===true).length, site:lic.steps.filter(x=>x.phase==='inspect').length};
  const nonInspectCount = lic.steps.filter(x=>x.phase!=='inspect').length;
  const se = lic.stepEquivalence;
  h += `<div class="grid g4" style="margin-bottom:16px">
    ${se ? kpiIcon('acc-primary','layers','Steps recorded', lic._stepCount+' raw / '+se.canonicalSubStageCount+' comparable', 'cross-state comparable count — see note below'+(se.stepSourceConfidence?' · '+se.stepSourceConfidence:'')) : kpiIcon('acc-primary','layers','Steps recorded', String(lic._stepCount), lic.hasED===false?'best-effort, from FGD testimony — not ED-verified':'exactly as the Expert Discussion describes them')}
    ${kpiIcon(lic._timeMid==null?'acc-warn':'acc-success','grid','Timeline', fmtDays(lic.timeline), (lic.timeline&&lic.timeline.basis)||'')}
    ${kpiIcon('acc-primary','check','Digitisation', lic._autoShare==null?'n/a':Math.round(lic._autoShare*100)+'%', bd.online+' of '+nonInspectCount+' non-inspection steps online'+(bd.site?' · '+bd.site+' on-site visit':''))}
    ${kpiIcon(lic.deemedApproval&&lic.deemedApproval.status==='yes'?'acc-success':'acc-danger','award','Deemed approval', lic.deemedApproval?({yes:'Yes',no:'No',unclear:'Not confirmed'}[lic.deemedApproval.status]||'Not confirmed'):'Not confirmed', (lic.deemedApproval&&lic.deemedApproval.days)?(lic.deemedApproval.days+' days'):'')}
  </div>`;
  if(lic.timeline && lic.timeline.text){
    h += `<div class="lede" style="margin:-10px 0 16px;font-size:12.5px"><b style="color:var(--ink)">Timeline, in full:</b> ${esc(lic.timeline.text)}</div>`;
  }

  h += renderVerification(lic);

  if(lic.steps.length){
    const seByStep = {}; if(se) se.mappings.forEach(m=>{ seByStep[m.stepN]=m; });
    h += `<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>${icon('layers')}Process — official record</h3></div>
      <div class="card-b"><div class="stepper">`+
      lic.steps.map(st=>{
        const m = seByStep[st.n];
        const subBadges = m ? m.subStages.map(code=>`<span class="ftag" title="${m.confidence==='low'?'Lower-confidence mapping — see Compare States for reasoning':'Evidence: '+esc(m.evidence)}" style="${m.confidence==='low'?'opacity:.6':''}">${esc(subStageLabel(lic.serviceCode,code))}</span>`).join('') : '';
        return `<div class="step-v"><div class="rail-col">${stepDot(st)}<div class="line"></div></div>
        <div class="body"><div class="sp">${esc(STAGE_MAP[st.phase]?.n||st.phase)}</div>
        <div class="st">${esc(st.title)}${stepBadge(st)}</div>
        ${st.note?`<div class="sd">${esc(st.note)}</div>`:''}
        ${subBadges?`<div style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap">${subBadges}</div>`:''}
        ${st.documents&&st.documents.length?`<div class="step-docs"><b>Documents required here (${st.documents.length})</b><ul>${st.documents.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div>`:''}
        </div></div>`;
      }).join('')+
      '</div></div></div>';
    if(se){
      h += `<div class="lede" style="margin:-10px 0 16px;font-size:12px"><b style="color:var(--ink)">Step-equivalence (pilot, Factory License only):</b> the purple tags above show which of this license's ${STEP_EQUIV[lic.serviceCode].canonicalSubStages.length} shared cross-state sub-stages each step actually covers — built from the real step text of all 22 pilot states, not assumed. One raw step can cover more than one sub-stage (e.g. "upload documents and pay the fee" in one step); a faded tag means the mapping is lower-confidence (the step text didn't clearly state it). This is what makes "${lic._stepCount} steps" comparable to another state's different step count. See Compare States to line this up against another state.</div>`;
    }
  }

  h += `<div class="grid g3" style="margin-bottom:16px">
    <div class="card"><div class="card-h"><h3>Fees &amp; validity</h3></div><div class="card-b" style="font-size:12.5px;color:var(--muted);line-height:1.6">
      <b style="color:var(--ink)">Fees</b><br>${esc((lic.fees&&lic.fees.text)||'Not stated')}<br><br><b style="color:var(--ink)">Validity</b><br>${esc((lic.validity&&lic.validity.text)||'Not stated')}</div></div>
    <div class="card"><div class="card-h"><h3>Deemed approval</h3></div><div class="card-b" style="font-size:12.5px;color:var(--muted);line-height:1.6">${deemedBadge(lic.deemedApproval)}<div style="margin-top:9px">${esc((lic.deemedApproval&&lic.deemedApproval.text)||'')}</div></div></div>
    <div class="card"><div class="card-h"><h3>Documents</h3></div><div class="card-b" style="font-size:12.5px;color:var(--muted);line-height:1.6">${(lic.documents||[]).length?'<ul style="margin:0;padding-left:16px">'+lic.documents.map(d=>`<li>${esc(d)}</li>`).join('')+'</ul>':'See step-level lists above where available.'}${lic.documentsNote?`<div style="margin-top:8px">${esc(lic.documentsNote)}</div>`:''}</div></div>
  </div>`;

  if(lic.remarks && lic.remarks.length){
    h += `<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Official's remarks &amp; recommendations</h3></div><div class="card-b">
      <ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--muted);line-height:1.7">${lic.remarks.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div></div>`;
  }

  if(lic.quotes && lic.quotes.length){
    h += `<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>${icon('user')}Quotes from the Focused Group Discussion</h3><span class="note">${lic.quotes.length} verbatim/lightly-trimmed quotes from participants</span></div>
      <div class="card-b"><div class="quotegrid scroll-y" style="max-height:420px">${lic.quotes.map(quoteCard).join('')}</div></div></div>`;
  }

  h += `<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>${icon('book')}Tagged findings</h3><span class="note">${lic.findings.length} total — category, topic tags, sentiment, each traced to its source transcript (ED or FGD)</span></div>
    <div class="card-b"><div class="scroll-y" style="max-height:600px">${lic.findings.map(findingItem).join('')||'<div class="hint">No findings extracted.</div>'}</div></div>`;

  h += `<div class="card"><div class="card-h"><h3>${icon('flask')}Gaps</h3><span class="note">${lic.gaps.length} flags for this license</span></div><div class="card-b">${lic.gaps.map(g=>gapItem(g,false)).join('')||'<div class="hint">None logged.</div>'}</div></div>`;

  return h;
}
function setLicense(svc){ F.license = svc; render(); }

function renderCompare(){
  const svc = F.service;
  const pool = statesWithService(svc);
  let h = `<div class="pagehead"><div><h2>${icon('columns')}Compare States — ${esc(SVC_BY_CODE[svc]?SVC_BY_CODE[svc].name:svc)}</h2><div class="lede">Pick 2 to 4 States/UTs that have this license to line up side by side. Change the license from the sidebar.</div></div></div>`;
  if(!pool.length) return h + '<div class="empty"><b>No States have this license yet</b></div>';
  h += `<div class="card" style="margin-bottom:16px"><div class="card-b"><div class="statepick">${pool.map(s=>`<button class="${F.cmp.includes(s.code)?'on':''}" onclick="toggleCmp('${s.code}')">${esc(s.name)} <span class="n">${s.code}</span></button>`).join('')}</div><div class="hint">Select up to 4. Selecting a 5th replaces the first pick.</div></div></div>`;
  const chosen = F.cmp.map(c=>({s:ST_BY_CODE[c], lic:licOf(c, svc)})).filter(x=>x.s && x.lic);
  if(chosen.length<2) return h+'<div class="empty"><b>Pick at least two States</b></div>';
  const hasStepEquiv = !!STEP_EQUIV[svc];
  h += `<div class="grid" style="grid-template-columns:repeat(${chosen.length},minmax(0,1fr));margin-bottom:16px">`+
    chosen.map(({s,lic})=>`<div class="cmp-col"><div class="cc-h"><div class="n">${esc(s.name)}</div><div class="s">${esc((lic.ed&&lic.ed.date)||'')}</div></div>
      <div class="cmp-row"><div class="l">Steps</div>${lic.stepEquivalence?`${lic._stepCount} raw / <b>${lic.stepEquivalence.canonicalSubStageCount} comparable</b>`:lic._stepCount}</div>
      <div class="cmp-row"><div class="l">Timeline</div>${fmtDays(lic.timeline)}</div>
      <div class="cmp-row"><div class="l">Digitisation</div>${autoLevelTag(lic)}</div>
      <div class="cmp-row"><div class="l">Deemed approval</div>${deemedBadge(lic.deemedApproval)}</div>
      <div class="cmp-row" style="border-bottom:0"><div class="l">Portal</div>${portalLink(lic)}</div>
      </div>`).join('')+'</div>';
  if(hasStepEquiv){
    h += `<div class="lede" style="margin:-10px 0 16px;font-size:12px"><b style="color:var(--ink)">Why "raw" and "comparable" differ (pilot, this license only):</b> one State's single step can cover more than one shared cross-state sub-stage (e.g. "upload documents and pay the fee" in one step), so raw step counts alone aren't a fair comparison. The comparable figure counts actual sub-stages covered, fact-checked against each State's real step text — see the sub-stage tags in the process view below.</div>`;
  }
  h += renderAlignedProcess(svc, chosen, hasStepEquiv);
  return h;
}

// Rows align by canonical sub-stage (when the pilot step-equivalence data exists for this
// license) or by the universal 7-phase tag otherwise — either way, the same point in the
// journey sits in the same row for every State, so a Secretary can read straight across.
function renderAlignedProcess(svc, chosen, hasStepEquiv){
  const rows = hasStepEquiv
    ? STEP_EQUIV[svc].canonicalSubStages.map(ss=>({key:ss.code, label:ss.label, mode:'sub'}))
    : PHASES.map(p=>({key:p.code, label:p.label, mode:'phase'}));

  const cellFor = (lic, row) => {
    let steps;
    if(row.mode==='sub'){
      const seByStep = {}; if(lic.stepEquivalence) lic.stepEquivalence.mappings.forEach(m=>{ seByStep[m.stepN]=m; });
      steps = lic.steps.filter(st=>{ const m=seByStep[st.n]; return m && m.subStages.includes(row.key); })
        .map(st=>({st, low: seByStep[st.n].confidence==='low'}));
    } else {
      steps = lic.steps.filter(st=>st.phase===row.key).map(st=>({st, low:false}));
    }
    if(!steps.length) return '<span class="alnone">Not recorded</span>';
    return steps.map(({st,low})=>`<div class="alstep ${low?'low':''}" title="${low?'Lower-confidence mapping':esc(st.title)}"><span class="d ${stepBadgeClass(st)}"></span><span>${esc(st.title)}</span></div>`).join('');
  };

  const nonEmptyRows = rows.filter(row => chosen.some(({lic})=>{
    if(row.mode==='sub'){ const se=lic.stepEquivalence; return se && se.mappings.some(m=>m.subStages.includes(row.key)); }
    return lic.steps.some(st=>st.phase===row.key);
  }));

  let h = `<div class="card"><div class="card-h"><h3>Process, side by side — aligned by stage</h3><span class="note">${hasStepEquiv?'Rows = shared cross-State sub-stages (pilot)':'Rows = the 7-phase process taxonomy'} — same stage, same row, for every State</span></div>
    <div class="card-b tight" style="overflow-x:auto"><table class="aligncmp">
    <thead><tr><th class="stagecol-h">Stage</th>${chosen.map(({s})=>`<th style="cursor:pointer" onclick="goStateService('${s.code}','${svc}')">${esc(s.name)}</th>`).join('')}</tr></thead>
    <tbody>`+
    nonEmptyRows.map(row=>`<tr><th>${esc(row.label)}</th>${chosen.map(({lic})=>`<td class="alcell">${cellFor(lic,row)}</td>`).join('')}</tr>`).join('')+
    '</tbody></table></div></div>';
  return h;
}
function toggleCmp(code){ const i=F.cmp.indexOf(code); if(i>=0) F.cmp.splice(i,1); else { if(F.cmp.length>=4) F.cmp.shift(); F.cmp.push(code); } render(); }

function renderPhase(){
  const svc = F.service;
  const stage = STAGE_MAP[F.phase || 'apply'];
  if(!F.phase) F.phase = 'apply';
  const phaseDef = PHASES.find(p=>p.code===F.phase);
  const pool = statesWithService(svc);
  let h = `<div class="pagehead"><div><h2>${icon('layers')}Stage comparison — ${esc(stage.n)}</h2>
    <div class="lede">${esc(phaseDef?phaseDef.desc:'')} License: <b>${esc(SVC_BY_CODE[svc]?SVC_BY_CODE[svc].name:svc)}</b> (change from the sidebar) · ${pool.length} States have it.</div></div></div>`;

  const withStep = pool.map(s=>({s, lic:licOf(s.code,svc), steps:licOf(s.code,svc).steps.filter(x=>x.phase===F.phase)})).filter(x=>x.steps.length);
  const groups = {online:[], mixed:[], site:[]};
  withStep.forEach(({s,lic,steps})=>{
    steps.forEach(st=>{
      const c = stepBadgeClass(st);
      groups[c==='online'?'online':c==='site'?'site':'mixed'].push({s, lic, st});
    });
  });
  const total = groups.online.length+groups.mixed.length+groups.site.length;
  if(total){
    h += `<div class="card" style="margin-bottom:16px"><div class="card-b"><div class="hbars">
      <div class="hbar" style="grid-template-columns:150px 1fr 50px"><div class="hb-n">Fully online</div><div class="hb-track"><div class="hb-fill" style="width:${groups.online.length/total*100}%;background:var(--success)"></div></div><div class="hb-v">${groups.online.length}</div></div>
      <div class="hbar" style="grid-template-columns:150px 1fr 50px"><div class="hb-n">Partly online</div><div class="hb-track"><div class="hb-fill" style="width:${groups.mixed.length/total*100}%;background:var(--warning)"></div></div><div class="hb-v">${groups.mixed.length}</div></div>
      <div class="hbar" style="grid-template-columns:150px 1fr 50px"><div class="hb-n">On-site visit</div><div class="hb-track"><div class="hb-fill" style="width:${groups.site.length/total*100}%;background:var(--info)"></div></div><div class="hb-v">${groups.site.length}</div></div>
      </div></div></div>`;
  }

  const col = (cls,label,items) => {
    let c = `<div class="stagecol"><div class="stagecol-h ${cls}">${icon(cls==='online'?'check':cls==='site'?'pin':'dash')}${label} (${items.length})</div>`;
    if(!items.length) c += '<div class="hint">No States recorded here.</div>';
    items.forEach(({s,lic,st})=>{
      const pipe = lic.steps.map(x=>{
        const xc = stepBadgeClass(x);
        const dotCls = xc==='online'?'on':xc==='site'?'site':xc==='mixed'?'mixed':'';
        return `<span class="md ${dotCls} ${x.n===st.n?'focus':''}" title="${esc(x.title)}"></span>`;
      }).join('');
      c += `<div class="statecard-mini" onclick="goStateService('${s.code}','${svc}')">
        <div class="n">${esc(s.name)} <span class="pos">step ${st.n} of ${lic._stepCount}</span></div>
        <div class="d"><b>${esc(st.title)}.</b> ${esc(st.note||'')}</div>
        <div class="mini-pipe">${pipe}</div>
        <div class="meta-row">${portalLink(lic)}</div>
      </div>`;
    });
    c += '</div>';
    return c;
  };

  h += `<div class="stagegrid">${col('online','Fully online', groups.online)}${col('mixed','Partly online / manual', groups.mixed)}${col('site','On-site visit (by design)', groups.site)}</div>`;

  const missing = pool.filter(s=>!licOf(s.code,svc).steps.some(x=>x.phase===F.phase));
  if(missing.length) h += `<div class="gap-note" style="margin-top:16px">${icon('dash')} No step was tagged to this stage for: ${missing.map(s=>esc(s.name)).join(', ')}.</div>`;
  h += `<div class="hint" style="margin-top:4px">Phase tags (pre / apply / fee / scrutiny / inspect / approve / renew) come directly from the structured ED extraction for each license — applied consistently across the whole dataset.</div>`;

  return h;
}

function serviceDropdown(id, current, allLabel){

}
function stateDropdown(id, current, allLabel, pool){
