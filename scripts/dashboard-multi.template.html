}

function painItem(f){
  return `<div class="gap-item"><div class="gi-head"><span class="gi-state" onclick="goState('${f.state}')">${esc(f.stateName||f.state)}</span><span class="gi-svc">${esc(f.serviceName||f.serviceCode||'')}</span>${f.source?`<span class="ftag src-${f.source}">${SRC_LABEL[f.source]||f.source}</span>`:''}${(f.tags||[]).map(t=>`<span class="ftag">${esc(t)}</span>`).join('')}</div>
    <div class="gi-text">${esc(f.text)}</div></div>`;
}

function renderPain(){
  const all = AGG.painPoints;
  const items = all.filter(f=>(F.painSvc==='all'||f.serviceCode===F.painSvc) && (F.painState==='all'||f.state===F.painState));

  // what businesses complain about most, by topic tag
  const tagCount = {};
  all.forEach(f=>(f.tags||[]).forEach(t=>{ tagCount[t]=(tagCount[t]||0)+1; }));
  const topTags = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const TAG_PLAIN = {PORTAL:'the online portal itself', TIMELINE:'how long it takes', CONSULT:'having to hire a consultant', DUPDOC:'submitting the same document twice', FEES:'fees and charges', CLARITY:'unclear instructions', INTERDEP:'chasing several departments', INSPECT:'inspections', QUERY:'queries raised on applications', CAPACITY:'staffing and capacity', COMPLY:'ongoing compliance', NORMS:'the rules themselves', RENEWAL:'renewals', GRIEVANCE:'getting a complaint heard', INFORMAL:'informal payments or influence'};
  const fromBiz = all.filter(f=>f.source==='fgd').length;

  let h = `<div class="crumb">The big picture · pain points</div>
    <div class="pagelede">${all.length.toLocaleString()} specific things businesses and officials told us go wrong${topTags.length?` — most often, ${esc(TAG_PLAIN[topTags[0][0]]||topTags[0][0].toLowerCase())}`:''}</div>
    <div class="pagesub">These are not opinions we formed. Each one is a problem stated in a field interview — ${fromBiz.toLocaleString()} of them by businesses who actually went through the process, the rest by the officials who run it. Filter to a license or State to see what is specific to it.</div>`;

  if(topTags.length){
    h += `<div class="takeaway"><div class="tk-h">The five commonest complaints</div><div class="tk-b"><ol>`+
      topTags.map(([t,n])=>`<li><b>${n}</b> about ${esc(TAG_PLAIN[t]||t.toLowerCase())}</li>`).join('')+
      `</ol></div></div>`;
  }

  h += `<div class="card" style="margin-bottom:16px"><div class="card-b"><div class="grid g2">
    <div class="fld"><label>Filter by license</label>${serviceDropdown('painSvcSel', F.painSvc, 'All licenses ('+all.length+')')}</div>
    <div class="fld"><label>Filter by State/UT</label>${stateDropdown('painStateSel', F.painState, 'All States/UTs', all)}</div>
  </div></div></div>`;
  const titleBits = [];
  if(F.painSvc!=='all') titleBits.push(esc(SVC_BY_CODE[F.painSvc]?SVC_BY_CODE[F.painSvc].name:F.painSvc));
  if(F.painState!=='all') titleBits.push(esc(ST_BY_CODE[F.painState]?ST_BY_CODE[F.painState].name:F.painState));
  h += `<div class="card"><div class="card-h"><h3>${titleBits.length?titleBits.join(' · '):'All licenses, all States/UTs'}</h3><span class="note">${items.length} pain points</span></div><div class="card-b scroll-y" style="max-height:900px">${items.map(painItem).join('')||'<div class="hint">None for this filter.</div>'}</div></div>`;
  return h;
}

function renderBest(){
  const all = [...AGG.goodPractices, ...AGG.reforms];
  const items = all.filter(g=>(F.bestSvc==='all'||g.serviceCode===F.bestSvc) && (F.bestState==='all'||g.state===F.bestState));

  const gp = AGG.gapFlagCounts.GOOD_PRACTICE||0, rf = AGG.gapFlagCounts.REFORM||0;
  const gpStates = new Set(AGG.goodPractices.map(g=>g.state)).size;

  let h = `<div class="crumb">The big picture · good practice &amp; reform</div>
    <div class="pagelede">${gp} things already working somewhere in India, and ${rf} fixes proposed by the people who run or use these processes</div>
    <div class="pagesub">Nothing here is our recommendation. Each good practice is something a State is genuinely doing that an official or a business singled out as working; each reform idea was proposed in a field interview. Because they are already real somewhere, they are the cheapest reforms to argue for — ${gpStates} different States contributed at least one.</div>`;

  h += `<div class="takeaway"><div class="tk-h">Why this page matters</div><div class="tk-b"><ol>
    <li><b>${gp}</b> good practices are in use right now — so the question for a slower State is not whether something can work, but why it has not been copied.</li>
    <li><b>${rf}</b> reform ideas came from the field rather than from us, which means each one already has someone inside the system willing to argue for it.</li>
    <li>Filter by State to build a case for one administration, or by license to see which approvals attract the most proposals.</li>
  </ol></div></div>`;

  h += `<div class="card" style="margin-bottom:16px"><div class="card-b"><div class="grid g2">
    <div class="fld"><label>Filter by license</label>${serviceDropdown('bestSvcSel', F.bestSvc, 'All licenses ('+(gp+rf)+')')}</div>
    <div class="fld"><label>Filter by State/UT</label>${stateDropdown('bestStateSel', F.bestState, 'All States/UTs', all)}</div>
  </div></div></div>`;
  const titleBits = [];
  if(F.bestSvc!=='all') titleBits.push(esc(SVC_BY_CODE[F.bestSvc]?SVC_BY_CODE[F.bestSvc].name:F.bestSvc));
  if(F.bestState!=='all') titleBits.push(esc(ST_BY_CODE[F.bestState]?ST_BY_CODE[F.bestState].name:F.bestState));
  h += `<div class="card"><div class="card-h"><h3>${titleBits.length?titleBits.join(' · '):'All licenses, all States/UTs'}</h3><span class="note">${items.length} items</span></div><div class="card-b scroll-y" style="max-height:900px">${items.map(g=>gapItem(g,true)).join('')||'<div class="hint">None for this filter.</div>'}</div></div>`;
  return h;
}

function renderReconcile(){
  const field = AGG.inconsistencies;                 // ED vs FGD, or a report against itself
  const rules = AGG.ruleConflicts || [];             // field record vs the published rule
  const fills = AGG.ruleGapFills || [];              // rules supplying what the field never captured
  const affected = new Set(field.map(g=>g.state+'/'+g.serviceCode));

  let h = `<div class="crumb">Evidence &amp; method · where sources disagree</div>
    <div class="pagelede">${field.length} places where our own sources tell different stories${rules.length?`, and ${rules.length} where the published rule disagrees with both`:''}</div>
    <div class="pagesub">Three things were asked about the same process: the official who issues the license, the businesses who applied for it, and the State's own published rules. Where they agree, we have a solid fact. Where they do not, this page shows every version rather than quietly picking one.</div>`;

  h += `<div class="takeaway"><div class="tk-h">What this shows</div><div class="tk-b"><ol>
    <li><b>${field.length}</b> contradictions inside the field record — an official describing the process one way and businesses describing it another, or a single report disagreeing with itself.</li>
    <li>These touch <b>${affected.size}</b> of ${AGG.totalLicenses} license records, so the field evidence is mostly internally consistent — the disagreements are concentrated, not everywhere.</li>
    ${rules.length?`<li>Separately, on <b>${rules.length}</b> specific facts the State's own published rule says something different from what the field record captured. These are the most actionable: the rule is citable.</li>`:''}
    ${fills.length?`<li><b>${fills.length}</b> facts the field record never captured at all were recovered from published rules — gaps closed after fieldwork had already ended.</li>`:''}
  </ol></div></div>`;

  if(rules.length){
    h += `<div class="card" style="margin-bottom:18px"><div class="card-h"><h3>${icon('scale')}The published rule disagrees with the field record</h3><span class="note">${rules.length} fact${rules.length===1?'':'s'}</span></div><div class="card-b">
      <div class="howto"><b>How to read:</b> each row is one fact where we found an official published rule saying something different from what was recorded in the field. The link goes to the exact document we read. Neither version is assumed correct — but the rule is the one you can cite.</div>`+
      rules.map(c=>`<details class="vdet"><summary>
          <span class="vmark v-contradicted">${icon('alert')}Rules disagree</span>
          <span class="vk" style="min-width:150px;cursor:pointer" onclick="event.preventDefault();goStateService('${c.state}','${c.serviceCode}')">${esc(c.stateName)}</span>
          <span class="vg">${esc(CHECK_LABEL[c.key]||c.key)} — ${esc(c.serviceName)}</span>
          <span class="vmore">detail</span></summary>
        <div class="vbody">
          <div class="gi-text"><b style="color:var(--ink)">Field record:</b> ${esc(c.primaryClaim||'—')}</div>
          ${c.sourceSays?`<div class="gi-text" style="margin-top:7px"><b style="color:var(--ink)">Published rule:</b> ${esc(c.sourceSays)}</div>`:''}
          ${c.citation?`<div style="margin-top:9px"><a class="chip-sm link" href="${esc(c.citation.url)}" target="_blank" rel="noopener">${icon('link')} ${esc((c.citation.title||c.citation.url).slice(0,95))}</a></div>`:''}
        </div></details>`).join('')+
      `</div></div>`;
  }

  if(fills.length){
    h += `<div class="card" style="margin-bottom:18px"><div class="card-h"><h3>${icon('book')}Gaps the published rules closed</h3><span class="note">${fills.length} fact${fills.length===1?'':'s'}</span></div><div class="card-b">
      <div class="howto"><b>How to read:</b> the field survey has ended, so these facts could not be recovered by asking again. Each one was found in a published rule instead.</div>`+
      fills.map(c=>`<details class="vdet"><summary>
          <span class="vmark v-fills_gap">${icon('book')}Gap filled</span>
          <span class="vk" style="min-width:150px;cursor:pointer" onclick="event.preventDefault();goStateService('${c.state}','${c.serviceCode}')">${esc(c.stateName)}</span>
          <span class="vg">${esc(CHECK_LABEL[c.key]||c.key)} — ${esc(c.serviceName)}</span>
          <span class="vmore">detail</span></summary>
        <div class="vbody">
          <div class="gi-text"><b style="color:var(--ink)">The field record said:</b> ${esc(c.primaryClaim||'—')}</div>
          ${c.sourceSays?`<div class="gi-text" style="margin-top:7px"><b style="color:var(--ink)">The published rule says:</b> ${esc(c.sourceSays)}</div>`:''}
          ${c.citation?`<div style="margin-top:9px"><a class="chip-sm link" href="${esc(c.citation.url)}" target="_blank" rel="noopener">${icon('link')} ${esc((c.citation.title||c.citation.url).slice(0,95))}</a></div>`:''}
        </div></details>`).join('')+
      `</div></div>`;
  }

  h += `<div class="card"><div class="card-h"><h3>${icon('alert')}Official account vs. business experience</h3><span class="note">${field.length} flagged while tagging the field record</span></div><div class="card-b">
    <div class="howto"><b>How to read:</b> these come from the field interviews themselves — either an official and a business describing the same process differently, or one report contradicting itself. Both sides are quoted in each entry.</div>
    <div class="scroll-y" style="max-height:900px">`+
    (field.length ? field.map(g=>gapItem(g,true)).join('') : '<div class="empty"><b>None logged</b></div>')+
    '</div></div></div>';
  return h;
}

function renderGaps(){
  const missing = (F.gapsSvc==='all') ? AGG.missing : AGG.missing.filter(g=>g.serviceCode===F.gapsSvc);
  const vague = (F.gapsSvc==='all') ? AGG.vague : AGG.vague.filter(g=>g.serviceCode===F.gapsSvc);
  const nMiss = AGG.gapFlagCounts.MISSING||0, nVague = AGG.gapFlagCounts.VAGUE||0;
  const filled = (AGG.ruleGapFills||[]).length;

  let h = `<div class="crumb">Evidence &amp; method · what we still don't know</div>
    <div class="pagelede">${(nMiss+nVague).toLocaleString()} facts the field survey never pinned down — and the field phase has now closed</div>
    <div class="pagesub">This is the deliberately uncomfortable page. Where a fact was never stated, or stated too vaguely to use, we record that rather than estimating it. Since the survey cannot be re-run, the only remaining way to close these is the State's own published rules${filled?` — which has already recovered <b>${filled}</b> of them`:''}.</div>`;

  h += `<div class="takeaway"><div class="tk-h">What this shows</div><div class="tk-b"><ol>
    <li><b>${nMiss.toLocaleString()}</b> facts no source stated at all — most often an exact fee or a precise timeline.</li>
    <li><b>${nVague.toLocaleString()}</b> more were mentioned but not in a usable form ("a few weeks", "nominal charges").</li>
    ${filled?`<li><b>${filled}</b> have since been recovered from published rules — see <span style="color:var(--primary);font-weight:700;cursor:pointer" onclick="goView('reconcile')">where sources disagree</span>.</li>`:''}
  </ol></div></div>`;

  h += `<div class="grid g4" style="margin-bottom:16px">
    ${kpiIcon('acc-danger','dash','Never stated', String(nMiss), 'no source gives this fact at all')}
    ${kpiIcon('acc-warn','alert','Too vague to use', String(nVague), 'mentioned, but not as a usable number')}
    ${filled?kpiIcon('acc-success','book','Recovered from rules', String(filled), 'closed after fieldwork ended'):''}
  </div>`;
  h += `<div class="card" style="margin-bottom:16px"><div class="card-b"><div class="fld" style="max-width:340px"><label>Filter by license</label>${serviceDropdown('gapsSvcSel', F.gapsSvc, 'All licenses ('+(nMiss+nVague)+')')}</div></div></div>`;
  h += `<div class="grid g2" style="align-items:start">
    <div class="card"><div class="card-h"><h3>${icon('dash')}Missing entirely</h3><span class="note">${missing.length}</span></div><div class="card-b scroll-y" style="max-height:700px">${missing.map(g=>gapItem(g,true)).join('')||'<div class="hint">None.</div>'}</div></div>
    <div class="card"><div class="card-h"><h3>${icon('alert')}Vague / unmeasurable</h3><span class="note">${vague.length}</span></div><div class="card-b scroll-y" style="max-height:700px">${vague.map(g=>gapItem(g,true)).join('')||'<div class="hint">None.</div>'}</div></div>
  </div>`;
  return h;
}

function renderMethod(){
  let h = `<div class="pagehead"><div><h2>${icon('book')}Method &amp; data quality</h2><div class="lede">What this dashboard is built from, how findings are tagged, and what is honestly not yet known.</div></div></div>`;

  h += `<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Current scope</h3></div><div class="card-b" style="font-size:12.5px;color:var(--muted);line-height:1.7">
    <p><b style="color:var(--ink)">There are three sources behind this dashboard, and they are never mixed.</b></p>
    <ol style="margin:0 0 10px;padding-left:19px">
      <li style="margin-bottom:7px"><b style="color:var(--ink)">Expert Discussions (<span class="ftag src-ed" style="display:inline">ED</span>)</b> — structured field interviews with the official who issues the license in that State. This is the authoritative account of the process as the department runs it.</li>
      <li style="margin-bottom:7px"><b style="color:var(--ink)">Focused Group Discussions (<span class="ftag src-fgd" style="display:inline">FGD</span>)</b> — field sessions with business owners who went through that exact process, in their own words. This is the only source that captures lived experience rather than stated procedure.</li>
      <li><b style="color:var(--ink)">Published rules (<span class="ftag src-secondary" style="display:inline">RULES</span>)</b> — an independent desk check of specific claims against the State's own gazette notifications, rules and official portals, each with the exact URL we fetched. This lane was added after the field phase closed, because gaps in the field record can no longer be resolved by going back to the field.</li>
    </ol>
    <p>The field phase covered <b style="color:var(--ink)">${AGG.totalLicenses} license records</b> across ${AGG.totalStates} States/UTs and up to ${AGG.totalServices} license types; ${AGG.licensesWithFGD} of them carry FGD evidence. Where both ED and FGD exist, FGD findings and quotes are layered onto the ED record without altering the ED's own structured facts; where only FGD exists, the record is built from business testimony and marked as unverified against an official source.</p>
    ${AGG.secondaryStates?`<p>The published-rules lane currently covers <b style="color:var(--ink)">${AGG.secondaryStates} license record${AGG.secondaryStates===1?'':'s'}</b> (${AGG.secondaryChecks} individual facts checked). It is deliberately narrow: it is a verification layer on specific facts, not a parallel dataset. A record with no rules check is shown as <i>not yet checked</i> — which is never the same as <i>checked and found wrong</i>.</p>`:''}
    <p>Gap flags are <code>MISSING</code>, <code>VAGUE</code>, <code>GOOD_PRACTICE</code>, <code>REFORM</code>, and <code>INCONSISTENT</code> — the last covers both a report contradicting itself and a genuine factual contradiction between sources, with both sides quoted. A difference in tone or emphasis alone is never flagged as inconsistent.</p>
  </div></div>`;

  h += `<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Tagging taxonomy</h3></div><div class="card-b" style="font-size:12.5px;color:var(--muted);line-height:1.7">
    <p>Every finding has a <b>category</b> (pain / policy / procedural / redundant / delay / suggestions / remarks), 0 or more <b>topic tags</b> (e.g. PORTAL, CONSULT, FEES, TIMELINE, INTERDEP), and a <b>sentiment</b> (issue / neutral / positive / suggestion). Every step carries a <b>phase</b> tag (pre / apply / fee / scrutiny / inspect / approve / renew), applied consistently across all ${AGG.totalLicenses} reports, which is what makes the Stage Comparison view genuinely cross-State comparable rather than just a list.</p>
  </div></div>`;

  if(Object.keys(STEP_EQUIV).length){
    const se = STEP_EQUIV.FAL;
    h += `<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Step-equivalence analysis (pilot)</h3></div><div class="card-b" style="font-size:12.5px;color:var(--muted);line-height:1.7">
      <p>A raw step count isn't a fair cross-State comparison — one State's single step can cover what another State splits into two or three. For <b style="color:var(--ink)">Factory License, across the ${Object.keys(se.stateMappings).length} States with FAL data</b>, every State's real step text was read and mapped to a shared set of ${se.canonicalSubStages.length} cross-State sub-stages (e.g. online application, document upload, fee payment, deficiency notice, inspection, approval), built bottom-up from the actual step text — never assumed from a generic idea of how factory licensing "should" work. A mapping is only made where the step's own wording supports it; where the text is too thin to be sure, the mapping is kept but flagged low-confidence rather than guessed. This gives a <b style="color:var(--ink)">comparable sub-stage count</b> alongside the raw step count, visible on State Profile and Compare States for this license. Currently scoped to Factory License only (the license used in the pilot demo); extending to other licenses is the next step.</p>
    </div></div>`;
  }

  h += `<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Format — why a single file</h3></div><div class="card-b" style="font-size:12.5px;color:var(--muted);line-height:1.7">
    <p>This is one self-contained HTML file — every finding and gap is embedded directly in it. No server, no database, no login: open it in a browser, email it, or host it anywhere as a static file. The build pipeline (<code>scripts/build-multi-dashboard.js</code>) is reproducible: adding a State's ED for a new license means adding one file under <code>scripts/ed_data/</code> and re-running the build, not redoing this by hand.</p>
  </div></div>`;

  h += `<div class="card"><div class="card-h"><h3>Coverage by license</h3></div><div class="card-b tight"><div class="scroll-y"><table class="dt"><thead><tr><th>License</th><th class="n">States</th><th class="n">Findings</th><th class="n">Gaps</th></tr></thead><tbody>`+
    SERVICES.filter(sv=>AGG.byService[sv.code]&&AGG.byService[sv.code].states.length).sort((a,b)=>AGG.byService[b.code].states.length-AGG.byService[a.code].states.length).map(sv=>{
      const agg = AGG.byService[sv.code];
      return `<tr><td><b>${esc(sv.name)}</b> <span class="hint" style="display:inline">${esc(sv.code)}</span></td><td class="n">${agg.states.length}</td><td class="n">${agg.totalFindings}</td><td class="n">${agg.totalGaps}</td></tr>`;
    }).join('')+
    '</tbody></table></div></div></div>';

  h += `<div class="hint" style="margin-top:14px">Generated ${esc(DATA.meta.generated)}. ${esc(DATA.meta.scope)}</div>`;
  return h;
}

/* ========================= ROUTER / INIT ========================= */

function render(){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('on', b.dataset.view===F.view));
  buildFilters();
  const c = document.getElementById('canvas');
  if(F.view==='start') c.innerHTML = renderStart();
  else if(F.view==='overview') c.innerHTML = renderOverview();
  else if(F.view==='state') c.innerHTML = renderState();
  else if(F.view==='compare') c.innerHTML = renderCompare();
  else if(F.view==='equiv') c.innerHTML = renderEquiv();
  else if(F.view==='phase') c.innerHTML = renderPhase();
  else if(F.view==='pain') c.innerHTML = renderPain();
  else if(F.view==='best') c.innerHTML = renderBest();
  else if(F.view==='reconcile') c.innerHTML = renderReconcile();
  else if(F.view==='gaps') c.innerHTML = renderGaps();
  else if(F.view==='method') c.innerHTML = renderMethod();
  window.scrollTo(0,0);
  animateBars();
  const painSel = document.getElementById('painSvcSel'); if(painSel) painSel.onchange = e=>{ F.painSvc=e.target.value; render(); };
  const painStateSel = document.getElementById('painStateSel'); if(painStateSel) painStateSel.onchange = e=>{ F.painState=e.target.value; render(); };
  const bestSel = document.getElementById('bestSvcSel'); if(bestSel) bestSel.onchange = e=>{ F.bestSvc=e.target.value; render(); };
  const bestStateSel = document.getElementById('bestStateSel'); if(bestStateSel) bestStateSel.onchange = e=>{ F.bestState=e.target.value; render(); };
  const gapsSel = document.getElementById('gapsSvcSel'); if(gapsSel) gapsSel.onchange = e=>{ F.gapsSvc=e.target.value; render(); };
}

function init(){
  buildNav();
  buildServicePicker();
  F.state = STATES[0]?.code;
  F.cmp = statesWithService(F.service).slice(0,2).map(s=>s.code);
  document.getElementById('downloadBtn').onclick = ()=>window.print();
  document.getElementById('globalSearch').addEventListener('input', e=>{
    F.search = e.target.value.trim().toLowerCase();
    if(F.view==='overview') render();
  });
  document.getElementById('globalSearch').addEventListener('keydown', e=>{
    if(e.key==='Enter'){
      const match = STATES.find(s=>s.name.toLowerCase().includes(e.target.value.trim().toLowerCase()));
      if(match) goState(match.code);
    }
  });
  render();
}
window.goView = goView; window.goState = goState; window.goStateService = goStateService;
window.toggleCmp = toggleCmp; window.setLicense = setLicense;
init();
</script>
</body>
</html>
